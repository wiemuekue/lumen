<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lumen">
<meta name="application-name" content="Lumen">
<meta name="format-detection" content="telephone=no">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#EEF0F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#07080F" media="(prefers-color-scheme: dark)">
<title>Lumen</title>
<style>
  :root {
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --font-rounded: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;

    --bg: #EEF0F8;
    --bg-grad: linear-gradient(160deg, #F5F2FC 0%, #EAF0FA 48%, #F7EFE8 100%);
    --blob1: rgba(124, 108, 255, 0.36);
    --blob2: rgba(255, 168, 88, 0.30);
    --blob3: rgba(52, 199, 170, 0.24);
    --accent-op: 0.30;

    --glass: rgba(255, 255, 255, 0.55);
    --glass-strong: rgba(255, 255, 255, 0.74);
    --glass-soft: rgba(255, 255, 255, 0.42);
    --glass-border: rgba(255, 255, 255, 0.25);
    --hl: inset 0 1px 0 rgba(255, 255, 255, 0.7), inset 0 0 0 0.5px rgba(255, 255, 255, 0.35);
    --shadow: 0 14px 40px rgba(40, 44, 90, 0.10), 0 2px 8px rgba(40, 44, 90, 0.05);
    --shadow-lg: 0 24px 60px rgba(40, 44, 90, 0.16), 0 4px 14px rgba(40, 44, 90, 0.06);

    --bar: rgba(244, 245, 251, 0.70);
    --tab-bg: rgba(255, 255, 255, 0.58);
    --tab-ind: rgba(118, 118, 128, 0.14);
    --sheet-bg: rgba(246, 247, 252, 0.86);
    --alert-bg: rgba(242, 242, 247, 0.84);

    --label: #0B0B12;
    --label2: rgba(60, 60, 67, 0.68);
    --label3: rgba(60, 60, 67, 0.36);
    --sep: rgba(60, 60, 67, 0.14);
    --fill: rgba(118, 118, 128, 0.12);
    --fill2: rgba(118, 118, 128, 0.20);
    --switch-off: rgba(120, 120, 128, 0.20);

    --tint: #5E5CE6;
    --tint-rgb: 94, 92, 230;
    --green: #34C759;
    --green-rgb: 52, 199, 89;
    --red: #FF3B30;
    --red-rgb: 255, 59, 48;
    --orange: #FF9500;

    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    --ease-sheet: cubic-bezier(0.32, 0.72, 0, 1);
    --ease-spring: cubic-bezier(0.34, 1.4, 0.64, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #07080F;
      --bg-grad: linear-gradient(160deg, #0B0C18 0%, #07080F 52%, #100B14 100%);
      --blob1: rgba(94, 92, 230, 0.34);
      --blob2: rgba(255, 120, 60, 0.18);
      --blob3: rgba(20, 170, 160, 0.20);
      --accent-op: 0.32;

      --glass: rgba(30, 32, 46, 0.52);
      --glass-strong: rgba(38, 40, 56, 0.80);
      --glass-soft: rgba(255, 255, 255, 0.06);
      --glass-border: rgba(255, 255, 255, 0.25);
      --hl: inset 0 1px 0 rgba(255, 255, 255, 0.16), inset 0 0 0 0.5px rgba(255, 255, 255, 0.06);
      --shadow: 0 18px 48px rgba(0, 0, 0, 0.45), 0 2px 8px rgba(0, 0, 0, 0.3);
      --shadow-lg: 0 28px 70px rgba(0, 0, 0, 0.55), 0 4px 14px rgba(0, 0, 0, 0.35);

      --bar: rgba(12, 13, 22, 0.62);
      --tab-bg: rgba(30, 32, 46, 0.64);
      --tab-ind: rgba(255, 255, 255, 0.12);
      --sheet-bg: rgba(22, 23, 34, 0.88);
      --alert-bg: rgba(40, 40, 52, 0.86);

      --label: #FFFFFF;
      --label2: rgba(235, 235, 245, 0.64);
      --label3: rgba(235, 235, 245, 0.32);
      --sep: rgba(255, 255, 255, 0.10);
      --fill: rgba(118, 118, 128, 0.24);
      --fill2: rgba(118, 118, 128, 0.36);
      --switch-off: rgba(120, 120, 128, 0.34);

      --tint: #7D7AFF;
      --tint-rgb: 125, 122, 255;
      --green: #30D158;
      --green-rgb: 48, 209, 88;
      --red: #FF453A;
      --red-rgb: 255, 69, 58;
      --orange: #FF9F0A;
    }
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; background: var(--bg); }
  body {
    font-family: var(--font);
    color: var(--label);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; -webkit-appearance: none; appearance: none; touch-action: manipulation; text-align: inherit; }
  button:focus-visible, input:focus-visible, label:focus-within { outline: 2px solid var(--tint); outline-offset: 2px; }
  button:disabled { cursor: default; }
  svg { display: block; }

  .glass {
    background: var(--glass);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    backdrop-filter: blur(28px) saturate(180%);
    border: 1px solid var(--glass-border);
    box-shadow: var(--shadow), var(--hl);
  }
  .tinted { --ink: var(--c-lo); }
  @media (prefers-color-scheme: dark) { .tinted { --ink: var(--c-hi); } }

  /* ---------- Background ---------- */
  #bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; background: var(--bg-grad); pointer-events: none; }
  .blob { position: absolute; border-radius: 50%; will-change: transform; }
  .b1 { width: 80vmax; height: 80vmax; left: -30vmax; top: -34vmax; background: radial-gradient(closest-side, var(--blob1), transparent); animation: drift1 28s ease-in-out infinite alternate; }
  .b2 { width: 70vmax; height: 70vmax; right: -30vmax; bottom: -26vmax; background: radial-gradient(closest-side, var(--blob2), transparent); animation: drift2 32s ease-in-out infinite alternate; }
  .b3 { width: 55vmax; height: 55vmax; left: -18vmax; bottom: 4vh; background: radial-gradient(closest-side, var(--blob3), transparent); animation: drift3 36s ease-in-out infinite alternate; }
  .b4 { width: 70vmax; height: 70vmax; right: -28vmax; top: 6vh; color: var(--tint); background: radial-gradient(closest-side, currentColor, transparent); opacity: var(--accent-op); transition: color 1.2s ease; animation: drift2 40s ease-in-out infinite alternate-reverse; }
  @keyframes drift1 { to { transform: translate(12vmax, 10vmax) scale(1.08); } }
  @keyframes drift2 { to { transform: translate(-10vmax, -8vmax) scale(1.12); } }
  @keyframes drift3 { to { transform: translate(14vmax, -12vmax) scale(0.92); } }

  /* ---------- App shell ---------- */
  #app { position: fixed; inset: 0; z-index: 1; transform-origin: 50% 100%; transition: transform 0.5s var(--ease-sheet), border-radius 0.5s var(--ease-sheet), filter 0.5s; }
  body.sheet-open #app { transform: scale(0.94) translateY(6px); border-radius: 22px; overflow: hidden; filter: brightness(0.86); }

  .view {
    position: absolute; inset: 0;
    overflow-y: auto; overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-y: contain;
    padding-top: env(safe-area-inset-top);
    padding-bottom: calc(env(safe-area-inset-bottom) + 60px);
    opacity: 0; visibility: hidden;
    transform: translateY(12px) scale(0.985);
    transition: opacity 0.3s ease, transform 0.45s var(--ease-out), visibility 0s linear 0.45s;
  }
  .view.active { opacity: 1; visibility: visible; transform: none; transition: opacity 0.3s ease, transform 0.45s var(--ease-out), visibility 0s; }
  .view-inner { max-width: 680px; margin: 0 auto; padding: 8px 16px 64px; }

  #navbar { position: fixed; top: 0; left: 0; right: 0; z-index: 20; height: calc(env(safe-area-inset-top) + 44px); padding-top: env(safe-area-inset-top); display: flex; align-items: center; justify-content: center; pointer-events: none; }
  #navbar::before { content: ""; position: absolute; inset: 0; background: var(--bar); -webkit-backdrop-filter: blur(28px) saturate(180%); backdrop-filter: blur(28px) saturate(180%); border-bottom: 0.5px solid var(--sep); opacity: 0; transition: opacity 0.25s ease; }
  #navbar.scrolled::before { opacity: 1; }
  #navbar .nt { position: relative; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; opacity: 0; transform: translateY(8px); transition: opacity 0.25s ease, transform 0.35s var(--ease-out); }
  #navbar.titled .nt { opacity: 1; transform: none; }

  .lh { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 14px 4px 16px; }
  .eyebrow { font-size: 13px; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; color: var(--label2); margin-bottom: 2px; }
  .lh h1 { font-family: var(--font-display); font-size: 34px; line-height: 41px; font-weight: 800; letter-spacing: -0.025em; }
  .section-title { font-size: 13px; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; color: var(--label2); padding: 26px 6px 8px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .section-title small { text-transform: none; letter-spacing: 0; font-weight: 500; font-size: 13px; }
  .section-note { font-size: 14px; line-height: 1.4; color: var(--label2); padding: 0 6px 12px; margin-top: -2px; }
  .footnote { font-size: 12.5px; color: var(--label3); text-align: center; padding: 22px 12px 0; line-height: 1.5; }

  /* ---------- Tab bar ---------- */
  #tabbar {
    position: fixed; z-index: 30; left: 50%;
    bottom: max(10px, calc(env(safe-area-inset-bottom) - 10px));
    transform: translateX(-50%);
    width: min(calc(100% - 28px), 440px); height: 64px;
    border-radius: 32px; padding: 5px;
    display: grid; grid-template-columns: repeat(4, 1fr);
    background: var(--tab-bg);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    backdrop-filter: blur(28px) saturate(180%);
    border: 1px solid var(--glass-border);
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.16), 0 2px 8px rgba(0, 0, 0, 0.06), var(--hl);
    transition: opacity 0.4s ease, transform 0.5s var(--ease-sheet);
  }
  body.sheet-open #tabbar { opacity: 0; transform: translate(-50%, 30px); pointer-events: none; }
  .tab-ind { position: absolute; top: 5px; bottom: 5px; left: 5px; width: calc((100% - 10px) / 4); border-radius: 27px; background: var(--tab-ind); box-shadow: var(--hl); transform: translateX(calc(var(--i, 0) * 100%)); transition: transform 0.55s var(--ease-spring); }
  .tab { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--label2); font-size: 10.5px; font-weight: 600; letter-spacing: 0.01em; border-radius: 27px; transition: color 0.25s ease, transform 0.2s ease; }
  .tab:active { transform: scale(0.92); }
  .tab svg { width: 25px; height: 25px; }
  .tab svg .fillable { fill: currentColor; fill-opacity: 0; transition: fill-opacity 0.25s ease; }
  .tab.active { color: var(--tint); }
  .tab.active svg .fillable { fill-opacity: 0.22; }
  .tab-badge { position: absolute; top: 3px; left: calc(50% + 5px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--red); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; box-shadow: 0 0 0 2px var(--tab-bg); font-variant-numeric: tabular-nums; }

  /* ---------- Common controls ---------- */
  .btn-primary, .btn-secondary { width: 100%; height: 54px; border-radius: 18px; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; display: flex; align-items: center; justify-content: center; gap: 8px; transition: transform 0.15s ease, background 0.3s ease, box-shadow 0.3s ease, color 0.3s ease, opacity 0.3s ease; }
  .btn-primary { color: #fff; background: linear-gradient(180deg, rgba(var(--c-rgb, var(--tint-rgb)), 1), rgba(var(--c-rgb, var(--tint-rgb)), 0.82)); box-shadow: 0 12px 26px rgba(var(--c-rgb, var(--tint-rgb)), 0.34), inset 0 1px 0 rgba(255, 255, 255, 0.35); }
  .btn-primary:active:not(:disabled), .btn-secondary:active { transform: scale(0.97); }
  .btn-primary:disabled { background: var(--fill); color: var(--label3); box-shadow: none; }
  .btn-secondary { background: var(--glass-soft); border: 1px solid var(--glass-border); color: var(--ink, var(--tint)); margin-top: 10px; }
  .btn-primary svg, .btn-secondary svg { width: 18px; height: 18px; }

  .switch { position: relative; display: inline-block; width: 51px; height: 31px; flex: none; }
  .switch input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; z-index: 2; cursor: pointer; }
  .switch .track { position: absolute; inset: 0; border-radius: 16px; background: var(--switch-off); transition: background 0.25s ease; }
  .switch .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15), 0 1px 1px rgba(0, 0, 0, 0.16); transition: transform 0.35s var(--ease-spring); }
  .switch input:checked + .track { background: var(--sw-on, var(--green)); }
  .switch input:checked + .track::after { transform: translateX(20px); }
  .switch input:focus-visible + .track { outline: 2px solid var(--tint); outline-offset: 2px; }

  .list { border-radius: 22px; overflow: hidden; }
  .row { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 11px 14px; text-align: left; }
  .row + .row::before { content: ""; position: absolute; top: 0; right: 0; left: var(--inset, 14px); height: 0.5px; background: var(--sep); }
  button.row:active, .row-main:active { background: var(--fill); }
  .row-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .row-title { font-size: 16.5px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.3; }
  .row-sub { font-size: 13.5px; color: var(--label2); line-height: 1.35; }
  .chev { color: var(--label3); flex: none; }
  .row.destructive { justify-content: center; color: var(--red); font-weight: 600; font-size: 17px; }

  .seg-ctl { display: grid; grid-template-columns: repeat(3, 1fr); padding: 2px; border-radius: 10px; background: var(--fill); position: relative; min-width: 210px; }
  .seg-ctl button { position: relative; z-index: 1; height: 30px; text-align: center; font-size: 13.5px; font-weight: 600; border-radius: 8px; color: var(--label); transition: background 0.25s ease, box-shadow 0.25s ease; }
  .seg-ctl button.on { background: var(--glass-strong); box-shadow: 0 3px 8px rgba(0, 0, 0, 0.12), 0 0 0 0.5px rgba(0, 0, 0, 0.04); }

  .pill-btn { flex: none; height: 30px; padding: 0 14px; border-radius: 15px; font-size: 14px; font-weight: 600; background: rgba(var(--c-rgb, var(--tint-rgb)), 0.14); color: var(--ink, var(--tint)); transition: transform 0.15s ease; }
  .pill-btn.solid { background: rgba(var(--c-rgb, var(--tint-rgb)), 0.95); color: #fff; }
  .pill-btn:active { transform: scale(0.94); }

  /* ---------- Today ---------- */
  .streak-pill { flex: none; display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px 0 9px; border-radius: 20px; font-family: var(--font-rounded); font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; transition: transform 0.15s ease; }
  .streak-pill:active { transform: scale(0.94); }

  .deck-summary { border-radius: 24px; padding: 14px 16px 12px; margin-bottom: 14px; }
  .ds-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .ds-title { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
  .ds-sub { font-size: 13.5px; color: var(--label2); margin-top: 1px; }
  .ring-wrap { position: relative; flex: none; display: grid; place-items: center; }
  .ring-wrap .ring-center { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-rounded); font-weight: 700; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .ring .ring-val { transition: stroke-dashoffset 1.2s var(--ease-out); }
  .segments { display: flex; gap: 6px; margin-top: 12px; }
  .seg { flex: 1; height: 22px; display: flex; align-items: center; border-radius: 6px; }
  .seg i { display: block; width: 100%; height: 6px; border-radius: 3px; background: var(--fill2); transition: background 0.4s ease, transform 0.3s ease, box-shadow 0.3s ease; }
  .seg.solved i { background: var(--c); }
  .seg.current i { background: rgba(var(--c-rgb), 0.45); box-shadow: 0 0 0 2px rgba(var(--c-rgb), 0.25); animation: segPulse 1.8s ease-in-out infinite; }
  .seg.bonus i { height: 4px; opacity: 0.85; }
  @keyframes segPulse { 50% { transform: scaleY(1.35); } }

  .stage { position: relative; }
  .stage.leaving > * { animation: cardOut 0.24s ease-in forwards; }
  .stage.entering > * { animation: cardIn 0.5s var(--ease-out) both; }
  @keyframes cardOut { to { opacity: 0; transform: translateX(-34px) scale(0.97); } }
  @keyframes cardIn { from { opacity: 0; transform: translateX(38px) scale(0.97); } to { opacity: 1; transform: none; } }

  .card { position: relative; border-radius: 30px; padding: 18px 18px 20px; overflow: hidden; }
  .card::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 260px; background: radial-gradient(120% 100% at 0% 0%, rgba(var(--c-rgb), 0.22), transparent 62%); pointer-events: none; }
  .card > * { position: relative; }
  .card-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
  .badge { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px 0 8px; border-radius: 14px; background: rgba(var(--c-rgb), 0.15); border: 1px solid rgba(var(--c-rgb), 0.24); color: var(--ink); font-size: 12.5px; font-weight: 700; letter-spacing: 0.01em; min-width: 0; max-width: 72%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge .emo { font-size: 14px; }
  .meta-tag { display: inline-flex; align-items: center; gap: 4px; flex: none; height: 24px; padding: 0 9px; border-radius: 12px; font-size: 12px; font-weight: 700; color: var(--label2); background: var(--fill); font-variant-numeric: tabular-nums; }
  .card-title { font-family: var(--font-display); font-size: clamp(24px, 6.6vw, 30px); line-height: 1.12; font-weight: 800; letter-spacing: -0.024em; margin-bottom: 14px; text-wrap: balance; }
  .card-actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
  .play { flex: none; white-space: nowrap; display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px 0 6px; border-radius: 18px; background: rgba(var(--c-rgb), 0.13); border: 1px solid rgba(var(--c-rgb), 0.18); color: var(--ink); font-size: 14px; font-weight: 600; transition: transform 0.15s ease, background 0.25s ease; }
  .play:active { transform: scale(0.95); }
  .play-ico { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--c); color: #fff; display: grid; place-items: center; box-shadow: 0 4px 10px rgba(var(--c-rgb), 0.35); }
  .play-ico svg { width: 12px; height: 12px; margin-left: 1px; }
  .play .eq { display: none; align-items: flex-end; gap: 2px; height: 12px; }
  .play .eq i { width: 3px; border-radius: 1.5px; background: #fff; animation: eq 0.9s ease-in-out infinite; }
  .play .eq i:nth-child(1) { height: 60%; animation-delay: -0.3s; }
  .play .eq i:nth-child(2) { height: 100%; animation-delay: -0.6s; }
  .play .eq i:nth-child(3) { height: 45%; animation-delay: -0.1s; }
  .play.playing .play-ico svg { display: none; }
  .play.playing .eq { display: flex; }
  .play-dur { color: var(--label2); font-weight: 500; font-variant-numeric: tabular-nums; }
  @keyframes eq { 0%, 100% { transform: scaleY(0.35); } 50% { transform: scaleY(1); } }
  .play .eq i { transform-origin: bottom; }
  .mastered-note { font-size: 12.5px; font-weight: 600; color: var(--label2); display: inline-flex; align-items: center; gap: 5px; }
  .mastered-note svg { color: var(--green); width: 14px; height: 14px; }

  .story { font-size: 17px; line-height: 1.58; letter-spacing: -0.005em; -webkit-user-select: text; user-select: text; hyphens: auto; -webkit-hyphens: auto; }
  .funfact { margin-top: 18px; padding: 14px 16px 15px; border-radius: 20px; background: rgba(var(--c-rgb), 0.10); border: 1px solid rgba(var(--c-rgb), 0.24); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18); }
  .ff-head { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink); margin-bottom: 6px; }
  .ff-head svg { width: 16px; height: 16px; }
  .funfact p { font-size: 15.5px; line-height: 1.52; -webkit-user-select: text; user-select: text; hyphens: auto; -webkit-hyphens: auto; }

  .quiz { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--sep); }
  .quiz-head { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: var(--label2); }
  .quiz-head svg { width: 15px; height: 15px; }
  .question { font-size: 18.5px; font-weight: 700; line-height: 1.35; letter-spacing: -0.012em; margin: 8px 0 14px; text-wrap: pretty; }
  .options { display: flex; flex-direction: column; gap: 10px; }

  let flameSeq = 0;
  function flameSVG(size, lit) {
    const id = "fl" + (++flameSeq);
    return '<svg class="flame ' + (lit ? "lit" : "off") + '" width="' + size + '" height="' + size + '" viewBox="0 0 64 64" aria-hidden="true">' +
      '<defs><linearGradient id="' + id + 'a" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#FF2D55"/><stop offset=".5" stop-color="#FF7A00"/><stop offset="1" stop-color="#FFCC00"/></linearGradient>' +
      '<linearGradient id="' + id + 'b" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#FFB000"/><stop offset="1" stop-color="#FFF4B8"/></linearGradient></defs>' +
      '<path class="fo" fill="url(#' + id + 'a)" d="M32 3c2 11 12 16 16 26 3 7 3 15 0 21-4 8-10 11-16 11-8 0-16-6-17-16-1-8 3-14 7-18 0 5 2 8 5 9-2-10 1-23 5-33z"/>' +
      '<path class="fi" fill="url(#' + id + 'b)" d="M32 30c2 7 9 10 9 18 0 6-4 10-9 10s-9-4-9-9c0-5 3-8 5-10 0 3 1 5 3 5-1-5-1-10 1-14z"/></svg>';
  }
  function ringSVG(size, stroke, rings) {
    const c = size / 2;
    let r = (size - stroke) / 2;
    let out = '<svg class="ring" width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + " " + size + '" aria-hidden="true">';
    rings.forEach(rg => {
      const C = 2 * Math.PI * r;
      const p = Math.max(0, Math.min(1, rg.pct || 0));
      out += '<circle cx="' + c + '" cy="' + c + '" r="' + r + '" fill="none" style="stroke:' + rg.color + ';stroke-opacity:.18" stroke-width="' + stroke + '"/>';
      out += '<circle class="ring-val" cx="' + c + '" cy="' + c + '" r="' + r + '" fill="none" style="stroke:' + rg.color + ";stroke-dashoffset:" + C.toFixed(2) + ";" + (p === 0 ? "stroke-opacity:0;" : "") + '" stroke-width="' + stroke + '" stroke-linecap="round" stroke-dasharray="' + C.toFixed(2) + '" data-to="' + (C * (1 - p)).toFixed(2) + '" transform="rotate(-90 ' + c + " " + c + ')"/>';
      r -= stroke + 2.5;
    });
    return out + "</svg>";
  }
  function animateRings(root) {
    requestAnimationFrame(() => requestAnimationFrame(() => {
      $$(".ring-val[data-to]", root).forEach(el => { el.style.strokeDashoffset = el.dataset.to; });
    }));
  }

  /* =====================================================================
     KARTEN-DARSTELLUNG
     ===================================================================== */
  function cardHTML(card, o) {
    const cat = catOf(card);
    const q = card.quiz;
    const solved = !!o.solved;
    const wrong = o.wrong || [];
    const letters = ["A", "B", "C"];
    const opts = q.options.map((txt, i) => {
      let cls = "option";
      let dis = false;
      if (solved) { cls += i === q.correct ? " correct" : " dim"; dis = true; }
      else if (wrong.indexOf(i) !== -1) { cls += " wrong"; dis = true; }
      if (o.mode === "read") dis = true;
      const act = o.mode === "deck" ? ' data-action="answer" data-id="' + card.id + '" data-i="' + i + '"' : "";
      return '<button class="' + cls + '"' + act + (dis ? " disabled" : "") + '>' +
        '<span class="opt-letter">' + letters[i] + '</span><span class="opt-text">' + esc(txt) + '</span>' +
        '<span class="opt-mark">' + (i === q.correct ? I.checkCircle : I.crossCircle) + "</span></button>";
    }).join("");

    let meta = "";
    if (o.mode === "deck") {
      const tags = [];
      if (o.isReview) tags.push('<span class="meta-tag">' + I.repeat + " Wiederholung</span>");
      if (o.isBonus) tags.push('<span class="meta-tag">' + I.star + " Bonus</span>");
      tags.push('<span class="meta-tag">' + (o.pos + 1) + " / " + o.total + "</span>");
      meta = '<span style="display:flex;gap:6px;flex:none">' + tags.join("") + "</span>";
    }

    const playBtn = TTS.ok
      ? '<button class="play" data-action="speak" data-id="' + card.id + '" aria-label="Karte vorlesen"><span class="play-ico">' + I.play +
        '<span class="eq"><i></i><i></i><i></i></span></span><span class="play-label">Anhören</span><span class="play-dur">' + speakDuration(card) + "</span></button>"
      : "<span></span>";

    const masteredNote = o.mode === "read" && isMastered(card.id)
      ? '<span class="mastered-note">' + I.checkCircle + " Gemeistert am " + fmtDate.format(new Date(state.mastered[card.id])) + "</span>"
      : "";

    const explain = '<div class="explain" ' + (solved || o.mode === "read" ? "" : "hidden") + '><b>' + I.check + " Richtig!</b><p>" + esc(q.explanation) + "</p></div>";
    const hint = o.mode === "deck" && !solved && wrong.length ? '<p class="hint">Nicht ganz – versuch es noch einmal.</p>' : "";

    let nextBtn = "";
    if (o.mode === "deck") {
      const label = solved ? nextLabel(o.openAfter) : I.lock + " Beantworte das Quiz";
      nextBtn = '<button class="btn-primary next" data-action="next"' + (solved ? "" : " disabled") + ">" + label + "</button>";
    }

    return '<article class="card glass tinted" style="' + catStyle(cat) + '" data-card="' + card.id + '">' +
      '<div class="card-top"><span class="badge"><span class="emo">' + cat.emoji + "</span>" + esc(card.category) + "</span>" + meta + "</div>" +
      '<h2 class="card-title">' + esc(card.title) + "</h2>" +
      '<div class="card-actions">' + playBtn + masteredNote + "</div>" +
      '<p class="story">' + esc(card.story) + "</p>" +
      '<div class="funfact"><div class="ff-head">' + I.bulb + "Schon gewusst?</div><p>" + esc(card.funFact) + "</p></div>" +
      '<div class="quiz"><div class="quiz-head">' + I.quiz + 'Quiz</div><p class="question">' + esc(q.question) + "</p>" +
      '<div class="options">' + opts + "</div>" + hint + explain + "</div>" +
      nextBtn + "</article>";
  }

  /* =====================================================================
     TAB: HEUTE
     ===================================================================== */
  function renderStreakPill() {
    const pill = $("#streakPill");
    pill.innerHTML = flameSVG(24, state.streak > 0) + "<span>" + state.streak + "</span>";
    pill.setAttribute("aria-label", "Streak: " + plural(state.streak, "Tag", "Tage"));
  }
  function renderSummary() {
    const d = state.daily;
    const seq = sequence();
    const solvedCore = d.ids.filter(id => d.solved[id]).length;
    const cur = currentCardId();
    const segs = seq.map(id => {
      const cat = catOf(CARD_BY_ID[id]);
      const cls = ["seg"];
      if (d.solved[id]) cls.push("solved");
      if (id === cur) cls.push("current");
      if (d.bonus.indexOf(id) !== -1) cls.push("bonus");
      return '<button class="' + cls.join(" ") + '" style="' + catStyle(cat) + '" data-action="focus" data-id="' + id + '" aria-label="' + esc(CARD_BY_ID[id].title) + '"><i></i></button>';
    }).join("");
    const pct = d.ids.length ? solvedCore / d.ids.length : 0;
    let sub;
    if (d.done) sub = "Tagesziel erreicht · " + plural(d.ids.length, "Karte", "Karten") + " gelöst";
    else sub = solvedCore + " von " + d.ids.length + " Karten gelöst";
    const bonusSolved = d.bonus.filter(id => d.solved[id]).length;
    if (d.bonus.length) sub += " · " + bonusSolved + "/" + d.bonus.length + " Bonus";
    $("#deckSummary").innerHTML =
      '<div class="deck-summary glass"><div class="ds-top"><div><div class="ds-title">Dein Tagesstapel</div><div class="ds-sub">' + sub + "</div></div>" +
      '<div class="ring-wrap">' + ringSVG(46, 5, [{ pct: pct, color: d.done ? "var(--green)" : "var(--tint)" }]) +
      '<span class="ring-center">' + (d.done ? '<span style="display:block;color:var(--green);width:18px;height:18px">' + I.check + "</span>" : solvedCore + "/" + d.ids.length) + "</span></div></div>" +
      '<div class="segments">' + segs + "</div></div>";
    animateRings($("#deckSummary"));
  }
  function renderToday(animate) {
    ensureDeck();
    const d = state.daily;
    $("#todayEyebrow").textContent = fmtLong.format(new Date());
    renderStreakPill();
    renderSummary();
    const stage = $("#deckStage");
    const cur = currentCardId();
    const seq = sequence();
    if (cur) {
      const card = CARD_BY_ID[cur];
      const openAfter = seq.filter(id => !d.solved[id] && id !== cur);
      stage.innerHTML = cardHTML(card, {
        mode: "deck",
        pos: seq.indexOf(cur),
        total: seq.length,
        solved: !!d.solved[cur],
        wrong: d.wrong[cur] || [],
        isBonus: d.bonus.indexOf(cur) !== -1,
        isReview: d.review.indexOf(cur) !== -1,
        openAfter: openAfter.length
      });
      setAccent(catOf(card).color);
    } else {
      stage.innerHTML = completeHTML();
      setAccent("#FF9500");
    }
    if (animate) {
      stage.classList.remove("entering");
      void stage.offsetWidth;
      stage.classList.add("entering");
    }
    TTS.sync();
    updateBadge();
  }
  function completeHTML() {
    const d = state.daily;
    const seq = sequence();
    const firstTry = seq.filter(id => d.solved[id] && !(d.wrong[id] || []).length).length;
    const solvedN = seq.filter(id => d.solved[id]).length;
    const acc = solvedN ? Math.round(firstTry / solvedN * 100) : 0;
    const pool = CARDS.filter(c => isActive(catOf(c)) && seq.indexOf(c.id) === -1 && !isMastered(c.id));
    const bonusBtn = pool.length
      ? '<button class="btn-primary" data-action="bonus">' + I.sparkle + " Bonuskarte ziehen</button>"
      : '<button class="btn-primary" data-action="goto" data-tab="categories">' + I.plus + " Neue Themen freischalten</button>";
    const rows = seq.map(id => {
      const c = CARD_BY_ID[id];
      const cat = catOf(c);
      return '<button class="row today-row tinted" style="' + catStyle(cat) + ';--inset:36px" data-action="read" data-id="' + id + '">' +
        '<span class="dot"></span><span class="row-text"><span class="row-title">' + esc(c.title) + '</span><span class="row-sub">' + cat.emoji + " " + esc(cat.short) + (d.bonus.indexOf(id) !== -1 ? " · Bonus" : "") + "</span></span>" +
        '<span class="chev">' + I.chevron + "</span></button>";
    }).join("");
    return '<div class="complete glass">' +
      '<div class="cp-flame">' + flameSVG(92, true) + "</div>" +
      "<h2>Tagesziel erreicht!</h2>" +
      '<p class="cp-text">Stark – alle Karten von heute sitzen. Deine Serie steht bei ' + plural(state.streak, "Tag", "Tagen") + ".</p>" +
      '<div class="cp-stats"><div class="cp-stat"><b>' + state.streak + '</b><span>Streak</span></div><div class="cp-stat"><b>' + solvedN + '</b><span>Gelöst</span></div><div class="cp-stat"><b>' + acc + '%</b><span>1. Versuch</span></div></div>' +
      '<div class="cp-next" id="countdown">' + I.clock + "<span>" + countdownText() + "</span></div>" +
      bonusBtn +
      '<button class="btn-secondary" data-action="goto" data-tab="archive">Zum Archiv</button></div>' +
      '<div class="section-title">Heute gelernt</div><div class="list glass">' + rows + "</div>";
  }
  function nextLabel(openLeft) {
    if (openLeft > 0) return "Weiter " + I.arrow;
    return ui.celebrate ? I.sparkle + " Tagesziel abschließen" : I.sparkle + " Fertig";
  }
  function countdownText() {
    const now = new Date();
    const mid = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
    const mins = Math.max(1, Math.ceil((mid - now) / 60000));
    const h = Math.floor(mins / 60), m = mins % 60;
    return "Neuer Stapel in " + (h ? h + " Std. " : "") + m + " Min.";
  }
  function setAccent(hex) { $("#accentBlob").style.color = hex; }
  function updateBadge() {
    const d = state.daily;
    if (!d) return;
    const open = sequence().filter(id => !d.solved[id]).length;
    const b = $("#todayBadge");
    b.hidden = open === 0;
    b.textContent = open;
  }

  function onAnswer(btn) {
    const card = CARD_BY_ID[btn.dataset.id];
    const i = Number(btn.dataset.i);
    const d = state.daily;
    if (!card || d.solved[card.id] || btn.disabled) return;
    const cardEl = btn.closest(".card");
    const quiz = btn.closest(".quiz");
    if (i === card.quiz.correct) {
      d.solved[card.id] = true;
      ui.focusId = card.id;
      state.stats.answered++;
      if (!(d.wrong[card.id] || []).length) state.stats.firstTry++;
      if (!state.mastered[card.id]) state.mastered[card.id] = Date.now();
      checkCompletion();
      save();
      haptic("success");
      $$(".option", quiz).forEach((b, idx) => {
        b.disabled = true;
        b.classList.remove("wrong");
        if (idx === card.quiz.correct) b.classList.add("correct", "pop");
        else b.classList.add("dim");
      });
      const h = $(".hint", quiz); if (h) h.remove();
      const ex = $(".explain", quiz); ex.hidden = false;
      const seq = sequence();
      const openLeft = seq.filter(id => !d.solved[id]).length;
      const next = $(".next", cardEl);
      next.disabled = false;
      next.innerHTML = nextLabel(openLeft);
      renderSummary();
      renderStreakPill();
      updateBadge();
      setTimeout(() => { try { next.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "nearest" }); } catch (e) { next.scrollIntoView(false); } }, 260);
    } else {
      const w = d.wrong[card.id] || (d.wrong[card.id] = []);
      if (w.indexOf(i) === -1) w.push(i);
      state.stats.wrong++;
      save();
      haptic("error");
      btn.classList.add("wrong");
      btn.classList.remove("shake");
      void btn.offsetWidth;
      btn.classList.add("shake");
      btn.disabled = true;
      if (!$(".hint", quiz)) {
        const p = document.createElement("p");
        p.className = "hint";
        p.textContent = "Nicht ganz – versuch es noch einmal.";
        $(".options", quiz).after(p);
      }
    }
  }
  function onNext() {
    TTS.stop();
    ui.focusId = null;
    const stage = $("#deckStage");
    const celebrate = ui.celebrate;
    ui.celebrate = false;
    const go = () => {
      stage.classList.remove("leaving");
      renderToday(true);
      const v = $("#view-today");
      v.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" });
      if (celebrate) {
        confetti();
        haptic("success");
        toast("Tagesziel erreicht – " + plural(state.streak, "Tag", "Tage") + " in Folge!", "🔥");
      }
    };
    if (reduceMotion) { go(); return; }
    stage.classList.remove("entering");
    stage.classList.add("leaving");
    setTimeout(go, 230);
  }
  function drawBonus() {
    const d = state.daily;
    const seq = sequence();
    const pool = CARDS.filter(c => isActive(catOf(c)) && seq.indexOf(c.id) === -1 && !isMastered(c.id));
    if (!pool.length) { toast("Alle Karten deiner Themen sind gemeistert!", "🏆"); return; }
    const pick = pool[Math.floor(Math.random() * pool.length)];
    d.bonus.push(pick.id);
    save();
    ui.focusId = null;
    haptic("light");
    renderToday(true);
    $("#view-today").scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" });
  }
  function learnNow(id) {
    const d = ensureDeck();
    if (d.ids.indexOf(id) === -1 && d.bonus.indexOf(id) === -1) { d.bonus.push(id); save(); }
    ui.focusId = id;
    closeSheet();
    switchTab("today");
    renderToday(true);
    $("#view-today").scrollTo({ top: 0 });
  }

    const cardN = CARDS.filter(c => isActive(catOf(c))).length;
    const rows = avail.map(cat => {
      const list = cardsOf(cat);
      const m = list.filter(c => isMastered(c.id)).length;

        '<span class="row-sub">' + plural(list.length, "Karte", "Karten") + " · " + m + " gemeistert" + (on ? "" : " · pausiert") + "</span>" +

    }).join("");

    const sugg = CATEGORIES.filter(c => c.suggested && !isAvailable(c));
    const suggHTML = sugg.length
      ? '<div class="sug-grid">' + sugg.map(cat =>
          '<button class="sug glass tinted" style="' + catStyle(cat) + '" data-action="unlock" data-key="' + cat.key + '" aria-label="' + esc(cat.name) + ' freischalten">' +
          '<span class="sug-emoji">' + cat.emoji + '</span><span class="sug-name">' + hyph(cat.name) + '</span><span class="sug-desc">' + esc(cat.desc) + "</span>" +
          '<span class="sug-foot"><span>' + plural(cardsOf(cat).length, "Karte", "Karten") + '</span><span class="sug-plus">' + I.plus + "</span></span></button>").join("") + "</div>"

     ===================================================================== */
  function fold(s) {
    let o = "";
    for (let i = 0; i < s.length; i++) {
      const ch = s[i];
      let f = ch.normalize ? ch.normalize("NFD")[0] : ch;
      const low = f.toLowerCase();
      o += low.length === 1 ? low : f;
    }
    return o;
  }
  function termsOf(q) { return fold(q.trim()).split(/\s+/).filter(Boolean); }
  function haystack(c) {
    return [c.title, c.category, c.story, c.funFact, c.quiz.question, c.quiz.options.join(" "), c.quiz.explanation].join(" \n ");
  }
  function highlight(text, terms) {
    if (!terms.length) return esc(text);
    const f = fold(text);
    const ranges = [];
    terms.forEach(t => {
      let i = f.indexOf(t);
      while (i !== -1 && t.length) { ranges.push([i, i + t.length]); i = f.indexOf(t, i + t.length); }
    });
    if (!ranges.length) return esc(text);
    ranges.sort((a, b) => a[0] - b[0]);
    const merged = [];
    ranges.forEach(r => {
      const last = merged[merged.length - 1];
      if (last && r[0] <= last[1]) last[1] = Math.max(last[1], r[1]); else merged.push(r.slice());
    });
    let out = "", pos = 0;
    merged.forEach(r => { out += esc(text.slice(pos, r[0])) + "<mark>" + esc(text.slice(r[0], r[1])) + "</mark>"; pos = r[1]; });
    return out + esc(text.slice(pos));
  }
  function snippet(c, terms) {
    const sources = [c.story, c.funFact, c.quiz.question, c.quiz.explanation];
    if (terms.length) {
      for (const s of sources) {
        const f = fold(s);
        let idx = -1;
        for (const t of terms) { const i = f.indexOf(t); if (i !== -1 && (idx === -1 || i < idx)) idx = i; }
        if (idx !== -1) {
          let start = Math.max(0, idx - 48);
          if (start > 0) { const sp = s.indexOf(" ", start); if (sp !== -1 && sp < idx) start = sp + 1; }
          const piece = s.slice(start, start + 170);
          return (start > 0 ? "… " : "") + highlight(piece, terms) + (start + 170 < s.length ? " …" : "");
        }
      }
    }
    return esc(c.story.length > 150 ? c.story.slice(0, 150).replace(/\s+\S*$/, "") + " …" : c.story);
  }
  function renderArchive() {
    const ids = masteredIds();
    $("#archiveEyebrow").textContent = plural(ids.length, "Karte", "Karten") + " gemeistert";

      .concat(CATEGORIES.filter(c => counts[c.key]).map(c =>
        '<button class="chip' + (ui.archiveFilter === c.key ? " on" : "") + '" style="' + catStyle(c) + '" data-action="chip" data-key="' + c.key + '">' + c.emoji + " " + esc(c.short) + ' <span class="n">' + counts[c.key] + "</span></button>"));

  (function setupSheetDrag() {
    const sheet = $("#sheet"), body = $("#sheetBody");
    let startY = 0, dy = 0, dragging = false, t0 = 0, fromHead = false;
    sheet.addEventListener("touchstart", e => {
      if (!document.body.classList.contains("sheet-open")) return;
      fromHead = !!e.target.closest(".sheet-head");
      if (!fromHead && body.scrollTop > 0) return;
      startY = e.touches[0].clientY; dy = 0; dragging = true; t0 = Date.now();
    }, { passive: true });
    sheet.addEventListener("touchmove", e => {
      if (!dragging) return;
      dy = e.touches[0].clientY - startY;
      if (dy <= 0) {
        sheet.style.transform = "";
        if (!fromHead) { dragging = false; sheet.style.transition = ""; }
        return;
      }
      if (e.cancelable) e.preventDefault();
      sheet.style.transition = "none";
      sheet.style.transform = "translateY(" + dy + "px)";
    }, { passive: false });
    const end = () => {
      if (!dragging) return;
      dragging = false;
      sheet.style.transition = "";
      const v = dy / Math.max(1, Date.now() - t0);
      if (dy > 140 || (dy > 40 && v > 0.55)) closeSheet(); else sheet.style.transform = "";
    };
    sheet.addEventListener("touchend", end);
    sheet.addEventListener("touchcancel", end);
  })();

  function confetti() {
    if (reduceMotion) return;

    document.body.appendChild(cv);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const W = window.innerWidth, H = window.innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    const g = cv.getContext("2d");
    g.scale(dpr, dpr);
    const colors = CATEGORIES.map(c => c.color).concat(["#FFD60A", "#FF9F0A", "#30D158", "#FF375F"]);
    const parts = [];
    for (let i = 0; i < 150; i++) {
      const ang = -Math.PI / 2 + (Math.random() - 0.5) * 1.9;
      const sp = 7 + Math.random() * 11;
      parts.push({
        x: W / 2 + (Math.random() - 0.5) * 40, y: H * 0.34,
        vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
        w: 6 + Math.random() * 6, h: 9 + Math.random() * 8,
        r: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.35,
        c: colors[Math.floor(Math.random() * colors.length)], round: Math.random() < 0.3
      });
    }
    const t0 = performance.now();
    function frame(t) {
      const el = (t - t0) / 1000;
      g.clearRect(0, 0, W, H);
      const alpha = Math.max(0, 1 - Math.max(0, el - 1.9) / 1.1);
      parts.forEach(p => {
        p.vy += 0.32; p.vx *= 0.985; p.vy *= 0.985;
        p.x += p.vx; p.y += p.vy; p.r += p.vr;
        g.save();
        g.globalAlpha = alpha;
        g.translate(p.x, p.y);
        g.rotate(p.r);
        g.fillStyle = p.c;
        if (p.round) { g.beginPath(); g.arc(0, 0, p.w / 2, 0, Math.PI * 2); g.fill(); }
        else g.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.r * 1.7)) + 1.5);
        g.restore();
      });
      if (el < 3) requestAnimationFrame(frame); else cv.remove();
    }
    requestAnimationFrame(frame);
  }

  /* =====================================================================
     EVENTS
     ===================================================================== */
  document.addEventListener("click", e => {
    const el = e.target.closest("[data-action]");
    if (!el) return;
    const a = el.dataset.action;
    switch (a) {
      case "tab": switchTab(el.dataset.tab); break;
      case "goto": closeSheet(); switchTab(el.dataset.tab); break;
      case "answer": onAnswer(el); break;
      case "next": onNext(); break;
      case "focus":
        TTS.stop();
        ui.focusId = el.dataset.id;
        renderToday(true);
        haptic("light");
        break;
      case "speak": TTS.toggle(CARD_BY_ID[el.dataset.id]); break;
      case "read": openReader(el.dataset.id); break;
      case "cat": openCategorySheet(el.dataset.key); break;
      case "unlock": unlockCategory(el.dataset.key, el); break;
      case "learn": learnNow(el.dataset.id); break;
      case "bonus": drawBonus(); break;
      case "close-sheet": closeSheet(); break;
      case "chip":
        ui.archiveFilter = el.dataset.key;
        haptic("light");
        renderArchive();
        break;
      case "clear-search":
        ui.archiveQuery = "";
        $("#searchInput").value = "";
        renderArchiveList();
        $("#searchInput").focus();
        break;
      case "rate":
        state.settings.rate = Number(el.dataset.rate);
        save();
        $$(".seg-ctl button").forEach(b => b.classList.toggle("on", b === el));
        haptic("light");
        break;
      case "dismiss-install":
        state.settings.hideInstall = true;
        save();
        renderProfile();
        break;
      case "reset":
        showAlert("Fortschritt zurücksetzen?", "Streak, Archiv, Statistiken und freigeschaltete Themen werden gelöscht. Das kann nicht rückgängig gemacht werden.", [
          { label: "Abbrechen", style: "cancel" },
          { label: "Zurücksetzen", style: "destructive", onTap: () => {
            const settings = state.settings;
            state = defaultState();
            state.settings = settings;
            ui.focusId = null; ui.archiveFilter = "all"; ui.archiveQuery = "";
            $("#searchInput").value = "";
            ensureDeck();
            save();
            renderProfile();
            updateBadge();
            haptic("error");
            toast("Alles zurückgesetzt – auf ein Neues!", "🌱");
          } }
        ]);
        break;
    }
  });
  document.addEventListener("change", e => {
    const t = e.target;
    if (t.matches('[data-toggle="cat"]')) toggleCategory(t.dataset.key, t.checked, t);
    else if (t.matches('[data-toggle="haptics"]')) {
      state.settings.haptics = t.checked;
      save();
      if (t.checked) haptic("success");
    }
  });
  $("#searchInput").addEventListener("input", e => { ui.archiveQuery = e.target.value; renderArchiveList(); });
  $("#searchInput").addEventListener("keydown", e => { if (e.key === "Enter") e.target.blur(); });
  $$(".view").forEach(v => v.addEventListener("scroll", () => { if (v.classList.contains("active")) updateNavbar(); }, { passive: true }));
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") { if ($("#alert").classList.contains("show")) $("#alert").classList.remove("show"); else closeSheet(); }
  });

  function checkDay() {
    if (state.daily && state.daily.date !== todayKey()) {
      normalizeStreak();
      ensureDeck();
      save();
      renderTab(ui.tab);
      updateBadge();
      toast("Neuer Tag, neuer Stapel!", "☀️");
    } else {
      const cd = $("#countdown span");
      if (cd) cd.textContent = countdownText();
    }
  }
  setInterval(checkDay, 30000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) checkDay(); else TTS.stop(); });
  window.addEventListener("pagehide", () => TTS.stop());

  /* =====================================================================
     APP-ICON (zur Laufzeit erzeugt, keine externen Assets)
     ===================================================================== */
  function makeIcon() {
    try {
      const S = 180;
      const c = document.createElement("canvas");
      c.width = c.height = S;
      const g = c.getContext("2d");
      const bg = g.createLinearGradient(0, 0, S, S);
      bg.addColorStop(0, "#2B2A8C");
      bg.addColorStop(0.55, "#6D3FE0");
      bg.addColorStop(1, "#FF8A3D");
      g.fillStyle = bg;
      g.fillRect(0, 0, S, S);
      const glow = g.createRadialGradient(S * 0.3, S * 0.2, 4, S * 0.3, S * 0.2, S * 0.8);
      glow.addColorStop(0, "rgba(255,255,255,0.35)");
      glow.addColorStop(1, "rgba(255,255,255,0)");
      g.fillStyle = glow;
      g.fillRect(0, 0, S, S);
      g.fillStyle = "rgba(255,255,255,0.18)";
      g.beginPath(); g.arc(S / 2, S / 2, 58, 0, Math.PI * 2); g.fill();
      const star = (cx, cy, r, k) => {
        g.beginPath();
        g.moveTo(cx, cy - r);
        g.quadraticCurveTo(cx + r * k, cy - r * k, cx + r, cy);
        g.quadraticCurveTo(cx + r * k, cy + r * k, cx, cy + r);
        g.quadraticCurveTo(cx - r * k, cy + r * k, cx - r, cy);
        g.quadraticCurveTo(cx - r * k, cy - r * k, cx, cy - r);
        g.closePath();
        g.fill();
      };
      g.fillStyle = "#FFFFFF";
      g.shadowColor = "rgba(255,200,120,0.9)";
      g.shadowBlur = 18;
      star(S / 2, S / 2, 46, 0.16);
      g.shadowBlur = 8;
      g.fillStyle = "rgba(255,255,255,0.9)";
      star(S * 0.73, S * 0.28, 14, 0.18);
      const url = c.toDataURL("image/png");
      [["apple-touch-icon", null], ["icon", "image/png"]].forEach(p => {
        const l = document.createElement("link");
        l.rel = p[0];
        if (p[1]) l.type = p[1];
        l.href = url;
        document.head.appendChild(l);
      });
    } catch (e) { /* Icon optional */ }
  }

  /* =====================================================================
     START
     ===================================================================== */
  setupHapticProxy();
  makeIcon();
  TTS.init();
  normalizeStreak();
  ensureDeck();
  save();
  renderToday(false);
  updateNavbar();
})();
</script>
</body>
