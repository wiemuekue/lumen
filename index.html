    wissen: [
      ["Was ist ein Insekt?", "Insekten erkennt man an ihrem dreigeteilten Körper aus Kopf, Brust und Hinterleib sowie an sechs Beinen, die alle an der Brust sitzen. Die meisten haben zwei Flügelpaare und ein Paar Fühler, mit denen sie riechen und tasten. Statt Knochen besitzen sie ein Außenskelett aus Chitin – leicht, stabil und wasserdicht.\n\nDer Panzer hat allerdings einen Haken: Er wächst nicht mit. Um größer zu werden, müssen Insekten sich häuten und bilden darunter eine neue, zunächst weiche Hülle. Mit über einer Million beschriebenen Arten sind Insekten die artenreichste Tiergruppe überhaupt, und Fachleute vermuten, dass noch viele Millionen unentdeckt sind. Sie leben fast überall – nur im offenen Meer sind sie kaum vertreten."],
      ["Käfer – die artenreichste Ordnung", "Etwa jede vierte beschriebene Tierart ist ein Käfer – bekannt sind weit über 350.000 Arten. Dem britischen Biologen J. B. S. Haldane wird der Satz zugeschrieben, der Schöpfer müsse „eine übermäßige Vorliebe für Käfer“ gehabt haben. Typisch sind die harten Deckflügel, unter denen die zarten Hinterflügel zum Fliegen gefaltet liegen.\n\nKäfer haben nahezu jeden Lebensraum erobert: Sie leben im Wasser, im Holz, im Dung, in Pilzen und in Wüsten. Der größte Käfer Europas ist der Hirschkäfer, dessen Männchen mit geweihartigen Oberkiefern um Weibchen ringen. Sein Leben besteht überwiegend aus dem Larvenstadium: Die Larven fressen fünf bis acht Jahre lang morsches Holz, der fertige Käfer lebt nur wenige Wochen."],
      ["Wie Insekten atmen", "Insekten besitzen keine Lunge. Stattdessen durchzieht ein Netz feiner Röhren, die Tracheen, den ganzen Körper. Über kleine Öffnungen an den Seiten, die Stigmen, strömt Luft hinein und gelangt direkt bis zu den Organen und Muskeln. Größere Insekten helfen mit Pumpbewegungen des Hinterleibs nach.\n\nDas Blut der Insekten, die Hämolymphe, spielt beim Sauerstofftransport deshalb kaum eine Rolle. Es ist meist farblos, gelblich oder grünlich und fließt nicht in geschlossenen Adern, sondern umspült die Organe frei – ein offener Kreislauf. Ein röhrenförmiges Herz im Rücken pumpt es nach vorne. Weil Luft in dünnen Röhren nur über kurze Strecken gut ankommt, setzt dieses System der Körpergröße Grenzen."],
      ["Facettenaugen", "Die großen Augen vieler Insekten bestehen aus Hunderten bis Zehntausenden Einzelaugen, den Ommatidien. Jedes blickt in eine leicht andere Richtung und liefert einen Bildpunkt – das Gehirn setzt daraus ein Mosaik zusammen. Das Bild ist gröber als unseres, aber für Bewegung sind Facettenaugen hervorragend.\n\nViele Fliegen können deutlich mehr Einzelbilder pro Sekunde getrennt wahrnehmen als wir. Für sie läuft eine heranschwingende Zeitung gewissermaßen in Zeitlupe ab – deshalb sind sie so schwer zu erwischen. Bienen sehen zudem ultraviolettes Licht und erkennen die Schwingungsrichtung des Lichts, das polarisierte Himmelslicht. Damit bestimmen sie selbst bei bedecktem Himmel den Sonnenstand und navigieren."],
      ["Wie Insekten fliegen", "Viele Insekten schlagen ihre Flügel unglaublich schnell: Stechmücken schaffen mehrere Hundert Schläge pro Sekunde – daher ihr hohes Sirren. Muskeln könnten sich so schnell nicht einzeln zusammenziehen. Der Trick: Die Flugmuskeln verformen den elastischen Brustpanzer, der wie eine Feder zurückschnellt und die Flügel mitnimmt.\n\nLange hielt sich die Legende, nach den Gesetzen der Aerodynamik könne eine Hummel gar nicht fliegen. Tatsächlich wurden dabei starre Flugzeugflügel zugrunde gelegt. Insektenflügel erzeugen durch ihren Schlag kleine Luftwirbel an der Vorderkante, die zusätzlichen Auftrieb liefern. Moderne Hochgeschwindigkeitsaufnahmen und Modelle haben gezeigt, dass die Hummel sehr wohl physikalisch korrekt fliegt."],
      ["Wildbienen", "Wenn wir an Bienen denken, meinen wir meist die Honigbiene. Doch allein in Deutschland leben über 550 Wildbienenarten. Die meisten von ihnen leben nicht in Staaten, sondern solitär: Jedes Weibchen baut sein eigenes Nest in Sandböden, Pflanzenstängeln, Totholz oder leeren Schneckenhäusern und versorgt seine Brut mit einem Pollenvorrat.\n\nViele Wildbienen sind auf bestimmte Pflanzen spezialisiert – manche sammeln nur an Glockenblumen oder Weiden. Verschwinden diese Pflanzen, verschwindet auch die Biene. Wildbienen sind für die Bestäubung genauso wichtig wie Honigbienen, oft sogar effektiver, und fliegen auch bei kühlerem Wetter. Etwa die Hälfte der heimischen Arten gilt als gefährdet. Stechen können übrigens viele, doch ihr Stachel ist oft zu schwach für unsere Haut."],
      ["Hummeln – pelzige Frühaufsteher", "Hummeln fliegen schon an kühlen Frühlingstagen, wenn andere Insekten noch starr sind. Ihr dichter Pelz hält warm, und durch Zittern der Flugmuskeln – ohne die Flügel zu bewegen – heizen sie ihre Brust vor dem Start auf über 30 Grad auf. So sind sie wichtige Bestäuber früher Blüten und rauer Bergregionen.\n\nHummeln beherrschen außerdem eine Spezialtechnik: die Vibrationsbestäubung. Sie lassen ihre Flugmuskeln an der Blüte vibrieren und schütteln so den Pollen aus Staubbeuteln, die ihn nur so freigeben – etwa bei Tomaten. In Gewächshäusern setzt man deshalb gezielt Hummelvölker ein. Ein Hummelvolk lebt nur einen Sommer; allein die jungen, begatteten Königinnen überwintern."],
      ["Wespen – besser als ihr Ruf", "Beim Kuchenessen auf der Terrasse nerven meist nur zwei Arten: die Deutsche und die Gemeine Wespe. Die meisten der vielen Hundert Wespenarten in Deutschland interessieren sich nicht für uns – darunter zahlreiche Einzelgänger, Grab- und Schlupfwespen. Soziale Wespen bauen kunstvolle Papiernester aus zerkautem Holz, die im Herbst verlassen werden.\n\nWespen sind wichtige Jäger: Ein Volk verfüttert im Sommer große Mengen Fliegen, Raupen und andere Insekten an seine Larven und hält so Schädlinge in Schach. Die Hornisse, unsere größte heimische Wespe, ist deutlich friedlicher, als ihr Ruf vermuten lässt, und steht unter Naturschutz. Die Behauptung, dass wenige Hornissenstiche ein Pferd töten, ist ein Mythos."],
      ["Schmetterlinge", "Schmetterlinge verdanken ihre Farbenpracht Tausenden winzigen Schuppen, die dachziegelartig auf den Flügeln liegen. Manche Farben entstehen durch Pigmente, andere – wie das schillernde Blau vieler Falter – durch Lichtbrechung an mikroskopisch feinen Strukturen. Beim Anfassen reiben sich die Schuppen ab und bleiben als „Staub“ an den Fingern.\n\nAus Nektar trinken Falter mit einem Saugrüssel, der in Ruhe eingerollt ist. In Deutschland gibt es rund 3.700 Schmetterlingsarten, doch nur knapp 190 davon sind Tagfalter. Die große Mehrheit sind Nachtfalter – und viele davon sind durchaus bunt. Die Unterscheidung ist ohnehin nicht streng: Das Taubenschwänzchen, das wie ein Kolibri vor Blüten schwebt, ist ein tagaktiver Nachtfalter."],
      ["Die Reise des Distelfalters", "Der Distelfalter ist ein unscheinbarer, orange-schwarz gemusterter Schmetterling – und ein Weltmeister im Wandern. Jedes Jahr fliegen Generationen dieser Falter von Nordafrika bis nach Skandinavien und zurück. Die gesamte Rundreise misst bis zu rund 12.000 Kilometer und verteilt sich auf mehrere Generationen; kein einzelner Falter schafft sie ganz.\n\nLange war unklar, wie die Rückreise im Herbst verläuft, weil kaum Falter nach Süden beobachtet wurden. Radarstudien zeigten dann: Viele Distelfalter fliegen in großer Höhe, teils über 500 Meter, und nutzen günstige Höhenwinde. Mit bis zu 50 km/h ziehen sie so unbemerkt über unsere Köpfe hinweg. Manche erreichen sogar die Wüstenregionen südlich der Sahara."],
      ["Glühwürmchen", "Glühwürmchen sind keine Würmer, sondern Käfer – bei uns nennt man sie auch Leuchtkäfer oder Johanniswürmchen, weil sie um den Johannistag im Juni am auffälligsten sind. Ihr Licht entsteht durch eine chemische Reaktion: Das Enzym Luciferase lässt den Stoff Luciferin mit Sauerstoff reagieren, wobei Energie fast vollständig als Licht und kaum als Wärme frei wird.\n\nDas Leuchten ist eine Partnersuche. Bei vielen heimischen Arten sind die Weibchen flugunfähig und leuchten vom Boden aus, während die Männchen suchend umherfliegen. In Amerika blinken manche Arten in artspezifischen Mustern. Einige Weibchen ahmen sogar das Signal fremder Arten nach, locken deren Männchen an – und fressen sie."],
      ["Heuschrecken und Grillen", "Der Sommerklang auf Wiesen stammt überwiegend von Heuschrecken und Grillen. Sie erzeugen Töne durch Stridulation, also durch Reiben: Grillen und Laubheuschrecken reiben ihre Vorderflügel aneinander, Feldheuschrecken streichen mit den Hinterbeinen über eine Kante am Flügel. Jede Art hat ihren eigenen Gesang.\n\nIhre Ohren sitzen an überraschenden Stellen – bei Grillen und Laubheuschrecken an den Vorderbeinen, bei Feldheuschrecken seitlich am Hinterleib. Wanderheuschrecken zeigen ein berühmtes Phänomen: Werden die sonst einzelgängerischen Tiere durch Nahrungsmangel zusammengedrängt, ändern sie Farbe und Verhalten und schließen sich zu Schwärmen mit Milliarden Tieren zusammen, die ganze Ernten vernichten."],
      ["Die Gottesanbeterin", "Die Gottesanbeterin verdankt ihren Namen den zusammengelegten Vorderbeinen, die an betende Hände erinnern. In Wirklichkeit sind es Fangbeine mit Dornen, die blitzschnell zuschnappen. Als einziges Insekt kann sie ihren dreieckigen Kopf weit zur Seite drehen und über die Schulter blicken.\n\nBerühmt-berüchtigt ist, dass Weibchen während oder nach der Paarung manchmal das Männchen fressen. Das kommt vor, ist aber nicht die Regel – in der Natur passiert es seltener als in engen Terrarien. In Deutschland war die Europäische Gottesanbeterin lange auf wenige warme Gebiete am Oberrhein beschränkt. Mit dem wärmeren Klima breitet sie sich aus und ist inzwischen auch in Berlin und Brandenburg zu finden."],
      ["Wie Ameisen ihren Staat organisieren", "In einem Ameisenstaat gibt niemand Befehle – auch nicht die Königin, die vor allem Eier legt. Die Arbeit entsteht aus unzähligen einfachen Entscheidungen einzelner Tiere, die auf Signale reagieren. Die wichtigste Sprache sind Duftstoffe: Pheromone markieren Wege zu Nahrung, alarmieren bei Gefahr oder kennzeichnen Nestgenossinnen.\n\nDie Aufgaben hängen oft vom Alter ab: Junge Arbeiterinnen pflegen die Brut im Nestinneren, ältere gehen auf Futtersuche – die gefährlichste Aufgabe. Unsere Roten Waldameisen bauen Hügel, die mit Kuppel und Gängen das Nestklima regeln. Sie sind wichtige Gesundheitspolizei des Waldes, weil sie große Mengen Insekten fressen, und stehen in Deutschland unter Schutz."],
      ["Termiten – Baumeister der Tropen", "Termiten werden oft „weiße Ameisen“ genannt, sind mit Ameisen aber gar nicht eng verwandt – ihre nächsten Verwandten sind die Schaben. Anders als bei Ameisen gibt es in ihren Staaten sowohl einen König als auch eine Königin, und die Arbeiter können männlich oder weiblich sein.\n\nViele Termiten ernähren sich von Holz und Pflanzenfasern. Die Zellulose können sie nur dank Mikroben in ihrem Darm verdauen. Manche Arten in Afrika bauen meterhohe Hügel mit einem ausgeklügelten Belüftungssystem, das Temperatur und Gasaustausch reguliert. Architekten haben sich davon für Gebäude mit natürlicher Klimatisierung inspirieren lassen. Im Inneren mancher Hügel züchten Termiten sogar Pilzgärten."],
      ["Stechmücken und Krankheiten", "Das für Menschen tödlichste Tier ist kein Hai und keine Schlange, sondern die Stechmücke. Sie überträgt Krankheiten wie Malaria, Dengue- und Gelbfieber. Allein an Malaria, übertragen von Anopheles-Mücken, sterben laut Weltgesundheitsorganisation jedes Jahr rund 600.000 Menschen, die meisten davon Kinder in Afrika.\n\nNur Weibchen stechen, weil sie Eiweiß aus dem Blut für ihre Eier brauchen; ansonsten trinken Mücken Nektar. Sie finden uns über ausgeatmetes Kohlendioxid, Körperwärme und Hautgeruch – deshalb werden manche Menschen öfter gestochen als andere. In Deutschland breitet sich seit einigen Jahren die Asiatische Tigermücke aus, die in anderen Regionen Viren überträgt und deshalb genau beobachtet wird."],
      ["Zecken – kleine Blutsauger", "Zecken gehören wie Spinnen und Milben zu den Spinnentieren. Die häufigste Art in Deutschland ist der Gemeine Holzbock. Entgegen einem verbreiteten Glauben lassen sich Zecken nicht von Bäumen fallen: Sie warten in Gras, Farnen und Gebüsch in niedriger Höhe, bis ein Wirt sie abstreift. Mit einem speziellen Sinnesorgan an den Vorderbeinen spüren sie Wärme, Kohlendioxid und Gerüche.\n\nZecken können Krankheiten übertragen, vor allem Borreliose und die Hirnhautentzündung FSME. Gegen FSME gibt es eine Impfung, die in Risikogebieten empfohlen wird – vor allem in Süddeutschland. Eine Zecke sollte man möglichst früh und dicht an der Haut mit einer Pinzette oder Zeckenkarte entfernen, ohne sie vorher mit Öl oder Klebstoff zu behandeln."],
      ["Spinnen in Deutschland", "In Deutschland leben rund tausend Spinnenarten. Fast alle sind für Menschen völlig harmlos, weil ihre Kieferklauen unsere Haut nicht durchdringen oder ihr Gift zu schwach ist. Nur wenige Arten können überhaupt spürbar beißen, etwa der Ammen-Dornfinger, dessen Biss sich ähnlich wie ein Wespenstich anfühlt.\n\nIm Haus begegnen uns oft Winkelspinnen mit langen Beinen, die im Herbst auf Partnersuche durch die Wohnung laufen, und Zitterspinnen, die bei Störung ihr Netz in schnelle Schwingungen versetzen. Seit einigen Jahren breitet sich die Nosferatu-Spinne aus dem Mittelmeerraum aus. Sie kann beißen, ist aber nicht gefährlicher als eine Wespe. Spinnen im Haus fangen übrigens Mücken, Fliegen und Motten."],
      ["Wie Spinnen jagen", "Nicht alle Spinnen bauen Netze. Radnetzspinnen wie die Kreuzspinne spinnen ein kunstvolles Fangrad und spüren über die Fäden jede Erschütterung. Springspinnen dagegen jagen aktiv: Mit acht Augen, darunter zwei großen nach vorn gerichteten, sehen sie für ihre Größe erstaunlich scharf und springen ihre Beute an.\n\nWolfspinnen streifen am Boden umher; die Weibchen tragen ihre Jungen einige Zeit auf dem Rücken. Eine Besonderheit ist die Wasserspinne, die als einzige Spinne Europas fast ihr ganzes Leben unter Wasser verbringt. Sie baut zwischen Wasserpflanzen eine Glocke aus Gespinst, füllt sie mit Luftblasen von der Oberfläche und lebt darin wie in einer Taucherglocke."],
      ["Tarnung und Täuschung", "Viele Insekten setzen auf Verkleidung. Stabschrecken sehen aus wie Zweige und wiegen sich sogar im Wind, Wandelnde Blätter imitieren Blätter samt Blattadern und angefressenen Rändern. Manche Raupen sehen aus wie Vogelkot – eine Tarnung, die Fressfeinde zuverlässig abschreckt.\n\nAndere setzen auf Bluff. Das Tagpfauenauge klappt bei Gefahr die Flügel auf und zeigt große Augenflecken, die Vögel erschrecken. Der Hornissen-Glasflügler, ein Schmetterling, gleicht einer Hornisse erstaunlich genau, ist aber völlig harmlos. Und manche Schwebfliegen ahmen nicht nur das Aussehen von Wespen nach, sondern sogar deren ruckartige Flugweise."],
      ["Nützlinge im Garten", "Viele Insekten sind natürliche Schädlingsbekämpfer. Marienkäfer und besonders ihre Larven fressen große Mengen Blattläuse – eine Larve schafft während ihrer Entwicklung mehrere Hundert. Die Larven der Florfliege heißen nicht ohne Grund „Blattlauslöwen“: Sie saugen Blattläuse mit ihren zangenartigen Mundwerkzeugen aus.\n\nSchlupfwespen legen ihre Eier in Raupen oder Blattläuse, die dann von innen gefressen werden. Laufkäfer jagen nachts Schnecken und Insektenlarven. Wer im Garten auf Gift verzichtet, heimische Blühpflanzen und etwas Unordnung zulässt, fördert solche Helfer. Denn Pestizide treffen auch die Nützlinge – und ohne sie kehren die Schädlinge oft umso schneller zurück."],
      ["Die Müllabfuhr der Natur", "Ohne Insekten würde die Welt im Abfall versinken. Aaskäfer und Fliegenlarven zerlegen tote Tiere, Totengräber-Käfer vergraben sogar ganze Mäuse als Vorrat für ihre Brut. Mistkäfer formen Dung zu Kugeln und rollen ihn davon – in Australien holte man eigens Mistkäfer ins Land, weil die einheimischen Arten mit Rinderdung nicht zurechtkamen.\n\nForschende fanden heraus, dass manche Mistkäfer sich nachts an der Milchstraße orientieren, um ihre Kugel in gerader Linie wegzurollen. Im Wald zersetzen Käferlarven, Termiten und Ameisen Totholz. Deshalb ist liegendes und stehendes Totholz so wichtig: Es bietet Lebensraum für Hunderte Insektenarten, darunter seltene wie den Hirschkäfer."],
      ["Insekten auf dem Teller", "Für rund zwei Milliarden Menschen weltweit sind Insekten ganz normale Nahrung – etwa geröstete Grillen in Thailand, Heuschrecken in Mexiko oder Raupen in Teilen Afrikas. Sie sind reich an Eiweiß, Fett und Mineralstoffen. Und sie haben einen ökologischen Vorteil: Insekten verwerten Futter viel effizienter als Rinder und brauchen weniger Platz und Wasser.\n\nIn der Europäischen Union sind seit 2021 einige Insekten als Lebensmittel zugelassen, darunter der getrocknete Mehlwurm, die Wanderheuschrecke und die Hausgrille. Sie müssen auf der Zutatenliste deutlich angegeben werden. Menschen mit einer Allergie gegen Krebstiere oder Hausstaubmilben sollten vorsichtig sein, da ähnliche Eiweiße vorkommen können."],
      ["Insekten im Winter", "Insekten haben viele Wege, den Winter zu überstehen. Die meisten überwintern als Ei, Larve oder Puppe, geschützt im Boden, in Pflanzenstängeln oder unter Rinde. Marienkäfer versammeln sich in Ritzen oft zu großen Gruppen. Einige Schmetterlinge wie Tagpfauenauge und Kleiner Fuchs überwintern als Falter in Kellern, Schuppen oder Höhlen.\n\nDer Zitronenfalter bleibt sogar frei an Pflanzen hängen. Er senkt den Wassergehalt seines Körpers und lagert Frostschutzstoffe wie Glycerin ein, sodass er Temperaturen bis weit unter minus zehn Grad übersteht. Honigbienen bilden eine Wintertraube: Sie drängen sich zusammen, zittern mit den Flugmuskeln und halten im Inneren so rund 20 Grad und mehr."],
      ["Was Insekten hilft", "Jeder kann etwas für Insekten tun, auch auf einem Balkon. Am wichtigsten sind Blüten – vor allem heimische Wildpflanzen, die von Frühjahr bis Herbst nacheinander blühen. Gefüllte Zuchtblüten sehen prächtig aus, bieten aber oft kaum Nektar oder Pollen. Kräuter wie Thymian, Salbei und Oregano sind bei Bienen beliebt.\n\nHilfreich ist auch Unordnung: Laub und Stängel über den Winter stehen lassen, eine wilde Ecke im Garten, offene Bodenstellen für Wildbienen und etwas Totholz. Rasen seltener mähen lässt Klee und Wildkräuter blühen. Außenlicht sollte sparsam, warm und nach unten gerichtet sein. Und Insektenhotels helfen nur einigen Arten – wirklich entscheidend ist das Nahrungsangebot."]

      ["Dorothea Viehmann", "Die Schneiderstochter Dorothea Viehmann aus Niederzwehren bei Kassel war eine der wichtigsten Quellen der Brüder Grimm. Sie erzählte ihnen Dutzende Märchen fast wortgetreu – ihr Porträt ziert die zweite Auflage der Sammlung."],

      ["Volksmärchen und Kunstmärchen", "Volksmärchen wurden mündlich überliefert und haben keinen bekannten Verfasser. Kunstmärchen wie die von Andersen oder Hauff wurden von einem Autor bewusst erfunden."],
      ["Der Froschkönig", "„Der Froschkönig oder der eiserne Heinrich“ ist das erste Märchen der Grimm-Sammlung. Die Prinzessin küsst den Frosch darin nicht, sondern wirft ihn wütend an die Wand – erst dann wird er zum Prinzen."],
      ["Schneewittchen im Original", "In der ersten Ausgabe von 1812 ist es Schneewittchens eigene Mutter, die sie töten will; erst später wurde daraus die Stiefmutter. Am Ende muss die böse Königin in rotglühenden Eisenschuhen tanzen, bis sie tot umfällt."],

      ["Rumpelstilzchen", "Ein Männlein spinnt für die Müllerstochter Stroh zu Gold und verlangt dafür ihr erstes Kind. Als sie seinen Namen errät, reißt es sich vor Wut selbst mitten entzwei."],
      ["Dornröschen", "Weil der König nur zwölf goldene Teller besaß, lud er nur zwölf der dreizehn weisen Frauen ein. Die dreizehnte rächte sich mit einem Fluch – und die Prinzessin fiel in einen hundertjährigen Schlaf."],
      ["Frau Holle", "Die fleißige Goldmarie wird mit Gold überschüttet, die faule Pechmarie mit Pech. Wenn Frau Holle ihre Betten ausschüttelt, schneit es auf der Erde – der Sage nach wohnt sie am Hohen Meißner in Nordhessen."],
      ["Die Bremer Stadtmusikanten", "Esel, Hund, Katze und Hahn wollen in Bremen Stadtmusikanten werden – kommen dort aber nie an, weil sie sich in einem Räuberhaus niederlassen. Trotzdem ist das Märchen heute das Wahrzeichen Bremens."],
      ["Der Wolf und die sieben Geißlein", "Der Wolf verstellt seine Stimme mit Kreide und bestäubt seine Pfote mit Mehl, um die Geißlein zu täuschen. Nur das jüngste überlebt, versteckt im Uhrkasten."],
      ["Das tapfere Schneiderlein", "Das Schneiderlein erschlägt sieben Fliegen auf einmal und stickt „Sieben auf einen Streich“ auf seinen Gürtel. Alle glauben, es seien sieben Männer – und mit List besiegt er Riesen, Einhorn und Wildschwein."],
      ["Hans im Glück", "Hans tauscht einen Goldklumpen gegen ein Pferd, das Pferd gegen eine Kuh und so weiter, bis er nichts mehr besitzt. Am Ende fühlt er sich frei und glücklich – ein Märchen über den Wert des Besitzes."],
      ["Der gestiefelte Kater", "Der schlaue Kater, der seinem armen Herrn zu Reichtum verhilft, stammt aus der Sammlung von Perrault. Die Grimms nahmen ihn in die erste Ausgabe auf, strichen ihn aber später, weil er als zu französisch galt."],

    wissen: [
      ["Was ist ein tropischer Regenwald?", "Tropische Regenwälder wachsen in einem Gürtel rund um den Äquator – in Südamerika, Zentralafrika, Südostasien und Nordaustralien. Es ist dort das ganze Jahr über warm, meist um die 25 Grad, und es regnet sehr viel: oft 2.000 bis über 4.000 Millimeter im Jahr, mehr als das Dreifache wie in Deutschland. Jahreszeiten im europäischen Sinn gibt es kaum.\n\nMan spricht von einem Tageszeitenklima: Zwischen Mittag und Nacht schwankt die Temperatur stärker als zwischen den Monaten. Tropische Regenwälder bedecken nur einen kleinen Teil der Landfläche der Erde, beherbergen aber vermutlich mehr als die Hälfte aller an Land lebenden Tier- und Pflanzenarten. Kein anderer Lebensraum an Land ist so artenreich."],
      ["Warum es jeden Nachmittag regnet", "In vielen Regenwäldern folgt das Wetter einem festen Rhythmus. Morgens ist es klar und feucht. Die hoch stehende Sonne heizt Boden und Blätter auf, gewaltige Mengen Wasser verdunsten, und die warme, feuchte Luft steigt nach oben. Dort kühlt sie ab, der Wasserdampf kondensiert, und es türmen sich Quellwolken auf.\n\nAm Nachmittag entladen sie sich oft in heftigen Schauern und Gewittern. Ein großer Teil des Regens stammt dabei aus dem Wald selbst: Die Bäume ziehen Wasser aus dem Boden und geben es über ihre Blätter wieder an die Luft ab. Im Amazonasgebiet wird so ein erheblicher Teil der Niederschläge mehrfach recycelt, bevor das Wasser den Atlantik erreicht."],
      ["Die fliegenden Flüsse", "Über dem Amazonas-Regenwald strömt nicht nur ein Fluss am Boden, sondern auch einer in der Luft. Forschende schätzen, dass die Bäume des Amazonasgebiets an einem Tag rund 20 Milliarden Tonnen Wasser verdunsten – etwas mehr, als der Amazonas selbst täglich in den Atlantik trägt.\n\nDiese feuchten Luftmassen ziehen mit den Winden nach Westen, werden von den Anden nach Süden umgelenkt und bringen Regen bis in den Süden Brasiliens, nach Paraguay und Argentinien. Man nennt sie „fliegende Flüsse“. Von ihnen hängen Landwirtschaft, Wasserkraft und Trinkwasser in großen Teilen Südamerikas ab. Wird zu viel Wald gerodet, fließen diese Luftflüsse schwächer – mit Folgen weit über den Regenwald hinaus."],
      ["Warum gibt es so viele Arten?", "Auf einem einzigen Hektar Regenwald können über 300 verschiedene Baumarten wachsen – ganz Deutschland hat nur rund 90 heimische Baumarten. Als der Insektenforscher Terry Erwin 1982 in Panama die Krone einer einzigen Baumart mit Insektizid benebelte, fand er über tausend Käferarten, von denen viele unbekannt waren. Daraus leitete er ab, dass es weltweit bis zu 30 Millionen Insektenarten geben könnte.\n\nErklärungen für diese Vielfalt gibt es mehrere: ein seit sehr langer Zeit stabiles, warmes Klima; unzählige kleine Nischen vom Boden bis in die Kronen; und ein ständiges Wettrüsten zwischen Pflanzen und Pflanzenfressern. Viele Arten sind hoch spezialisiert und kommen nur in einem kleinen Gebiet vor."],
      ["Epiphyten – Gärten in den Baumkronen", "Hoch oben auf Ästen wachsen im Regenwald ganze Gärten: Orchideen, Bromelien, Farne, Moose und Flechten. Diese Aufsitzerpflanzen heißen Epiphyten. Sie nutzen die Bäume nur als Unterlage, um näher ans Licht zu kommen, und zapfen sie nicht an – sie sind also keine Schmarotzer.\n\nIhr Wasser und ihre Nährstoffe holen sie sich aus Regen, Nebel und Staub. Manche Bromelien bilden mit ihren Blättern einen Trichter, der sich mit Wasser füllt. In diesen Mini-Teichen leben Insektenlarven, Krebstierchen und sogar Kaulquappen von Fröschen. Ein großer Baum kann Hunderte Epiphyten tragen, deren Gewicht bei Regen so groß wird, dass manchmal Äste abbrechen."],
      ["Lianen und Würgefeigen", "Lianen sind Kletterpflanzen, die im Boden wurzeln und an Bäumen emporwachsen, um ans Licht zu gelangen. Sie sparen sich so den Aufbau eines eigenen tragenden Stammes. Manche werden armdick und Hunderte Meter lang und verbinden die Kronen mehrerer Bäume – Brücken für Affen und andere Tiere.\n\nNoch raffinierter sind Würgefeigen. Ihr Leben beginnt oft hoch im Baum, wenn ein Vogel oder Affe einen Samen mit dem Kot auf einem Ast ablegt. Der Keimling schickt Luftwurzeln hinab zum Boden, die dicker werden und den Wirtsbaum wie ein Netz umschließen. Mit der Zeit nimmt die Feige ihm Licht und Platz; der Wirt stirbt ab und verrottet. Zurück bleibt eine Feige mit hohlem Inneren."],
      ["Brettwurzeln und Stelzwurzeln", "Viele Regenwaldriesen stehen auf gewaltigen Brettwurzeln – dünnen, flachen Wurzelwänden, die wie Stützmauern mehrere Meter weit vom Stamm ausstrahlen. Weil der Boden nährstoffarm ist und die meisten Nährstoffe in der obersten Schicht zu finden sind, wurzeln die Bäume eher flach. Die Brettwurzeln geben ihnen trotzdem Halt gegen Wind und die Last ihrer schweren Kronen.\n\nAndere Pflanzen stehen auf Stelzwurzeln, die vom Stamm schräg in den Boden wachsen – besonders in sumpfigen Gebieten. Die sogenannte Wanderpalme soll mit ihren Stelzwurzeln sogar langsam „wandern“ können, indem neue Wurzeln auf einer Seite wachsen und alte vergehen; ob sie sich wirklich nennenswert bewegt, ist allerdings umstritten."],
      ["Das Kongobecken", "Der zweitgrößte Regenwald der Erde liegt im Kongobecken in Zentralafrika und erstreckt sich über mehrere Länder. Hier leben Waldelefanten, Flachlandgorillas, Schimpansen und das Okapi, eine scheue Waldgiraffe mit gestreiften Beinen. Bonobos, die friedlichen Verwandten der Schimpansen, kommen nur südlich des Kongo-Flusses vor – der Strom trennt die beiden Arten seit langer Zeit.\n\n2017 bestätigten Forschende, dass unter den Sumpfwäldern der Cuvette Centrale das größte tropische Torfgebiet der Welt liegt. Es speichert rund 30 Milliarden Tonnen Kohlenstoff – etwa so viel, wie die ganze Welt in einigen Jahren durch fossile Brennstoffe freisetzt. Trocknet es aus, würde dieser Kohlenstoff frei."],
      ["Borneo und die Wälder Südostasiens", "Die Regenwälder Borneos gehören zu den ältesten der Welt und zu den artenreichsten. Hier leben Orang-Utans, Nasenaffen mit ihren großen Knollennasen, Nebelparder, Zwergelefanten und Nashornvögel. Auch die größte Einzelblüte der Welt findet man in Südostasien: Die Rafflesia bildet Blüten von bis zu rund einem Meter Durchmesser, die nach Aas riechen, um Fliegen als Bestäuber anzulocken.\n\nDie Rafflesia hat weder Blätter noch Stängel noch Wurzeln – sie lebt als Schmarotzer in einer Liane. In den vergangenen Jahrzehnten wurden auf Borneo und Sumatra riesige Flächen für Palmöl- und Papierholzplantagen gerodet. Brände auf trockengelegten Torfböden verursachten zeitweise so viel Rauch, dass Nachbarländer unter Smog litten."],
      ["Leben im Kronendach", "Das Kronendach ist der eigentliche Mittelpunkt des Regenwalds: Hier gibt es Licht, Blüten, Früchte und Blätter im Überfluss. Faultiere hängen fast bewegungslos in den Ästen; in ihrem Fell wachsen Algen, die sie grünlich tarnen. Tukane pflücken mit ihren großen, aber leichten Schnäbeln Früchte von dünnen Zweigen, die ihr Gewicht nicht tragen würden.\n\nZu den gewaltigsten Jägern dort oben gehört die Harpyie, einer der kräftigsten Greifvögel der Welt. Ihre Krallen sind so lang wie die eines Grizzlybären, und sie erbeutet Affen und Faultiere direkt aus den Baumkronen. Brüllaffen wiederum gehören zu den lautesten Landtieren: Ihre morgendlichen Rufe sind kilometerweit zu hören."],
      ["Der Jaguar", "Der Jaguar ist die größte Katze Amerikas und die drittgrößte der Welt nach Tiger und Löwe. Er lebt vor allem in Regenwäldern und Feuchtgebieten wie dem brasilianischen Pantanal. Anders als viele Katzen liebt er Wasser: Er schwimmt ausgezeichnet und fängt Fische, Schildkröten und sogar Kaimane.\n\nSein Biss ist im Verhältnis zu seiner Größe einer der stärksten aller Katzen. Statt die Beute an der Kehle zu packen, tötet er sie oft mit einem Biss durch den Schädel oder knackt Schildkrötenpanzer. Sein Name stammt vermutlich aus einer Tupí-Sprache. Jaguare benötigen große, zusammenhängende Wälder – durch Rodungen und Konflikte mit Viehzüchtern sind ihre Bestände vielerorts stark zurückgegangen."],
      ["Kleine Tiere, große Wirkung", "Der Regenwald wird von Insekten und anderen Wirbellosen geprägt. Wanderameisen ziehen in Kolonnen von Hunderttausenden Tieren über den Boden und scheuchen dabei Insekten auf, die von folgenden Vögeln gefangen werden. Termiten und Pilze zersetzen totes Holz in erstaunlicher Geschwindigkeit.\n\nEine Ameise ist besonders gefürchtet: die Tropische Riesenameise, auf Englisch „Bullet Ant“ genannt, weil sich ihr Stich wie ein Schuss anfühlen soll. Er gilt als einer der schmerzhaftesten Insektenstiche überhaupt. Beim Volk der Sateré-Mawé in Brasilien müssen junge Männer in einem Initiationsritual Handschuhe tragen, in die zahlreiche dieser Ameisen eingeflochten sind – eine Mutprobe, die oft mehrmals wiederholt wird."],
      ["Nachts im Dschungel", "Wenn es dunkel wird, beginnt im Regenwald eine zweite Schicht. Frösche füllen die Luft mit einem vielstimmigen Konzert, Zikaden sirren, und Fledermäuse übernehmen die Arbeit der Vögel: Viele tropische Fledermäuse bestäuben Blüten oder verbreiten Samen, indem sie Früchte fressen und die Kerne andernorts ausscheiden. Manche Pflanzen öffnen ihre Blüten nur nachts.\n\nAuf dem Waldboden leuchten mancherorts Pilze grünlich im Dunkeln – ein Phänomen, das man „Foxfire“ nennt. Nachtaffen, Wickelbären, Kinkajus und viele Schlangen gehen auf Nahrungssuche. Mit Taschenlampe erkennt man überall reflektierende Augen – von Spinnen, Kaimanen und Nachtschwalben. Forschende finden bei nächtlichen Streifzügen regelmäßig neue Arten."],
      ["Die Apotheke des Regenwaldes", "Viele Medikamente gehen auf Pflanzen aus tropischen Wäldern zurück. Chinin aus der Rinde des südamerikanischen Chinarindenbaums war jahrhundertelang das wichtigste Mittel gegen Malaria. Das Pfeilgift Curare, das indigene Jäger aus Pflanzen herstellten, lähmt die Muskeln; davon abgeleitete Wirkstoffe werden bei Narkosen eingesetzt, damit Muskeln während einer Operation entspannt bleiben.\n\nAus dem Madagaskar-Immergrün gewann man Wirkstoffe, die bei der Behandlung bestimmter Formen von Leukämie und Lymphdrüsenkrebs helfen. Viele Hinweise auf solche Stoffe stammen aus dem traditionellen Wissen indigener Heiler. Nur ein kleiner Teil der tropischen Pflanzen ist bisher auf Wirkstoffe untersucht – mit jedem gerodeten Hektar gehen möglicherweise Heilmittel verloren."],
      ["Aus dem Regenwald auf den Teller", "Viele Lebensmittel stammen ursprünglich aus tropischen Wäldern: Kakao, Bananen, Vanille, Zimt, Pfeffer, Cashew, Ananas und Kaffee. Der Kakaobaum wächst natürlich im schattigen Unterholz Amazoniens; seine winzigen Blüten werden vor allem von kleinen Mücken, den Gnitzen, bestäubt.\n\nVanille ist die Frucht einer Orchidee aus Mexiko. Außerhalb ihrer Heimat fehlen die passenden Bestäuber, deshalb wird jede Blüte von Hand bestäubt – eine Technik, die 1841 ein zwölfjähriger versklavter Junge namens Edmond Albius auf der Insel Réunion entwickelte. Paranüsse werden fast ausschließlich in intakten Wäldern gesammelt, denn die Bäume brauchen große Waldbienen als Bestäuber und Agutis, die ihre harten Kapseln öffnen und Samen vergraben."],
      ["Die Menschen des Regenwaldes", "In den Regenwäldern leben Hunderte indigene Völker mit eigenen Sprachen, Kulturen und einem über Jahrtausende gewachsenen Wissen über Pflanzen und Tiere. Viele Landschaften, die wir für unberührte Wildnis halten, wurden von ihnen geprägt – etwa durch Waldgärten mit Nutzbäumen oder durch fruchtbare „schwarze Erde“, die Terra preta, die Menschen vor Jahrhunderten mit Holzkohle und Abfällen anlegten.\n\nIm Amazonasgebiet gibt es nach Schätzungen noch über hundert Gruppen, die keinen dauerhaften Kontakt zur Außenwelt haben. Für sie sind schon gewöhnliche Erkältungsviren lebensgefährlich. Indigene Völker schützen ihre Wälder oft wirksamer als staatliche Behörden – werden aber selbst durch illegale Holzfäller, Goldsucher und Landraub bedroht."],
      ["Regenwald und Klima", "Tropische Wälder speichern in Stämmen, Wurzeln und Böden gewaltige Mengen Kohlenstoff. Solange sie wachsen, nehmen sie Kohlendioxid aus der Luft auf. Werden sie gerodet oder brennen sie ab, gelangt der gespeicherte Kohlenstoff als CO2 in die Atmosphäre. Entwaldung gehört deshalb zu den wichtigen Ursachen des Klimawandels.\n\nMessflüge über dem Amazonas zeigten 2021: Teile des Südostens, die stark gerodet und von Dürren gestresst sind, geben inzwischen mehr Kohlenstoff ab, als sie aufnehmen. Regenwälder kühlen außerdem die Landschaft, weil die Verdunstung Wärme verbraucht – ähnlich wie Schweiß auf der Haut. Wird der Wald zu Weideland, steigen die Temperaturen vor Ort spürbar."],
      ["Der Kipppunkt des Amazonas", "Forschende warnen, dass der Amazonas-Regenwald einen Kipppunkt erreichen könnte. Weil der Wald einen großen Teil seines Regens selbst erzeugt, sinken mit jeder Rodung auch die Niederschläge. Kommen längere Trockenzeiten durch den Klimawandel hinzu, könnten große Teile des Waldes absterben und in eine trockene, savannenartige Landschaft übergehen.\n\nWo genau diese Schwelle liegt, ist unsicher. Häufig genannt wird, dass eine Entwaldung von 20 bis 25 Prozent zusammen mit der Erwärmung kritisch werden könnte; bisher sind grob 17 bis 20 Prozent des ursprünglichen Waldes verloren. Einmal gekippt, ließe sich der Wald über menschliche Zeiträume kaum wiederherstellen. Deshalb gilt es als so wichtig, verbliebene Wälder zu erhalten."],
      ["Palmöl – der umstrittene Rohstoff", "Palmöl stammt aus den Früchten der Ölpalme und ist das weltweit meistproduzierte Pflanzenöl. Es steckt in einem großen Teil der Supermarktprodukte – in Margarine, Keksen, Schokoaufstrich, Waschmittel, Kosmetik – und wird als Biokraftstoff genutzt. Der Großteil kommt aus Indonesien und Malaysia, wo für Plantagen riesige Regenwaldflächen gerodet wurden.\n\nEin einfacher Boykott ist allerdings keine Lösung: Die Ölpalme liefert pro Hektar mehrere Male so viel Öl wie Raps, Soja oder Sonnenblumen. Ein Ersatz würde also noch mehr Fläche beanspruchen. Wichtig ist deshalb, woher das Palmöl stammt, dass keine Wälder mehr dafür gerodet werden – und dass wir insgesamt weniger stark verarbeitete Produkte konsumieren."],
      ["Mangroven – Wälder im Salzwasser", "Mangroven wachsen an tropischen Küsten in der Gezeitenzone, wo das Wasser zweimal täglich steigt und fällt. Kaum ein Baum hält Salzwasser aus – Mangroven können es: Einige filtern das Salz schon an den Wurzeln heraus, andere scheiden es über die Blätter aus. Ihre Stelzwurzeln geben Halt im Schlick, und Atemwurzeln ragen wie Spargel aus dem Boden, um Luft zu holen.\n\nMangrovenwälder sind Kinderstube für viele Fische und Krebse, schützen Küsten vor Sturmfluten und Erosion und speichern pro Fläche ein Vielfaches des Kohlenstoffs vieler Landwälder im schlammigen Boden. Trotzdem wurde weltweit ein großer Teil von ihnen für Garnelenfarmen, Häfen und Hotels zerstört."],
      ["Nebelwälder", "In tropischen Gebirgen wachsen in Höhen, in denen sich regelmäßig Wolken an den Hängen stauen, sogenannte Nebelwälder. Ein großer Teil ihres Wassers stammt nicht aus Regen, sondern aus Nebeltröpfchen, die sich an Blättern, Moosen und Flechten sammeln und abtropfen. Die Bäume sind oft dicht mit Moosen, Farnen, Orchideen und Bromelien bewachsen.\n\nNebelwälder sind reich an Arten, die nirgendwo sonst leben. In Costa Rica lebte die leuchtend orange Goldkröte, die 1989 zuletzt gesehen wurde und inzwischen als ausgestorben gilt – vermutlich wegen Klimaveränderungen und Krankheiten. Der farbenprächtige Quetzal, heiliger Vogel der Maya und Azteken, ist ein weiterer berühmter Bewohner dieser Wolkenwälder."],
      ["Tiere als Gärtner des Waldes", "In tropischen Wäldern werden die Samen der meisten Baumarten von Tieren verbreitet. Vögel, Affen, Fledermäuse, Tapire und Waldelefanten fressen Früchte und scheiden die Samen oft weit entfernt vom Mutterbaum wieder aus – meist mit einer Portion Dünger. Manche Samen keimen sogar erst, nachdem sie einen Tierdarm passiert haben.\n\nDas macht Wälder verletzlich: Werden große Fruchtfresser gejagt, verschwinden langfristig auch die Baumarten, die auf sie angewiesen sind. Oft sind das Bäume mit großen, schweren Samen und besonders dichtem Holz, die viel Kohlenstoff speichern. Forschende sprechen von „leeren Wäldern“, wenn die Bäume noch stehen, die Tiere aber fehlen."],
      ["Aras, Kolibris und Paradiesvögel", "Regenwälder sind Heimat der farbenprächtigsten Vögel der Welt. Aras in Südamerika versammeln sich an bestimmten Flussufern zu Hunderten, um Lehm zu fressen. Vermutlich gleicht der Lehm fehlendes Natrium in ihrer Nahrung aus und bindet möglicherweise Giftstoffe aus unreifen Samen.\n\nIn Neuguinea leben die Paradiesvögel. Ihre Männchen tragen spektakuläre Federn und führen ausgefeilte Balztänze auf, bei denen sie ihr Gefieder in geometrische Formen verwandeln. Einige Federn sind so schwarz, dass sie fast das gesamte Licht schlucken und die bunten Flecken daneben umso stärker leuchten lassen. Kolibris schließlich schweben vor Blüten und sind wichtige Bestäuber vieler tropischer Pflanzen."],
      ["Madagaskar – eine Welt für sich", "Madagaskar trennte sich vor vielen Millionen Jahren von Afrika und Indien. Seitdem entwickelte sich dort eine Tier- und Pflanzenwelt, die es fast nirgendwo sonst gibt: Ein sehr großer Teil der Arten ist endemisch, kommt also nur auf dieser Insel vor. Das berühmteste Beispiel sind die Lemuren – Primaten, die es wild ausschließlich auf Madagaskar gibt.\n\nAuch rund die Hälfte aller Chamäleonarten der Welt lebt dort, darunter einige der kleinsten Reptilien überhaupt. Die Regenwälder im Osten der Insel sind allerdings stark geschrumpft. Brandrodung für Felder und die Holzgewinnung haben große Flächen zerstört, und viele Lemurenarten gelten als stark gefährdet."],
      ["Was wir für den Regenwald tun können", "Auch in Europa haben unsere Kaufentscheidungen Einfluss auf tropische Wälder. Futtermittel wie Soja, Rindfleisch, Palmöl, Kakao, Kaffee, Tropenholz und Papier sind häufig mit Entwaldung verbunden. Weniger Fleisch, Produkte mit glaubwürdigen Siegeln für Holz und Papier sowie Recyclingpapier helfen, den Druck zu verringern.\n\nDie Europäische Union hat 2023 eine Verordnung beschlossen, nach der bestimmte Produkte wie Kaffee, Kakao, Soja, Palmöl, Holz, Rindfleisch und Kautschuk nur noch verkauft werden dürfen, wenn für sie nachweislich kein Wald gerodet wurde. Genauso wichtig ist die Unterstützung von Schutzgebieten und von indigenen Gemeinschaften, die ihre Wälder verteidigen."]

        funFact: "Chamäleons erzeugen viele ihrer Farben nicht mit Farbstoffen, sondern mit winzigen Nanokristallen in der Haut, deren Abstände sie verändern – dadurch wird das Licht anders reflektiert.",

    wissen: [
      ["Was macht ein Tier zum Tier?", "Tiere sind vielzellige Lebewesen, die sich von anderen Organismen ernähren – anders als Pflanzen können sie keine Photosynthese betreiben. Ihre Zellen besitzen keine feste Zellwand, und fast alle Tiere können sich zumindest in einem Lebensabschnitt aktiv fortbewegen. Selbst festsitzende Schwämme und Korallen beginnen ihr Leben als frei schwimmende Larven.\n\nBislang sind rund 1,5 Millionen Tierarten wissenschaftlich beschrieben, und jedes Jahr kommen Tausende hinzu. Forschende gehen davon aus, dass es insgesamt mehrere Millionen Arten gibt – viele davon kleine Insekten, Würmer oder Tiefseebewohner, die noch niemand benannt hat. Der Mensch ist dabei eine Art unter vielen: Homo sapiens, ein Säugetier aus der Ordnung der Primaten."],
      ["Wirbeltiere und Wirbellose", "Wirbeltiere besitzen eine Wirbelsäule und ein Innenskelett aus Knochen oder Knorpel. Zu ihnen gehören Fische, Amphibien, Reptilien, Vögel und Säugetiere. So vertraut sie uns sind: Sie stellen nur einen kleinen Teil aller Tierarten – grob geschätzt weniger als fünf Prozent.\n\nDie überwältigende Mehrheit sind Wirbellose: Insekten, Spinnen, Krebse, Schnecken, Muscheln, Tintenfische, Würmer, Quallen und Schwämme. Viele stützen sich mit einem Außenskelett aus Chitin oder Kalk, andere wie Quallen oder Regenwürmer mit dem Druck ihrer Körperflüssigkeit. Wirbellose bestäuben Pflanzen, zersetzen Laub, lockern den Boden und sind Nahrung für unzählige andere Tiere. Ohne sie würden die meisten Ökosysteme schlicht zusammenbrechen."],
      ["Säugetiere – was sie verbindet", "Namensgebend ist die Milch: Alle Säugetierweibchen versorgen ihren Nachwuchs mit Milch aus Milchdrüsen. Weitere gemeinsame Merkmale sind Haare – selbst junge Wale tragen einige Borsten –, drei winzige Gehörknöchelchen im Mittelohr und eine gleichbleibend hohe Körpertemperatur.\n\nRund 6.500 Säugetierarten sind bekannt, von der Etruskerspitzmaus mit etwa zwei Gramm bis zum Blauwal. Bei der Fortpflanzung unterscheidet man drei Wege: Kloakentiere wie das Schnabeltier legen Eier, Beuteltiere bringen winzige Junge zur Welt, die im Beutel weiterwachsen, und Plazentatiere – zu denen wir gehören – versorgen den Nachwuchs lange im Mutterleib. Etwa 40 Prozent aller Säugetierarten sind übrigens Nagetiere, rund ein Fünftel Fledermäuse."],
      ["Beuteltiere", "Kängurus, Koalas, Wombats und Opossums gehören zu den Beuteltieren. Ihre Jungen kommen nach sehr kurzer Tragzeit extrem unfertig zur Welt: Ein neugeborenes Riesenkänguru ist kaum größer als ein Gummibärchen. Aus eigener Kraft krabbelt es durch das Fell der Mutter zur Zitze, saugt sich fest und wächst dort monatelang weiter.\n\nDie meisten Beuteltiere leben in Australien und auf Neuguinea, einige Arten in Amerika. Weil Australien lange isoliert war, besetzten Beuteltiere dort Rollen, die anderswo Plazentatiere einnehmen: Es gibt Beutelmäuse, Gleitbeutler, die an Flughörnchen erinnern, und es gab den wolfsähnlichen Beutelwolf. Er gilt seit 1936 als ausgestorben – das letzte bekannte Tier starb in einem Zoo im tasmanischen Hobart."],
      ["Reptilien – Leben mit der Sonne", "Eidechsen, Schlangen, Schildkröten und Krokodile haben eine trockene, schuppige Haut, die sie vor dem Austrocknen schützt. Ihre Eier besitzen eine Schale und schützende Eihäute, sodass sie – anders als bei den meisten Amphibien – nicht im Wasser abgelegt werden müssen. Das war ein entscheidender Schritt, um das Festland ganz zu erobern.\n\nReptilien sind wechselwarm: Ihre Körpertemperatur richtet sich nach der Umgebung. Morgens tanken sie in der Sonne Wärme, in der Mittagshitze suchen sie Schatten. Das spart enorm Energie – ein Krokodil kommt mit einem Bruchteil der Nahrung eines gleich schweren Säugetiers aus. Bei vielen Schildkröten und bei Krokodilen entscheidet sogar die Bruttemperatur, ob aus einem Ei ein Männchen oder ein Weibchen schlüpft."],
      ["Amphibien – zwei Leben", "Frösche, Kröten, Molche, Salamander und die beinlosen Blindwühlen sind Amphibien. Der Name bedeutet „doppellebig“: Viele beginnen ihr Leben als Larve im Wasser – etwa als Kaulquappe mit Kiemen und Ruderschwanz – und verwandeln sich später in ein lungenatmendes Landtier. Diese Umwandlung nennt man Metamorphose.\n\nAmphibien nehmen einen erheblichen Teil ihres Sauerstoffs über die dünne, feuchte Haut auf. Das macht sie empfindlich für Schadstoffe, Trockenheit und Krankheiten. Seit einigen Jahrzehnten sterben weltweit Bestände an einem Chytridpilz, der die Haut befällt. Amphibien gelten heute als die am stärksten bedrohte Wirbeltiergruppe: Rund 40 Prozent der untersuchten Arten sind laut Roter Liste gefährdet."],
      ["Fische – die artenreichsten Wirbeltiere", "Mit über 35.000 bekannten Arten stellen Fische etwa die Hälfte aller Wirbeltierarten. Sie besiedeln Tiefseegräben, Korallenriffe, Gebirgsbäche und sogar heiße Quellen in der Wüste. Grob unterscheidet man Knorpelfische wie Haie und Rochen von den Knochenfischen, zu denen fast alle übrigen gehören.\n\nFische atmen über Kiemen, die Sauerstoff aus dem vorbeiströmenden Wasser aufnehmen. Viele Knochenfische regulieren mit der gasgefüllten Schwimmblase ihren Auftrieb und schweben so mühelos in einer bestimmten Tiefe. Haie haben keine Schwimmblase; ihnen hilft unter anderem eine große, ölreiche Leber. Mit dem Seitenlinienorgan entlang der Flanken spüren Fische feinste Wasserbewegungen – deshalb weicht ein Schwarm blitzschnell wie ein einziges Wesen aus."],
      ["Gleichwarm oder wechselwarm?", "Vögel und Säugetiere halten ihre Körpertemperatur mit selbst erzeugter Wärme konstant – sie sind gleichwarm. Der Vorteil: Sie bleiben auch bei Kälte und nachts voll aktiv. Der Preis ist hoch, denn ein großer Teil der Nahrungsenergie wird schlicht in Wärme verwandelt. Winzige Säugetiere wie Spitzmäuse müssen deshalb fast ununterbrochen fressen.\n\nWechselwarme Tiere wie Reptilien, Amphibien, Fische und Insekten beziehen ihre Wärme überwiegend von außen. Sie kommen mit einem Bruchteil der Nahrung aus, werden bei Kälte aber träge. Ganz scharf ist die Grenze nicht: Thunfische und manche Haie halten ihre Schwimmmuskeln wärmer als das Wasser, und Hummeln heizen sich vor dem Start durch Muskelzittern auf."],
      ["Sinne jenseits des Menschen", "Viele Tiere nehmen Dinge wahr, die uns verborgen bleiben. Bienen und viele Vögel sehen ultraviolettes Licht – Blüten zeigen ihnen dadurch Muster, die für uns unsichtbar sind. Grubenottern wie Klapperschlangen spüren mit Sinnesgruben am Kopf die Wärmestrahlung einer Maus, selbst in völliger Dunkelheit.\n\nHaie und Rochen besitzen Lorenzinische Ampullen, mit denen sie winzige elektrische Felder wahrnehmen, wie sie die Muskeln eines im Sand versteckten Fisches erzeugen. Zugvögel und Meeresschildkröten orientieren sich zusätzlich am Magnetfeld der Erde. Und die Nase eines Hundes enthält, je nach Rasse, ein Vielfaches der Riechzellen eines Menschen – Schätzungen gehen von rund 200 Millionen und mehr gegenüber etwa 5 bis 6 Millionen aus."],
      ["Wie Tiere kommunizieren", "Tiere tauschen Informationen über Laute, Gerüche, Farben, Bewegungen und Berührungen aus. Honigbienen zeigen mit dem Schwänzeltanz, in welcher Richtung und Entfernung eine Futterquelle liegt. Viele Säugetiere markieren ihr Revier mit Duftstoffen, und Glühwürmchen locken Partner mit Lichtsignalen.\n\nManche Botschaften reisen erstaunlich weit. Elefanten erzeugen tiefe Infraschall-Laute, die Artgenossen über mehrere Kilometer wahrnehmen – teils sogar als Vibrationen im Boden. Die Gesänge von Buckelwalen tragen unter Wasser über große Distanzen. Präriehunde haben unterschiedliche Warnrufe, die offenbar verraten, ob sich ein Greifvogel, ein Kojote oder ein Mensch nähert. Und Große Tümmler entwickeln individuelle Pfiffe, die wie Namen funktionieren."],
      ["Warnfarben und Mimikry", "Nicht jedes Tier versteckt sich. Pfeilgiftfrösche, Wespen oder Feuersalamander fallen mit knalligen Farben auf – und das ist Absicht. Diese Warntracht signalisiert Fressfeinden: Vorsicht, giftig oder wehrhaft! Ein Räuber, der einmal schlechte Erfahrungen gemacht hat, lässt ähnlich aussehende Beute künftig in Ruhe.\n\nGenau das nutzen Nachahmer. Bei der Bates’schen Mimikry imitiert eine harmlose Art eine gefährliche: Viele Schwebfliegen sehen Wespen zum Verwechseln ähnlich, besitzen aber keinen Stachel. Bei der Müller’schen Mimikry ähneln sich mehrere wehrhafte Arten, etwa verschiedene Wespen und Bienen mit gelb-schwarzem Muster. Räuber lernen so schneller, und alle Beteiligten profitieren von der gemeinsamen Warnung."],
      ["Symbiose – Zusammenleben mit Vorteil", "Unter Symbiose versteht man im Alltag ein Zusammenleben, von dem beide Partner profitieren – Fachleute sprechen dann von Mutualismus. Putzerlippfische etwa betreiben an Riffen regelrechte Putzstationen: Große Raubfische halten still, öffnen sogar das Maul und lassen sich Parasiten und abgestorbene Haut entfernen. Der Putzer bekommt Futter, der Kunde bleibt gesund.\n\nEs gibt auch einseitigere Beziehungen. Beim Kommensalismus profitiert ein Partner, ohne den anderen zu stören – Seepocken fahren zum Beispiel auf Walen mit. Beim Parasitismus lebt einer auf Kosten des anderen. Oft sind die Grenzen fließend: Ameisen schützen Blattläuse vor Marienkäfern und „melken“ dafür deren zuckrigen Honigtau – eine Art Viehhaltung im Kleinen."],
      ["Räuber und Beute", "Räuber und Beutetiere beeinflussen sich gegenseitig. Ein berühmtes Beispiel stammt aus Kanada: Aufzeichnungen von Pelzhändlern zeigen, dass die Bestände von Schneeschuhhasen und Luchsen über viele Jahrzehnte in Zyklen von rund zehn Jahren schwankten. Gibt es viele Hasen, vermehren sich die Luchse; fressen sie die Hasen knapp, bricht auch der Luchsbestand ein.\n\nÜber Generationen entsteht so ein evolutionäres Wettrüsten. Gazellen schlagen Haken, Geparde werden schneller; Beutetiere entwickeln Gifte, Räuber Unempfindlichkeit. Räuber erbeuten zudem häufig kranke oder schwache Tiere und halten Bestände dadurch gesund. Fehlen große Beutegreifer ganz, können Pflanzenfresser sich so stark vermehren, dass sie ganze Landschaften verändern."],
      ["Winterschlaf, Winterruhe, Kältestarre", "Tiere überstehen den Winter auf ganz unterschiedliche Weise. Igel, Siebenschläfer und viele Fledermäuse halten echten Winterschlaf: Ihre Körpertemperatur fällt stark ab – beim Igel auf nur wenige Grad –, das Herz schlägt extrem langsam, und sie zehren monatelang von ihren Fettreserven. Zwischendurch wachen sie kurz auf, was jedes Mal viel Energie kostet.\n\nBraunbären, Dachse und Eichhörnchen halten dagegen Winterruhe: Die Temperatur sinkt nur wenig, sie wachen häufiger auf, und Eichhörnchen plündern ihre Vorratsverstecke. Wechselwarme Tiere wie Frösche, Eidechsen und viele Insekten fallen in Kältestarre – ein passiver Zustand, der von der Außentemperatur abhängt. Der nordamerikanische Waldfrosch übersteht dabei sogar, dass ein großer Teil seines Körperwassers gefriert."],
      ["Schwarmverhalten", "Tausende Stare, die abends als wogende Wolke über den Himmel ziehen, folgen keinem Anführer. Untersuchungen zeigen, dass sich jeder Vogel nur an einer Handvoll direkter Nachbarn orientiert – etwa sechs bis sieben. Aus wenigen einfachen Regeln – Abstand halten, Richtung angleichen, zusammenbleiben – entsteht ein Muster, das wie choreografiert wirkt.\n\nSchwärme bieten Schutz: Ein Raubtier kann sich in der wirbelnden Masse schwer auf ein einzelnes Ziel konzentrieren, und viele Augen entdecken Gefahr früher. Ameisen finden mit Duftspuren gemeinsam den kürzesten Weg zu einer Futterquelle, weil kürzere Wege häufiger begangen und deshalb stärker markiert werden. Solche Prinzipien der Schwarmintelligenz nutzen Informatiker heute sogar für Rechenverfahren und Roboter."],
      ["Werkzeuggebrauch bei Tieren", "Lange galt Werkzeuggebrauch als etwas typisch Menschliches – bis Jane Goodall in den 1960er-Jahren beobachtete, wie Schimpansen Zweige zurechtmachten, um Termiten aus ihren Hügeln zu angeln. Heute kennt man viele Beispiele: Schimpansen knacken Nüsse mit Steinen, Seeotter zerschlagen Muscheln auf einem Stein, den sie auf dem Bauch balancieren.\n\nBesonders geschickt sind Geradschnabelkrähen aus Neukaledonien: Sie biegen Zweige zu Haken und stellen Werkzeuge aus Blättern her. Große Tümmler in der Shark Bay in Australien tragen Meeresschwämme auf der Schnauze, um sie beim Wühlen im Boden zu schützen, und manche Kraken schleppen Kokosnussschalen mit, die sie als tragbaren Unterschlupf nutzen."],
      ["Wie Tiere schlafen", "Schlaf ist im Tierreich weit verbreitet, sieht aber sehr unterschiedlich aus. Delfine und manche Vögel schlafen mit jeweils nur einer Gehirnhälfte, während die andere wach bleibt – so können Delfine weiter zum Atmen auftauchen und nach Gefahren Ausschau halten. Mauersegler bleiben nach dem Ausfliegen oft zehn Monate ununterbrochen in der Luft und schlafen wohl im Flug.\n\nGiraffen kommen in freier Wildbahn mit wenigen Stunden Schlaf aus, verteilt auf kurze Nickerchen. Pferde dösen im Stehen, weil ein Sperrmechanismus in den Beinen sie stützt – für den Tiefschlaf müssen sie sich aber hinlegen. Fledermäuse wiederum verschlafen einen Großteil des Tages: Manche Arten schlafen bis zu 20 Stunden täglich."],
      ["Warum manche Tiere uralt werden", "Ein Grönlandwal kann über 200 Jahre alt werden – in erlegten Tieren fand man Harpunenspitzen aus dem 19. Jahrhundert. Der Grönlandhai wird nach Schätzungen sogar rund 400 Jahre alt. Und eine Islandmuschel, deren Jahresringe man zählte, hatte 507 Jahre erreicht – sie war schon alt, als Luther seine Thesen veröffentlichte.\n\nFaustregel: Große Tiere mit langsamem Stoffwechsel, kaltem Lebensraum und wenigen Feinden leben meist länger. Doch es gibt Ausnahmen, die Forschende besonders interessieren: Manche Fledermäuse werden über 40 Jahre alt, der Nacktmull über 30 – viel älter, als ihre Größe erwarten ließe. Ihre Zellen scheinen Schäden besonders gut zu reparieren, was Hinweise auf gesundes Altern auch beim Menschen liefern könnte."],
      ["Die Grenzen der Größe", "Warum gibt es keine Ameisen von der Größe eines Hundes? Ein Grund ist das Quadrat-Würfel-Gesetz: Verdoppelt man die Länge eines Tieres, wächst seine Oberfläche auf das Vierfache, sein Gewicht aber auf das Achtfache. Beine müssen deshalb überproportional dick werden – deutlich zu sehen bei Elefanten. Der Blauwal kann nur so riesig sein, weil ihn das Wasser trägt.\n\nInsekten atmen über Tracheen, feine Röhren, durch die Luft direkt ins Gewebe strömt. Bei großen Körpern funktioniert das schlecht. Vor rund 300 Millionen Jahren enthielt die Luft allerdings mehr Sauerstoff als heute – damals flogen libellenartige Insekten wie Meganeura mit bis zu etwa 70 Zentimetern Flügelspannweite durch die Wälder."],
      ["Wie Wildtiere zu Haustieren wurden", "Der Hund war das erste Haustier: Er stammt von einer Wolfspopulation ab und lebte schon vor mindestens 15.000 Jahren mit Menschen zusammen – lange bevor es Ackerbau gab. Ziegen, Schafe, Rinder und Schweine folgten vor rund 10.000 Jahren, als Menschen im Nahen Osten sesshaft wurden. Pferde wurden deutlich später gezähmt, die Vorfahren unserer heutigen Hauspferde vor gut 4.000 Jahren in den Steppen Eurasiens.\n\nDomestizierte Tiere ähneln sich oft auf überraschende Weise: Hängeohren, gescheckte Fellfarben, kürzere Schnauzen und kleinere Gehirne. Ein berühmtes Experiment in Sibirien zeigte das: Füchse, die über Jahrzehnte nur nach Zahmheit ausgewählt wurden, bekamen nach einigen Generationen genau solche Merkmale."],
      ["Invasive Arten", "Gelangen Tiere in Regionen, in denen sie keine natürlichen Feinde haben, können sie sich explosionsartig ausbreiten. 1859 ließ ein Siedler in Australien zwei Dutzend Kaninchen frei, um sie zu jagen – wenige Jahrzehnte später waren es Hunderte Millionen, die Weideland kahlfraßen. 1935 wurden Aga-Kröten eingeführt, um Käfer auf Zuckerrohrfeldern zu bekämpfen; stattdessen vergifteten sie viele einheimische Räuber, die sie fraßen.\n\nAuch in Deutschland gibt es Beispiele: Der nordamerikanische Waschbär wurde 1934 in Hessen ausgesetzt, dazu kamen Tiere aus Pelzfarmen. Heute lebt er in weiten Teilen des Landes. Nicht jede eingewanderte Art richtet Schaden an – als invasiv gelten nur jene, die heimische Arten oder Lebensräume spürbar bedrohen."],
      ["Das große Artensterben", "Aussterben gehört zur Evolution – die allermeisten Arten, die je lebten, gibt es nicht mehr. Doch derzeit verschwinden Arten nach Einschätzung vieler Forschender um ein Vielfaches schneller als im natürlichen Hintergrund. Der Weltbiodiversitätsrat schätzte 2019, dass rund eine Million Tier- und Pflanzenarten vom Aussterben bedroht sind.\n\nDie wichtigsten Ursachen sind der Verlust von Lebensräumen, Übernutzung durch Jagd und Fischerei, der Klimawandel, Verschmutzung und eingeschleppte Arten. Es gibt aber auch Erfolge: Der Seeadler brütet wieder in Deutschland, Wisente leben wieder frei in Europa, und Buckelwale haben sich nach dem Walfangverbot vielerorts erholt. Schutzgebiete und konsequente Gesetze wirken – wenn sie lange genug bestehen."],
      ["Brutpflege – von null bis rundum versorgt", "Tiere verfolgen sehr unterschiedliche Strategien. Ein Kabeljauweibchen gibt Millionen Eier ins offene Meer ab und kümmert sich um keines – die schiere Menge sorgt dafür, dass einige überleben. Ein Elefant dagegen trägt ein einziges Kalb rund 22 Monate aus und betreut es danach viele Jahre in der Herde.\n\nDazwischen gibt es erstaunliche Lösungen. Beim Seepferdchen trägt das Männchen die Eier in einer Bruttasche aus. Maulbrütende Buntbarsche nehmen ihre Jungen bei Gefahr ins Maul, und Krokodilmütter tragen frisch geschlüpfte Junge vorsichtig im Maul zum Wasser. Der Kuckuck hingegen spart sich die Mühe ganz: Er legt seine Eier in fremde Nester und lässt andere Vögel die Arbeit machen."],
      ["Leben in der Nacht", "Viele Tiere sind nachtaktiv – sie meiden so Hitze und Fressfeinde oder jagen selbst im Schutz der Dunkelheit. Katzen, Rehe und viele andere besitzen hinter der Netzhaut eine spiegelnde Schicht, das Tapetum lucidum. Es wirft Licht ein zweites Mal durch die Sinneszellen zurück; deshalb leuchten ihre Augen im Scheinwerferlicht.\n\nAndere setzen auf Größe oder andere Sinne. Beim Koboldmaki ist jeder Augapfel etwa so groß wie sein Gehirn. Eulen haben bei vielen Arten asymmetrisch sitzende Ohröffnungen und orten eine Maus allein nach Gehör. Fledermäuse nutzen Echoortung. Künstliches Licht stört viele dieser Tiere erheblich – Lichtverschmutzung gilt inzwischen als ernstes Problem, etwa für Insekten und Zugvögel."],
      ["Konvergente Evolution", "Manchmal entwickeln nicht verwandte Tiere unabhängig voneinander sehr ähnliche Lösungen. Fliegen können Insekten, Vögel, Fledermäuse und die ausgestorbenen Flugsaurier – ihre Flügel sind aber jeweils ganz anders aufgebaut. Haie, die ausgestorbenen Fischsaurier und Delfine haben eine fast identische Stromlinienform, obwohl ein Fisch, ein Reptil und ein Säugetier dahinterstehen.\n\nAuch das Linsenauge ist mehrfach entstanden: bei Wirbeltieren und bei Kraken. Interessanterweise ist das Krakenauge sogar ein wenig besser konstruiert – die Nervenfasern liegen hinter der Netzhaut, sodass ein blinder Fleck fehlt. Die Erklärung für solche Parallelen: Wer vor denselben physikalischen Problemen steht, landet oft bei ähnlichen Antworten."]

      nd.bonus.forEach(id => { if (d.solved[id]) nd.solved[id] = true; });

    } else if (!d.done) {
      const keep = d.ids.filter(id => d.solved[id] || stillActive(id));
      const missing = d.ids.length - keep.length;
      if (missing > 0) {
        const rng = mulberry32(hashStr("refill|" + d.date + "|" + Date.now()));

  const FEMALE_RX = /(anna|helena|petra|katja|hedda|marlene|vicki|sandy|shelley|grandma|amala|seraphina|louisa|elke|klara|tanja|ingrid|google deutsch|\bfemale\b|weiblich)/i;
  const MALE_RX = /(markus|yannick|martin|viktor|stefan|conrad|eddy|\bflo\b|reed|rocko|grandpa|killian|florian|ralf|jonas|\bhans\b|\bmale\b|männlich)/i;
  const CLASSIC_RX = /(anna|helena|petra|katja|markus|yannick|martin|viktor|stefan|conrad|google deutsch)/i;
  const TTS = {
    ok: "speechSynthesis" in window && "SpeechSynthesisUtterance" in window,
    id: null, token: 0, voice: null, exact: false,
    init() {
      if (!this.ok) return;
      const re = () => { this.pick(); if (ui.tab === "profile" && state) renderVoiceName(); };
      re();
      try { speechSynthesis.addEventListener("voiceschanged", re); } catch (e) { speechSynthesis.onvoiceschanged = re; }
    },
    pick() {
      if (!this.ok) return;
      const r = pickVoice(state ? state.settings.voice : "female");
      this.voice = r.voice; this.exact = r.exact;
    },
    speak(id, text) {
      if (!this.ok) { toast("Vorlesen wird hier nicht unterstützt", "🔇"); return; }
      this.stop();
      const my = ++this.token;
      this.id = id;
      const gender = state ? state.settings.voice : "female";
      const parts = String(text).match(/[^.!?…]+[.!?…]+["“”«»)]*\s*|[^.!?…]+$/g) || [text];
      const chunks = [];
      let buf = "";
      parts.forEach(p => { buf += p; if (buf.length > 150) { chunks.push(buf.trim()); buf = ""; } });
      if (buf.trim()) chunks.push(buf.trim());
      try {
        chunks.forEach((c, i) => {
          const u = new SpeechSynthesisUtterance(c);
          u.lang = "de-DE";
          if (this.voice) u.voice = this.voice;
          u.rate = state ? state.settings.rate : 1;
          u.pitch = this.exact ? 1 : (gender === "male" ? 0.72 : 1.1);
          if (i === chunks.length - 1) u.onend = () => { if (my === this.token) this.finish(); };
          u.onerror = ev => { if (my === this.token && ev.error !== "interrupted" && ev.error !== "canceled") this.finish(); };
          speechSynthesis.speak(u);
        });
        if (speechSynthesis.paused) speechSynthesis.resume();
      } catch (e) { this.finish(); return; }
      this.sync();
    },
    toggle(id, text) { if (this.id === id) this.stop(); else this.speak(id, text); },
    stop() {
      if (!this.ok) return;
      this.token++;
      try { if (speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel(); } catch (e) { /* ignorieren */ }
      this.id = null; this.sync();
    },
    finish() { this.id = null; this.sync(); },
    sync() {
      $$(".play").forEach(b => {
        const on = b.dataset.id === this.id;
        b.classList.toggle("playing", on);
        const l = b.querySelector(".play-label");
        if (l) l.textContent = on ? "Stopp" : "Anhören";
        b.setAttribute("aria-label", on ? "Vorlesen stoppen" : "Vorlesen");
      });
    }
  };
  function pickVoice(gender) {
    let vs = [];
    try { vs = speechSynthesis.getVoices() || []; } catch (e) { vs = []; }
    const de = vs.filter(v => /^de([-_]|$)/i.test(v.lang));
    if (!de.length) return { voice: null, exact: false };
    const rx = gender === "male" ? MALE_RX : FEMALE_RX;
    const other = gender === "male" ? FEMALE_RX : MALE_RX;
    const score = v => (/de[-_]DE/i.test(v.lang) ? 4 : 0) + (/(premium|enhanced|erweitert|natural|neural|online)/i.test(v.name) ? 3 : 0) + (CLASSIC_RX.test(v.name) ? 2 : 0) + (/(grandma|grandpa)/i.test(v.name) ? -3 : 0) + (v.localService ? 1 : 0);
    const best = list => list.slice().sort((a, b) => score(b) - score(a))[0];
    const match = de.filter(v => rx.test(v.name) && !other.test(v.name));
    if (match.length) return { voice: best(match), exact: true };
    const neutral = de.filter(v => !other.test(v.name));
    return { voice: best(neutral.length ? neutral : de), exact: false };

  function fold(s) {
    let o = "";
    for (let i = 0; i < s.length; i++) {
      const ch = s[i];
      const f = ch.normalize ? ch.normalize("NFD")[0] : ch;
      const low = f.toLowerCase();
      o += low.length === 1 ? low : f;
    }
    return o;
  }
  const termsOf = q => fold(q.trim()).split(/\s+/).filter(Boolean);
  function fullText(it) {
    switch (it.type) {
      case "card": { const c = it.card; return [c.title, c.story, c.funFact, c.quiz.question, c.quiz.options.join(" "), c.quiz.explanation].join(" \n "); }
      case "wissen": return it.t + " \n " + it.x;
      case "fact": return it.f;
      case "quiz": return [it.q, it.o.join(" "), it.x].join(" \n ");
      case "tf": return it.s + " \n " + it.x;
      case "hl": return [it.ref, it.p, it.x].join(" \n ");
      default: return "";
    }
  }
  function titleOf(it) {
    switch (it.type) {
      case "card": return it.card.title;
      case "wissen": return it.t;
      case "fact": { const m = it.f.match(/^.{20,110}?[.!?](\s|$)/); return m ? m[0].trim() : (it.f.length > 110 ? it.f.slice(0, 110).replace(/\s+\S*$/, "") + " …" : it.f); }
      case "quiz": return it.q;
      case "tf": return it.s;
      case "hl": return it.p;
      default: return "";
    }
  }
  function baseSnippet(it) {
    switch (it.type) {
      case "card": return it.card.story;
      case "wissen": return it.x;
      case "fact": { const t = titleOf(it).replace(/ …$/, ""); return it.f.length > t.length + 2 ? it.f.slice(t.length).trim() : ""; }
      case "quiz": return "Antwort: " + it.o[it.a] + " – " + it.x;
      case "tf": return (it.a ? "✓ Richtig" : "✗ Falsch") + " – " + it.x;
      case "hl": return "Antwort: " + it.l[it.a] + " – " + it.x;
      default: return "";
    }
  }
  function highlight(text, terms) {
    if (!terms.length) return esc(text);
    const f = fold(text);
    const ranges = [];
    terms.forEach(t => { let i = f.indexOf(t); while (i !== -1 && t.length) { ranges.push([i, i + t.length]); i = f.indexOf(t, i + t.length); } });
    if (!ranges.length) return esc(text);
    ranges.sort((a, b) => a[0] - b[0]);
    const merged = [];
    ranges.forEach(r => { const last = merged[merged.length - 1]; if (last && r[0] <= last[1]) last[1] = Math.max(last[1], r[1]); else merged.push(r.slice()); });
    let out = "", pos = 0;
    merged.forEach(r => { out += esc(text.slice(pos, r[0])) + "<mark>" + esc(text.slice(r[0], r[1])) + "</mark>"; pos = r[1]; });
    return out + esc(text.slice(pos));
  }
  function snippet(it, terms) {
    const base = baseSnippet(it);
    const src = terms.length ? fullText(it) : base;
    if (terms.length) {
      const f = fold(src);
      let idx = -1;
      terms.forEach(t => { const i = f.indexOf(t); if (i !== -1 && (idx === -1 || i < idx)) idx = i; });
      if (idx !== -1) {
        let start = Math.max(0, idx - 48);
        if (start > 0) { const sp = src.indexOf(" ", start); if (sp !== -1 && sp < idx) start = sp + 1; }
        const piece = src.slice(start, start + 170).replace(/\s*\n\s*/g, " · ");
        return (start > 0 ? "… " : "") + highlight(piece, terms) + (start + 170 < src.length ? " …" : "");
      }
    }
    return esc(base.length > 160 ? base.slice(0, 160).replace(/\s+\S*$/, "") + " …" : base);
  }
