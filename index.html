<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lumen">
<meta name="application-name" content="Lumen">
<meta name="format-detection" content="telephone=no">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#EEF0F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#07080F" media="(prefers-color-scheme: dark)">
<title>Lumen</title>
<style>
  :root {
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --font-rounded: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;

    --bg: #EEF0F8;
    --bg-grad: linear-gradient(160deg, #F5F2FC 0%, #EAF0FA 48%, #F7EFE8 100%);
    --blob1: rgba(124, 108, 255, 0.36);
    --blob2: rgba(255, 168, 88, 0.30);
    --blob3: rgba(52, 199, 170, 0.24);
    --accent-op: 0.30;

    --glass: rgba(255, 255, 255, 0.55);
    --glass-strong: rgba(255, 255, 255, 0.78);
    --glass-soft: rgba(255, 255, 255, 0.42);
    --glass-border: rgba(255, 255, 255, 0.25);
    --hl: inset 0 1px 0 rgba(255, 255, 255, 0.7), inset 0 0 0 0.5px rgba(255, 255, 255, 0.35);
    --shadow: 0 14px 40px rgba(40, 44, 90, 0.10), 0 2px 8px rgba(40, 44, 90, 0.05);
    --shadow-lg: 0 24px 60px rgba(40, 44, 90, 0.16), 0 4px 14px rgba(40, 44, 90, 0.06);

    --bar: rgba(244, 245, 251, 0.72);
    --tab-bg: rgba(255, 255, 255, 0.58);
    --tab-ind: rgba(118, 118, 128, 0.14);
    --sheet-bg: rgba(246, 247, 252, 0.88);
    --alert-bg: rgba(242, 242, 247, 0.86);

    --label: #0B0B12;
    --label2: rgba(60, 60, 67, 0.68);
    --label3: rgba(60, 60, 67, 0.36);
    --sep: rgba(60, 60, 67, 0.14);
    --fill: rgba(118, 118, 128, 0.12);
    --fill2: rgba(118, 118, 128, 0.20);
    --switch-off: rgba(120, 120, 128, 0.20);

    --tint: #5E5CE6;
    --tint-rgb: 94, 92, 230;
    --green: #34C759;
    --green-rgb: 52, 199, 89;
    --red: #FF3B30;
    --red-rgb: 255, 59, 48;
    --orange: #FF9500;
    --blue: #007AFF;

    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    --ease-sheet: cubic-bezier(0.32, 0.72, 0, 1);
    --ease-spring: cubic-bezier(0.34, 1.4, 0.64, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #07080F;
      --bg-grad: linear-gradient(160deg, #0B0C18 0%, #07080F 52%, #100B14 100%);
      --blob1: rgba(94, 92, 230, 0.34);
      --blob2: rgba(255, 120, 60, 0.18);
      --blob3: rgba(20, 170, 160, 0.20);
      --accent-op: 0.32;

      --glass: rgba(30, 32, 46, 0.52);
      --glass-strong: rgba(40, 42, 58, 0.84);
      --glass-soft: rgba(255, 255, 255, 0.06);
      --glass-border: rgba(255, 255, 255, 0.25);
      --hl: inset 0 1px 0 rgba(255, 255, 255, 0.16), inset 0 0 0 0.5px rgba(255, 255, 255, 0.06);
      --shadow: 0 18px 48px rgba(0, 0, 0, 0.45), 0 2px 8px rgba(0, 0, 0, 0.3);
      --shadow-lg: 0 28px 70px rgba(0, 0, 0, 0.55), 0 4px 14px rgba(0, 0, 0, 0.35);

      --bar: rgba(12, 13, 22, 0.64);
      --tab-bg: rgba(30, 32, 46, 0.64);
      --tab-ind: rgba(255, 255, 255, 0.12);
      --sheet-bg: rgba(22, 23, 34, 0.9);
      --alert-bg: rgba(40, 40, 52, 0.88);

      --label: #FFFFFF;
      --label2: rgba(235, 235, 245, 0.64);
      --label3: rgba(235, 235, 245, 0.32);
      --sep: rgba(255, 255, 255, 0.10);
      --fill: rgba(118, 118, 128, 0.24);
      --fill2: rgba(118, 118, 128, 0.36);
      --switch-off: rgba(120, 120, 128, 0.34);

      --tint: #7D7AFF;
      --tint-rgb: 125, 122, 255;
      --green: #30D158;
      --green-rgb: 48, 209, 88;
      --red: #FF453A;
      --red-rgb: 255, 69, 58;
      --orange: #FF9F0A;
      --blue: #0A84FF;
    }
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; background: var(--bg); }
  body {
    font-family: var(--font); color: var(--label);
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    touch-action: manipulation;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; -webkit-appearance: none; appearance: none; touch-action: manipulation; text-align: inherit; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--tint); outline-offset: 2px; }
  button:disabled { cursor: default; }
  svg { display: block; }

  .glass { background: var(--glass); -webkit-backdrop-filter: blur(28px) saturate(180%); backdrop-filter: blur(28px) saturate(180%); border: 1px solid var(--glass-border); box-shadow: var(--shadow), var(--hl); }
  .tinted { --ink: var(--c-lo); }
  @media (prefers-color-scheme: dark) { .tinted { --ink: var(--c-hi); } }

  /* ---------- Hintergrund ---------- */
  #bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; background: var(--bg-grad); pointer-events: none; }
  .blob { position: absolute; border-radius: 50%; will-change: transform; }
  .b1 { width: 80vmax; height: 80vmax; left: -30vmax; top: -34vmax; background: radial-gradient(closest-side, var(--blob1), transparent); animation: drift1 28s ease-in-out infinite alternate; }
  .b2 { width: 70vmax; height: 70vmax; right: -30vmax; bottom: -26vmax; background: radial-gradient(closest-side, var(--blob2), transparent); animation: drift2 32s ease-in-out infinite alternate; }
  .b3 { width: 55vmax; height: 55vmax; left: -18vmax; bottom: 4vh; background: radial-gradient(closest-side, var(--blob3), transparent); animation: drift3 36s ease-in-out infinite alternate; }
  .b4 { width: 70vmax; height: 70vmax; right: -28vmax; top: 6vh; color: var(--tint); background: radial-gradient(closest-side, currentColor, transparent); opacity: var(--accent-op); transition: color 1.2s ease; animation: drift2 40s ease-in-out infinite alternate-reverse; }
  @keyframes drift1 { to { transform: translate(12vmax, 10vmax) scale(1.08); } }
  @keyframes drift2 { to { transform: translate(-10vmax, -8vmax) scale(1.12); } }
  @keyframes drift3 { to { transform: translate(14vmax, -12vmax) scale(0.92); } }

  /* ---------- App-Rahmen ---------- */
  #app { position: fixed; inset: 0; z-index: 1; transform-origin: 50% 100%; transition: transform 0.5s var(--ease-sheet), border-radius 0.5s var(--ease-sheet), filter 0.5s; }
  body.sheet-open #app { transform: scale(0.94) translateY(6px); border-radius: 22px; overflow: hidden; filter: brightness(0.86); }

  .view {
    position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden;
    -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain;
    padding-top: env(safe-area-inset-top);
    padding-bottom: calc(env(safe-area-inset-bottom) + 60px);
    opacity: 0; visibility: hidden; transform: translateY(12px) scale(0.985);
    transition: opacity 0.3s ease, transform 0.45s var(--ease-out), visibility 0s linear 0.45s;
  }
  .view.active { opacity: 1; visibility: visible; transform: none; transition: opacity 0.3s ease, transform 0.45s var(--ease-out), visibility 0s; }
  .view.behind { opacity: 0; transform: translateX(-24%); }
  #view-theme { transform: translateX(100%); opacity: 1; transition: transform 0.45s var(--ease-sheet), visibility 0s linear 0.45s; }
  #view-theme.active { transform: none; transition: transform 0.45s var(--ease-sheet), visibility 0s; }
  .view.instant, .view.instant * { transition: none !important; }
  .view-inner { max-width: 680px; margin: 0 auto; padding: 8px 16px 64px; }

  #navbar { position: fixed; top: 0; left: 0; right: 0; z-index: 20; height: calc(env(safe-area-inset-top) + 44px); padding-top: env(safe-area-inset-top); display: flex; align-items: center; justify-content: center; pointer-events: none; }
  #navbar::before { content: ""; position: absolute; inset: 0; background: var(--bar); -webkit-backdrop-filter: blur(28px) saturate(180%); backdrop-filter: blur(28px) saturate(180%); border-bottom: 0.5px solid var(--sep); opacity: 0; transition: opacity 0.25s ease; }
  #navbar.scrolled::before { opacity: 1; }
  #navbar .nt { position: relative; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; opacity: 0; transform: translateY(8px); transition: opacity 0.25s ease, transform 0.35s var(--ease-out); max-width: 60%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #navbar.titled .nt { opacity: 1; transform: none; }

  .lh { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 14px 4px 16px; }
  .lh > div:first-child { min-width: 0; }
  .eyebrow { font-size: 13px; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; color: var(--label2); margin-bottom: 2px; }
  .lh h1 { font-family: var(--font-display); font-size: 34px; line-height: 41px; font-weight: 800; letter-spacing: -0.025em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lh h1 .greet { display: block; font-size: 22px; line-height: 28px; font-weight: 700; letter-spacing: -0.01em; color: var(--label2); overflow: hidden; text-overflow: ellipsis; }
  .section-title { font-size: 13px; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; color: var(--label2); padding: 26px 6px 8px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .section-title small { text-transform: none; letter-spacing: 0; font-weight: 500; font-size: 13px; }
  .section-note { font-size: 14px; line-height: 1.4; color: var(--label2); padding: 0 6px 12px; margin-top: -2px; }
  .footnote { font-size: 12.5px; color: var(--label3); text-align: center; padding: 22px 12px 0; line-height: 1.5; }

  /* ---------- Tab-Leiste ---------- */
  #tabbar {
    position: fixed; z-index: 30; left: 50%;
    bottom: max(10px, calc(env(safe-area-inset-bottom) - 10px));
    transform: translateX(-50%); width: min(calc(100% - 28px), 440px); height: 64px;
    border-radius: 32px; padding: 5px; display: grid; grid-template-columns: repeat(4, 1fr);
    background: var(--tab-bg); -webkit-backdrop-filter: blur(28px) saturate(180%); backdrop-filter: blur(28px) saturate(180%);
    border: 1px solid var(--glass-border); box-shadow: 0 16px 40px rgba(0, 0, 0, 0.16), 0 2px 8px rgba(0, 0, 0, 0.06), var(--hl);
    transition: opacity 0.4s ease, transform 0.5s var(--ease-sheet);
  }
  body.sheet-open #tabbar, body.player-open #tabbar { opacity: 0; transform: translate(-50%, 30px); pointer-events: none; }
  .tab-ind { position: absolute; top: 5px; bottom: 5px; left: 5px; width: calc((100% - 10px) / 4); border-radius: 27px; background: var(--tab-ind); box-shadow: var(--hl); transform: translateX(calc(var(--i, 0) * 100%)); transition: transform 0.55s var(--ease-spring); }
  .tab { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--label2); font-size: 10.5px; font-weight: 600; letter-spacing: 0.01em; border-radius: 27px; text-align: center; transition: color 0.25s ease, transform 0.2s ease; }
  .tab:active { transform: scale(0.92); }
  .tab svg { width: 25px; height: 25px; }
  .tab svg .fillable { fill: currentColor; fill-opacity: 0; transition: fill-opacity 0.25s ease; }
  .tab.active { color: var(--tint); }
  .tab.active svg .fillable { fill-opacity: 0.22; }
  .tab-badge { position: absolute; top: 3px; left: calc(50% + 5px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--red); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; font-variant-numeric: tabular-nums; }

  /* ---------- Bedienelemente ---------- */
  .btn-primary, .btn-secondary { width: 100%; height: 54px; border-radius: 18px; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; display: flex; align-items: center; justify-content: center; gap: 8px; text-align: center; transition: transform 0.15s ease, background 0.3s ease, box-shadow 0.3s ease, color 0.3s ease, opacity 0.3s ease; }
  .btn-primary { color: #fff; background: linear-gradient(180deg, rgba(var(--c-rgb, var(--tint-rgb)), 1), rgba(var(--c-rgb, var(--tint-rgb)), 0.82)); box-shadow: 0 12px 26px rgba(var(--c-rgb, var(--tint-rgb)), 0.34), inset 0 1px 0 rgba(255, 255, 255, 0.35); }
  .btn-primary:active:not(:disabled), .btn-secondary:active { transform: scale(0.97); }
  .btn-primary:disabled { background: var(--fill); color: var(--label3); box-shadow: none; }
  .btn-secondary { background: var(--glass-soft); border: 1px solid var(--glass-border); color: var(--ink, var(--tint)); }
  .btn-primary svg, .btn-secondary svg { width: 18px; height: 18px; }
  .btn-row { display: flex; gap: 10px; margin-top: 12px; }
  .btn-row > * { flex: 1; }
  .btn-small { height: 44px; font-size: 15.5px; border-radius: 15px; }

  .switch { position: relative; display: inline-block; width: 51px; height: 31px; flex: none; }
  .switch input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; z-index: 2; cursor: pointer; }
  .switch .track { position: absolute; inset: 0; border-radius: 16px; background: var(--switch-off); transition: background 0.25s ease; }
  .switch .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15), 0 1px 1px rgba(0, 0, 0, 0.16); transition: transform 0.35s var(--ease-spring); }
  .switch input:checked + .track { background: var(--sw-on, var(--green)); }
  .switch input:checked + .track::after { transform: translateX(20px); }

  .list { border-radius: 22px; overflow: hidden; }
  .row { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 11px 14px; text-align: left; }
  .row + .row::before { content: ""; position: absolute; top: 0; right: 0; left: var(--inset, 14px); height: 0.5px; background: var(--sep); }
  button.row:active { background: var(--fill); }
  .row-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .row-title { font-size: 16.5px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.3; }
  .row-sub { font-size: 13.5px; color: var(--label2); line-height: 1.35; }
  .chev { color: var(--label3); flex: none; }
  .row.destructive { justify-content: center; color: var(--red); font-weight: 600; font-size: 17px; }

  .seg-ctl { display: grid; grid-template-columns: repeat(3, 1fr); padding: 2px; border-radius: 10px; background: var(--fill); position: relative; }
  .seg-ctl.two { grid-template-columns: repeat(2, 1fr); }
  .seg-ctl button { position: relative; z-index: 1; height: 32px; font-size: 14px; font-weight: 600; border-radius: 8px; color: var(--label); text-align: center; transition: background 0.25s ease, box-shadow 0.25s ease; }
  .seg-ctl button.on { background: var(--glass-strong); box-shadow: 0 3px 8px rgba(0, 0, 0, 0.12), 0 0 0 0.5px rgba(0, 0, 0, 0.04); }

  .pill-btn { flex: none; height: 30px; padding: 0 14px; border-radius: 15px; font-size: 14px; font-weight: 600; background: rgba(var(--c-rgb, var(--tint-rgb)), 0.14); color: var(--ink, var(--tint)); transition: transform 0.15s ease; white-space: nowrap; }
  .pill-btn.solid { background: rgba(var(--c-rgb, var(--tint-rgb)), 0.95); color: #fff; }
  .pill-btn:active { transform: scale(0.94); }

  .avatar { --s: 40px; width: var(--s); height: var(--s); flex: none; border-radius: 50%; display: grid; place-items: center; font-size: calc(var(--s) * 0.54); line-height: 1; background: linear-gradient(145deg, var(--a1), var(--a2)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45), 0 6px 16px rgba(0, 0, 0, 0.14); }
  .head-actions { display: flex; align-items: center; gap: 8px; flex: none; }
  .avatar-btn { border-radius: 50%; transition: transform 0.15s ease; }
  .avatar-btn:active { transform: scale(0.92); }
  .streak-pill { flex: none; display: flex; align-items: center; gap: 5px; height: 40px; padding: 0 13px 0 8px; border-radius: 20px; font-family: var(--font-rounded); font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; transition: transform 0.15s ease; }
  .streak-pill:active { transform: scale(0.94); }

  .badge { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px 0 8px; border-radius: 14px; background: rgba(var(--c-rgb), 0.15); border: 1px solid rgba(var(--c-rgb), 0.24); color: var(--ink); font-size: 12.5px; font-weight: 700; letter-spacing: 0.01em; min-width: 0; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge .emo { font-size: 14px; }
  .meta-tag { display: inline-flex; align-items: center; gap: 4px; flex: none; height: 24px; padding: 0 9px; border-radius: 12px; font-size: 12px; font-weight: 700; color: var(--label2); background: var(--fill); font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* ---------- Karten ---------- */
  .card { position: relative; border-radius: 30px; padding: 18px 18px 20px; overflow: hidden; }
  .card::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 260px; background: radial-gradient(120% 100% at 0% 0%, rgba(var(--c-rgb), 0.22), transparent 62%); pointer-events: none; }
  .card > * { position: relative; }
  .card-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
  .card-top .badge { max-width: 68%; }
  .card-title { font-family: var(--font-display); font-size: clamp(24px, 6.6vw, 30px); line-height: 1.12; font-weight: 800; letter-spacing: -0.024em; margin-bottom: 14px; text-wrap: balance; }
  .card-actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
  .play { flex: none; white-space: nowrap; display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px 0 6px; border-radius: 18px; background: rgba(var(--c-rgb, var(--tint-rgb)), 0.13); border: 1px solid rgba(var(--c-rgb, var(--tint-rgb)), 0.18); color: var(--ink, var(--tint)); font-size: 14px; font-weight: 600; transition: transform 0.15s ease; }
  .play:active { transform: scale(0.95); }
  .play-ico { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--c, var(--tint)); color: #fff; display: grid; place-items: center; box-shadow: 0 4px 10px rgba(var(--c-rgb, var(--tint-rgb)), 0.35); }
  .play-ico svg { width: 12px; height: 12px; margin-left: 1px; }
  .play .eq { display: none; align-items: flex-end; gap: 2px; height: 12px; }
  .play .eq i { width: 3px; border-radius: 1.5px; background: #fff; transform-origin: bottom; animation: eq 0.9s ease-in-out infinite; }
  .play .eq i:nth-child(1) { height: 60%; animation-delay: -0.3s; }
  .play .eq i:nth-child(2) { height: 100%; animation-delay: -0.6s; }
  .play .eq i:nth-child(3) { height: 45%; animation-delay: -0.1s; }
  .play.playing .play-ico svg { display: none; }
  .play.playing .eq { display: flex; }
  .play-dur { color: var(--label2); font-weight: 500; font-variant-numeric: tabular-nums; }
  .play.compact { padding: 0 6px; }
  .play.compact .play-label, .play.compact .play-dur { display: none; }
  @keyframes eq { 0%, 100% { transform: scaleY(0.35); } 50% { transform: scaleY(1); } }
  .icon-btn { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--fill); color: var(--label2); flex: none; transition: transform 0.15s ease, color 0.2s ease; }
  .icon-btn:active { transform: scale(0.9); }
  .icon-btn svg { width: 18px; height: 18px; }
  .icon-btn.on { color: #FFB800; }
  .mastered-note { font-size: 12.5px; font-weight: 600; color: var(--label2); display: inline-flex; align-items: center; gap: 5px; }
  .mastered-note svg { color: var(--green); width: 14px; height: 14px; }

  .story { font-size: 17px; line-height: 1.58; letter-spacing: -0.005em; -webkit-user-select: text; user-select: text; hyphens: auto; -webkit-hyphens: auto; }
  .funfact { margin-top: 18px; padding: 14px 16px 15px; border-radius: 20px; background: rgba(var(--c-rgb), 0.10); border: 1px solid rgba(var(--c-rgb), 0.24); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18); }
  .ff-head { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink); margin-bottom: 6px; }
  .ff-head svg { width: 16px; height: 16px; }
  .funfact p { font-size: 15.5px; line-height: 1.52; -webkit-user-select: text; user-select: text; hyphens: auto; -webkit-hyphens: auto; }

  .quiz { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--sep); }
  .quiz.bare { margin-top: 0; padding-top: 0; border-top: 0; }
  .quiz-head { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: var(--label2); }
  .quiz-head svg { width: 15px; height: 15px; }

  /* ---------- Lern-Player ---------- */
  #player {

  .pl-top { flex: none; display: flex; align-items: center; gap: 10px; padding: calc(env(safe-area-inset-top) + 8px) 14px 6px; max-width: 700px; width: 100%; margin: 0 auto; }

  .btn-choice { height: 58px; border-radius: 20px; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; text-align: center; padding: 0 8px; line-height: 1.15; transition: transform 0.15s ease; -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
  .btn-choice:active { transform: scale(0.96); }

  .btn-choice.low { background: rgba(10, 132, 255, 0.14); color: var(--blue); border: 1px solid rgba(10, 132, 255, 0.3); }

  .btn-choice.wow { background: linear-gradient(135deg, rgba(191, 90, 242, 0.9), rgba(255, 159, 10, 0.9)); color: #fff; border: 0; box-shadow: 0 10px 24px rgba(191, 90, 242, 0.3); }

  .swipe-area { position: relative; width: 100%; max-width: 540px; margin: 0 auto; display: grid; }
  .swipe-ghost { grid-area: 1 / 1; border-radius: 32px; transform: translateY(14px) scale(0.93); opacity: 0.6; }
  .swipe-card { grid-area: 1 / 1; position: relative; border-radius: 32px; padding: 24px 22px 22px; display: flex; flex-direction: column; min-height: min(52vh, 420px); touch-action: none; cursor: grab; transition: transform 0.45s var(--ease-spring), opacity 0.3s ease; will-change: transform; overflow: hidden; }

  .sw-text { font-family: var(--font-display); font-size: clamp(21px, 5.8vw, 27px); line-height: 1.3; font-weight: 700; letter-spacing: -0.015em; text-wrap: pretty; hyphens: auto; -webkit-hyphens: auto; }

  .stamp { position: absolute !important; top: 64px; z-index: 3; padding: 5px 12px; border: 3px solid currentColor; border-radius: 12px; font-size: 17px; font-weight: 900; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0; pointer-events: none; background: var(--glass-strong); }

  .hl-ref { border-radius: 18px; padding: 12px 14px; background: rgba(var(--c-rgb), 0.12); border: 1px solid rgba(var(--c-rgb), 0.24); margin-bottom: 18px; font-size: 16px; line-height: 1.45; font-weight: 500; }
  .hl-ref small { display: block; font-size: 11.5px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink); margin-bottom: 3px; }
  .result { border-radius: 30px; padding: 26px 20px 22px; text-align: center; }
  .res-ico { width: 74px; height: 74px; margin: 0 auto 12px; border-radius: 50%; display: grid; place-items: center; color: #fff; animation: pop 0.6s var(--ease-spring); }

  .res-sub { font-size: 15px; color: var(--label2); margin-top: 4px; }
  .res-quote { margin: 16px 0 0; padding: 14px 16px; border-radius: 18px; background: var(--glass-soft); border: 1px solid var(--glass-border); font-size: 16px; font-weight: 600; line-height: 1.42; text-align: left; }
  .res-reveal { display: inline-block; margin-top: 12px; padding: 7px 13px; border-radius: 12px; background: rgba(var(--c-rgb), 0.15); color: var(--ink); font-weight: 800; font-size: 15px; }
  .res-explain { margin-top: 14px; font-size: 16px; line-height: 1.55; text-align: left; -webkit-user-select: text; user-select: text; }
  .wissen-card .card-title { margin-bottom: 12px; }
  .summary { border-radius: 30px; padding: 26px 20px 22px; text-align: center; position: relative; overflow: hidden; }
  .summary::before { content: ""; position: absolute; inset: 0; background: radial-gradient(80% 60% at 50% 0%, rgba(var(--pc-rgb, 94, 92, 230), 0.25), transparent 70%); pointer-events: none; }
  .summary > * { position: relative; }
  .summary h2 { font-family: var(--font-display); font-size: 28px; font-weight: 800; letter-spacing: -0.02em; margin-top: 10px; }
  .summary .sum-text { font-size: 16px; line-height: 1.5; color: var(--label2); margin: 6px auto 18px; max-width: 34ch; }
  .sum-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .sum-stat { border-radius: 18px; padding: 12px 6px; background: var(--glass-soft); border: 1px solid var(--glass-border); }
  .sum-stat b { display: block; font-family: var(--font-rounded); font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .sum-stat span { font-size: 12px; color: var(--label2); font-weight: 600; }
  .cp-next { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 600; color: var(--label2); background: var(--fill); padding: 7px 12px; border-radius: 14px; margin-top: 16px; font-variant-numeric: tabular-nums; }
  .cp-next svg { width: 15px; height: 15px; }
  .sum-list { margin-top: 16px; text-align: left; }

  /* ---------- Sheet ---------- */
  #sheetBackdrop { position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, 0.3); opacity: 0; pointer-events: none; transition: opacity 0.45s ease; }
  body.sheet-open #sheetBackdrop { opacity: 1; pointer-events: auto; }
  #sheet { position: fixed; z-index: 51; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 680px; height: calc(100% - env(safe-area-inset-top) - 12px); border-radius: 30px 30px 0 0; background: var(--sheet-bg); -webkit-backdrop-filter: blur(28px) saturate(180%); backdrop-filter: blur(28px) saturate(180%); border: 1px solid var(--glass-border); border-bottom: 0; box-shadow: 0 -12px 40px rgba(0, 0, 0, 0.22), var(--hl); transform: translateY(105%); transition: transform 0.5s var(--ease-sheet); display: flex; flex-direction: column; visibility: hidden; }
  body.sheet-open #sheet { transform: translateY(0); visibility: visible; }
  body.sheet-closing #sheet { visibility: visible; }
  .sheet-head { flex: none; height: 50px; position: relative; display: flex; justify-content: center; touch-action: none; }
  .grabber { margin-top: 7px; width: 38px; height: 5px; border-radius: 3px; background: var(--label3); }
  .sheet-close { position: absolute; right: 14px; top: 12px; width: 32px; height: 32px; border-radius: 50%; background: var(--fill); display: grid; place-items: center; color: var(--label2); }
  .sheet-close svg { width: 13px; height: 13px; }
  .sheet-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 0 16px calc(env(safe-area-inset-bottom) + 32px); }
  .sheet-body .card, .sheet-body .result { background: var(--glass-soft); -webkit-backdrop-filter: none; backdrop-filter: none; }

  /* ---------- Profil-Editor / Willkommen ---------- */
  #onboard { position: fixed; inset: 0; z-index: 65; overflow-y: auto; -webkit-overflow-scrolling: touch; background: var(--bg-grad); background-color: var(--bg); opacity: 0; visibility: hidden; transition: opacity 0.35s ease, visibility 0s linear 0.35s; }
  #onboard.show { opacity: 1; visibility: visible; transition: opacity 0.35s ease, visibility 0s; }
  .ob-inner { max-width: 520px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 12px) 20px calc(env(safe-area-inset-bottom) + 30px); }
  .ob-top { display: flex; justify-content: flex-end; min-height: 38px; }
  .ob-cancel { color: var(--tint); font-size: 17px; height: 38px; padding: 0 6px; }
  .ob-avatar { display: grid; place-items: center; margin: 6px 0 14px; }
  .ob-avatar .avatar { animation: pop 0.5s var(--ease-spring); }
  .ob-inner h1 { text-align: center; font-family: var(--font-display); font-size: 30px; font-weight: 800; letter-spacing: -0.025em; }
  .ob-sub { text-align: center; color: var(--label2); font-size: 15.5px; line-height: 1.45; margin: 6px auto 8px; max-width: 34ch; }
  .ob-note { margin-top: 12px; border-radius: 16px; padding: 12px 14px; font-size: 14px; line-height: 1.4; color: var(--label2); background: rgba(var(--green-rgb), 0.12); border: 1px solid rgba(var(--green-rgb), 0.28); }
  .ob-label { display: block; font-size: 13px; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; color: var(--label2); margin: 20px 6px 8px; }
  .ob-input { width: 100%; height: 54px; border-radius: 16px; padding: 0 16px; font: 500 18px var(--font); color: var(--label); background: var(--glass); -webkit-backdrop-filter: blur(28px) saturate(180%); backdrop-filter: blur(28px) saturate(180%); border: 1px solid var(--glass-border); box-shadow: var(--hl); outline: none; -webkit-user-select: text; user-select: text; -webkit-appearance: none; appearance: none; }
  .ob-input:focus { box-shadow: 0 0 0 3px rgba(var(--tint-rgb), 0.35), var(--hl); }
  .ob-input.shake { animation: shake 0.42s ease; }
  .ob-emojis { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; padding: 12px; border-radius: 22px; }
  .ob-emoji { aspect-ratio: 1; border-radius: 14px; font-size: 26px; display: grid; place-items: center; background: var(--fill); transition: transform 0.15s ease, background 0.2s ease, box-shadow 0.2s ease; }
  .ob-emoji:active { transform: scale(0.9); }
  .ob-emoji.on { background: var(--glass-strong); box-shadow: 0 0 0 2.5px var(--tint); }
  .ob-colors { display: flex; gap: 12px; flex-wrap: wrap; padding: 4px 6px; }
  .ob-color { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(145deg, var(--a1), var(--a2)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.4); transition: transform 0.15s ease, box-shadow 0.2s ease; }
  .ob-color.on { box-shadow: 0 0 0 3px var(--bg), 0 0 0 5.5px var(--tint); }
  .ob-voice-row { display: flex; gap: 10px; align-items: center; }
  .ob-voice-row .seg-ctl { flex: 1; }
  .ob-save { margin-top: 26px; }

  /* ---------- Toast & Alert ---------- */
  #toast { position: fixed; z-index: 80; top: calc(env(safe-area-inset-top) + 8px); left: 50%; max-width: calc(100% - 32px); display: flex; align-items: center; gap: 10px; padding: 10px 18px 10px 12px; border-radius: 24px; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; transform: translate(-50%, -160%) scale(0.9); opacity: 0; transition: transform 0.55s var(--ease-spring), opacity 0.3s ease; pointer-events: none; background: var(--glass-strong); }
  #toast.show { transform: translate(-50%, 0) scale(1); opacity: 1; }
  #toast .t-ico { font-size: 20px; line-height: 1; }
  #alert { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; padding: 24px; background: rgba(0, 0, 0, 0.32); opacity: 0; pointer-events: none; transition: opacity 0.22s ease; }
  #alert.show { opacity: 1; pointer-events: auto; }
  .alert-box { width: 280px; border-radius: 18px; overflow: hidden; background: var(--alert-bg); -webkit-backdrop-filter: blur(28px) saturate(180%); backdrop-filter: blur(28px) saturate(180%); border: 1px solid var(--glass-border); text-align: center; transform: scale(1.12); transition: transform 0.35s var(--ease-spring); box-shadow: var(--shadow-lg); }

  .alert-actions button:active { background: var(--fill); }
  .alert-actions button + button { border-left: 0.5px solid var(--sep); }
  .alert-actions .destructive { color: var(--red); font-weight: 600; }

  .confetti { position: fixed; inset: 0; z-index: 85; pointer-events: none; width: 100%; height: 100%; }
  .haptic-proxy { position: fixed; left: -100px; top: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; overflow: hidden; }

  @media (min-width: 560px) {
    .theme-grid { grid-template-columns: repeat(3, 1fr); }

  }

<noscript><p style="padding:40px 20px;font-family:-apple-system,sans-serif">Lumen benötigt JavaScript.</p></noscript>

<nav id="tabbar" role="tablist" aria-label="Hauptnavigation">

    wissen: [
      ["Der Schalenbau der Erde", "Die Erde ist aufgebaut wie eine Zwiebel: außen die dünne Kruste, darunter der mehrere Tausend Kilometer dicke Mantel, dann der flüssige äußere und der feste innere Kern aus Eisen und Nickel. Im inneren Kern herrschen Temperaturen von über 5.000 °C."],
      ["Wie dick ist die Kruste?", "Unter den Ozeanen ist die Erdkruste nur etwa 5 bis 10 Kilometer dick, unter Kontinenten 30 bis 70 Kilometer. Im Verhältnis zur Erde ist sie dünner als die Schale eines Apfels."],
      ["Die Magnitude von Erdbeben", "Die Stärke eines Erdbebens wird heute meist als Momenten-Magnitude angegeben. Jede Stufe mehr bedeutet etwa 32-mal so viel freigesetzte Energie – ein Beben der Stärke 8 ist also rund tausendmal energiereicher als eines der Stärke 6."],
      ["Wie Tsunamis entstehen", "Hebt oder senkt ein Seebeben plötzlich den Meeresboden, gerät die gesamte Wassersäule in Bewegung. Auf offener See ist die Welle kaum zu bemerken, an flachen Küsten türmt sie sich zu verheerender Höhe auf."],
      ["Hotspots", "Unter Hawaii und Island steigen heiße Mantelströme auf. Weil die Pazifische Platte über den Hawaii-Hotspot hinwegwandert, entstand dort eine ganze Kette von Vulkaninseln."],
      ["Wie die Alpen entstanden", "Die Alpen wurden aufgefaltet, als die Afrikanische Platte gegen Europa drückte. Dieser Prozess dauert bis heute an – Erdbeben in Norditalien und der Schweiz zeugen davon."],
      ["Der Gesteinskreislauf", "Magmatische Gesteine entstehen aus Schmelze, Sedimentgesteine aus abgelagerten Teilchen, metamorphe Gesteine durch Druck und Hitze. Über Jahrmillionen verwandeln sich alle drei immer wieder ineinander."],
      ["Fossilien", "Fossilien entstehen meist, wenn Tier- oder Pflanzenreste schnell von Sediment bedeckt werden. Mineralien ersetzen nach und nach das organische Material und bewahren so die Form."],
      ["Die Eiszeiten", "In den letzten rund 2,6 Millionen Jahren wechselten sich Kalt- und Warmzeiten ab. Während der letzten Kaltzeit reichten skandinavische Gletscher bis nach Norddeutschland und hinterließen dort Findlinge und Seen."],
      ["Permafrost", "Dauerhaft gefrorene Böden bedecken große Teile Sibiriens, Kanadas und Alaskas. Tauen sie auf, werden große Mengen gespeicherter Treibhausgase freigesetzt, und Gebäude und Straßen sacken ab."],
      ["Der natürliche Treibhauseffekt", "Wasserdampf, CO₂ und andere Gase halten einen Teil der Wärmestrahlung in der Atmosphäre zurück. Ohne diesen Effekt läge die mittlere Temperatur bei etwa –18 °C statt bei rund 15 °C."],
      ["Der menschengemachte Klimawandel", "Durch das Verbrennen fossiler Brennstoffe ist der CO₂-Gehalt der Luft stark gestiegen. Die globale Mitteltemperatur liegt inzwischen deutlich über dem vorindustriellen Niveau, mit Folgen wie Hitzewellen, Dürren und steigendem Meeresspiegel."],
      ["Das Ozonloch", "Fluorchlorkohlenwasserstoffe aus Spraydosen und Kühlschränken zerstörten die Ozonschicht über der Antarktis. Das Montreal-Protokoll von 1987 verbot diese Stoffe – seitdem erholt sich die Ozonschicht langsam."],
      ["Warum es Jahreszeiten gibt", "Die Erdachse ist um rund 23,4 Grad geneigt. Deshalb neigt sich im Laufe des Jahres mal die Nord-, mal die Südhalbkugel stärker zur Sonne – nicht die Entfernung zur Sonne verursacht die Jahreszeiten."],
      ["Die größte Wüste der Welt", "Wüsten werden über ihren geringen Niederschlag definiert, nicht über Hitze. Deshalb ist die Antarktis die größte Wüste der Erde, noch vor der Sahara."],
      ["Wetter und Klima", "Wetter beschreibt den Zustand der Atmosphäre an einem Ort über Stunden oder Tage. Klima ist dagegen das durchschnittliche Wetter über mindestens 30 Jahre."],
      ["Der Coriolis-Effekt", "Weil sich die Erde dreht, werden Winde auf der Nordhalbkugel nach rechts und auf der Südhalbkugel nach links abgelenkt. Deshalb drehen sich Tiefdruckgebiete auf beiden Halbkugeln in entgegengesetzte Richtungen."],
      ["Der Jetstream", "In rund zehn Kilometern Höhe wehen starke Westwinde mit oft über 200 km/h. Flugzeuge nutzen sie auf dem Weg von Amerika nach Europa und sind deshalb in dieser Richtung schneller."],
      ["Der Monsun", "Beim Monsun drehen die Winde jahreszeitlich: Im Sommer bringen sie feuchte Meeresluft und heftige Regenfälle nach Süd- und Ostasien. Für die Landwirtschaft von Milliarden Menschen ist er lebenswichtig."],
      ["Die Gezeiten", "Ebbe und Flut entstehen vor allem durch die Anziehungskraft des Mondes, verstärkt oder abgeschwächt von der Sonne. Stehen Sonne, Mond und Erde in einer Linie, gibt es besonders starke Springfluten."],
      ["Boden braucht Zeit", "Die Bildung von nur einem Zentimeter fruchtbarem Boden kann Hunderte Jahre dauern. Erosion durch Wind und Wasser kann diesen Schatz dagegen in wenigen Jahren abtragen."],
      ["Die häufigsten Minerale", "Feldspäte und Quarz sind die häufigsten Minerale der Erdkruste. Quarzsand ist der Rohstoff für Glas und Halbleiter."],
      ["Die Mohs-Härteskala", "Der Mineraloge Friedrich Mohs ordnete Minerale danach, welches welches ritzt: von Talk (1) bis Diamant (10). Ein Fingernagel hat etwa Härte 2,5."],
      ["Gletscher als Wasserspeicher", "Gebirgsgletscher speisen im Sommer mit ihrem Schmelzwasser Flüsse wie Rhein und Rhône. Durch die Erwärmung schrumpfen die Alpengletscher seit Jahrzehnten stark."],
      ["Erdzeitalter", "Die Erdgeschichte wird in Äonen, Ären und Perioden eingeteilt, etwa Kambrium, Jura und Kreide. Die Grenzen markieren oft einschneidende Ereignisse wie Massenaussterben."]

      ["Anglerfisch-Liebe", "Bei manchen Tiefsee-Anglerfischen beißt sich das winzige Männchen am Weibchen fest und verschmilzt mit ihm. Es lebt fortan als Anhängsel, das nur noch Spermien liefert."],
      ["Der Riesenkalmar", "Der Riesenkalmar kann über zehn Meter lang werden und hat die größten Augen im Tierreich – so groß wie ein Teller. Lebend gefilmt wurde er erst 2012."],

    wissen: [
      ["Kleanthes – der Wasserträger", "Zenons Nachfolger Kleanthes war ein ehemaliger Faustkämpfer, der nachts als Wasserträger arbeitete, um tagsüber Philosophie studieren zu können. Berühmt ist sein „Hymnus an Zeus“, ein Loblied auf die göttliche Vernunft."],
      ["Der Logos", "Für die Stoiker durchdringt eine göttliche Vernunft, der Logos, die gesamte Welt. Weil auch der Mensch Vernunft besitzt, kann er diese Ordnung erkennen und im Einklang mit ihr leben."],
      ["Das Pneuma", "Die Stoiker stellten sich ein feines, feurig-luftiges Pneuma vor, das alle Dinge zusammenhält und belebt. Es galt als Träger der göttlichen Vernunft in der Welt."],
      ["Der Weltenbrand", "Nach stoischer Lehre geht der Kosmos in großen Zyklen in einem Weltenbrand auf und entsteht danach neu. Jeder Zyklus soll sich dabei in allen Einzelheiten wiederholen."],
      ["Oikeiosis – das Sich-Zueignen", "Jedes Lebewesen strebt von Geburt an danach, sich selbst zu erhalten. Beim Menschen weitet sich diese Fürsorge nach stoischer Lehre auf Familie, Mitbürger und schließlich die ganze Menschheit aus."],
      ["Bürger der Welt", "Die Stoiker sahen alle Menschen als Teil einer einzigen, vernünftigen Weltgemeinschaft. Dieser Kosmopolitismus beeinflusste später das Naturrecht und Ideen universeller Menschenrechte."],
      ["Nur die Tugend ist gut", "Für die Stoiker ist allein die Tugend wirklich gut und allein das Laster wirklich schlecht. Gesundheit, Reichtum oder Ruhm tragen nichts zur Glückseligkeit bei, wenn der Charakter fehlt."],
      ["Die gleichgültigen Dinge", "Alles außer Tugend und Laster nannten die Stoiker „Adiaphora“, gleichgültige Dinge. Manche davon, wie Gesundheit, sind „vorzuziehen“, andere, wie Krankheit, „zu meiden“ – über Glück entscheiden sie aber nicht."],
      ["Apatheia ist keine Apathie", "Das stoische Ideal der Apatheia meint nicht Gefühllosigkeit, sondern Freiheit von zerstörerischen Leidenschaften. Ein Stoiker kann Freude empfinden, lässt sich aber nicht von Angst oder Gier beherrschen."],
      ["Die vier Leidenschaften", "Die Stoiker unterschieden vier Hauptaffekte: Lust, Begierde, Furcht und Kummer. Sie entstehen aus falschen Urteilen darüber, was gut oder schlecht ist."],
      ["Gute Gefühle", "Den Leidenschaften stellten die Stoiker drei gute Gefühlszustände gegenüber: vernünftige Freude, vernünftiges Wollen und vernünftige Vorsicht. Der Weise empfindet sie, ohne die Kontrolle zu verlieren."],
      ["Erste Regungen", "Selbst ein Weiser erschrickt bei einem Donnerschlag oder errötet. Solche unwillkürlichen ersten Regungen sind nach stoischer Lehre noch keine Leidenschaft – entscheidend ist, ob man ihnen zustimmt."],
      ["Die Prohairesis", "Epiktet nannte unsere Fähigkeit, Urteile zu fällen und Entscheidungen zu treffen, Prohairesis. Sie ist das Einzige, was uns wirklich gehört und was uns niemand nehmen kann."],
      ["Der Blick von oben", "Mark Aurel stellte sich vor, auf die Erde von hoch oben herabzuschauen: winzige Städte, flüchtige Streitigkeiten, das große Ganze. Diese Übung relativiert Ärger und Sorgen."],
      ["Memento mori", "Stoiker erinnerten sich regelmäßig an die eigene Sterblichkeit. Das sollte nicht bedrücken, sondern dazu anspornen, jeden Tag bewusst und sinnvoll zu nutzen."],
      ["Das Schicksal lieben", "Die Stoiker lehrten, das Unabänderliche nicht nur hinzunehmen, sondern gutzuheißen. Friedrich Nietzsche prägte dafür viel später die Formel „amor fati“ – Liebe zum Schicksal."],
      ["Musonius Rufus", "Der römische Stoiker Musonius Rufus war Lehrer Epiktets und wurde „römischer Sokrates“ genannt. Er vertrat die ungewöhnliche Ansicht, dass auch Frauen Philosophie studieren sollten."],
      ["Die mittlere Stoa", "Panaitios und Poseidonios brachten die Stoa im 2. und 1. Jahrhundert vor Christus nach Rom und machten sie für die römische Oberschicht attraktiv. Über Cicero wirkte ihr Denken weit in die lateinische Welt."],
      ["Stoa und Epikur", "Epikur lehrte fast zur selben Zeit in Athen, in seinem „Garten“. Während die Stoiker Tugend und Pflicht betonten, suchten die Epikureer das Glück in maßvoller Lust und Seelenruhe."],
      ["Die Kyniker als Vorbilder", "Zenon lernte zunächst beim Kyniker Krates. Die Kyniker um Diogenes lebten radikal bedürfnislos – die Stoiker übernahmen davon die Genügsamkeit, aber nicht die provokante Lebensweise."],
      ["Das stoische Leben als Übung", "Für die Stoiker war Philosophie keine Theorie, sondern tägliche Praxis. Wie ein Athlet sollte man die Seele durch Übung stärken."],
      ["Neostoizismus", "Im 16. Jahrhundert belebte der Gelehrte Justus Lipsius die Stoa mit seinem Werk „De Constantia“ neu. In Zeiten religiöser Kriege bot sie Halt durch innere Standhaftigkeit."],
      ["Stoa und Psychotherapie", "Die kognitive Verhaltenstherapie greift den stoischen Gedanken auf, dass unsere Bewertungen Gefühle beeinflussen. Albert Ellis und Aaron Beck beriefen sich ausdrücklich auf Epiktet."],
      ["Das Gelassenheitsgebet", "Das bekannte Gebet um die Gelassenheit, Dinge hinzunehmen, die man nicht ändern kann, und den Mut, Dinge zu ändern, die man ändern kann, erinnert stark an Epiktet. Es stammt vom Theologen Reinhold Niebuhr aus dem 20. Jahrhundert."],
      ["Die abendliche Rückschau", "Seneca prüfte sich jeden Abend: Welche Schwäche habe ich heute überwunden, wo habe ich gefehlt? Diese Selbstprüfung sollte ohne Selbstverurteilung zu stetiger Besserung führen."]

  const FEMALE_RX = /(anna|helena|petra|katja|hedda|marlene|vicki|sandy|shelley|grandma|amala|seraphina|louisa|elke|klara|tanja|ingrid|google deutsch|\bfemale\b|weiblich)/i;
  const MALE_RX = /(markus|yannick|martin|viktor|stefan|conrad|eddy|\bflo\b|reed|rocko|grandpa|killian|florian|ralf|jonas|\bhans\b|\bmale\b|männlich)/i;
  const CLASSIC_RX = /(anna|helena|petra|katja|markus|yannick|martin|viktor|stefan|conrad|google deutsch)/i;
  const TTS = {
    ok: "speechSynthesis" in window && "SpeechSynthesisUtterance" in window,
    id: null, token: 0, voice: null, exact: false,
    init() {
      if (!this.ok) return;
      const re = () => { this.pick(); if (ui.tab === "profile" && state) renderVoiceName(); };
      re();
      try { speechSynthesis.addEventListener("voiceschanged", re); } catch (e) { speechSynthesis.onvoiceschanged = re; }
    },
    pick() {
      if (!this.ok) return;
      const r = pickVoice(state ? state.settings.voice : "female");
      this.voice = r.voice; this.exact = r.exact;
    },
    speak(id, text) {
      if (!this.ok) { toast("Vorlesen wird hier nicht unterstützt", "🔇"); return; }
      this.stop();
      const my = ++this.token;
      this.id = id;
      const gender = state ? state.settings.voice : "female";
      const parts = String(text).match(/[^.!?…]+[.!?…]+["“”«»)]*\s*|[^.!?…]+$/g) || [text];
      const chunks = [];
      let buf = "";
      parts.forEach(p => { buf += p; if (buf.length > 150) { chunks.push(buf.trim()); buf = ""; } });
      if (buf.trim()) chunks.push(buf.trim());
      try {
        chunks.forEach((c, i) => {
          const u = new SpeechSynthesisUtterance(c);
          u.lang = "de-DE";
          if (this.voice) u.voice = this.voice;
          u.rate = state ? state.settings.rate : 1;
          u.pitch = this.exact ? 1 : (gender === "male" ? 0.72 : 1.1);
          if (i === chunks.length - 1) u.onend = () => { if (my === this.token) this.finish(); };
          u.onerror = ev => { if (my === this.token && ev.error !== "interrupted" && ev.error !== "canceled") this.finish(); };
          speechSynthesis.speak(u);
        });
        if (speechSynthesis.paused) speechSynthesis.resume();
      } catch (e) { this.finish(); return; }
      this.sync();
    },
    toggle(id, text) { if (this.id === id) this.stop(); else this.speak(id, text); },
    stop() {
      if (!this.ok) return;
      this.token++;
      try { if (speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel(); } catch (e) { /* ignorieren */ }
      this.id = null; this.sync();
    },
    finish() { this.id = null; this.sync(); },
    sync() {
      $$(".play").forEach(b => {
        const on = b.dataset.id === this.id;
        b.classList.toggle("playing", on);
        const l = b.querySelector(".play-label");
        if (l) l.textContent = on ? "Stopp" : "Anhören";
        b.setAttribute("aria-label", on ? "Vorlesen stoppen" : "Vorlesen");
      });
    }
  };
  function pickVoice(gender) {
    let vs = [];
    try { vs = speechSynthesis.getVoices() || []; } catch (e) { vs = []; }
    const de = vs.filter(v => /^de([-_]|$)/i.test(v.lang));
    if (!de.length) return { voice: null, exact: false };
    const rx = gender === "male" ? MALE_RX : FEMALE_RX;
    const other = gender === "male" ? FEMALE_RX : MALE_RX;
    const score = v => (/de[-_]DE/i.test(v.lang) ? 4 : 0) + (/(premium|enhanced|erweitert|natural|neural|online)/i.test(v.name) ? 3 : 0) + (CLASSIC_RX.test(v.name) ? 2 : 0) + (/(grandma|grandpa)/i.test(v.name) ? -3 : 0) + (v.localService ? 1 : 0);
    const best = list => list.slice().sort((a, b) => score(b) - score(a))[0];
    const match = de.filter(v => rx.test(v.name) && !other.test(v.name));
    if (match.length) return { voice: best(match), exact: true };

  function poolFor(mode, cats) {
    const m = MODES[mode];
    const out = [];
    cats.forEach(k => { const b = BY_CAT[k]; m.types.forEach(t => b[t].forEach(it => out.push(it))); });
    if (mode === "review") return out.filter(it => state.correct[it.id] === 0);
    if (mode === "saved") return out.filter(it => state.saved[it.id]);
    return out;
  }
  function buildQueue(mode, cats, n) {
    const pool = poolFor(mode, cats);
    const fresh = it => !state.seen[it.id];
    const ordered = list => shuffle(list.filter(fresh)).concat(shuffle(list.filter(x => !fresh(x))));
    if (mode === "mix") {
      const groups = {};

  function fold(s) {
    let o = "";
    for (let i = 0; i < s.length; i++) {
      const ch = s[i];
      const f = ch.normalize ? ch.normalize("NFD")[0] : ch;
      const low = f.toLowerCase();
      o += low.length === 1 ? low : f;
    }
    return o;
  }
  const termsOf = q => fold(q.trim()).split(/\s+/).filter(Boolean);
  function fullText(it) {
    switch (it.type) {
      case "card": { const c = it.card; return [c.title, c.story, c.funFact, c.quiz.question, c.quiz.options.join(" "), c.quiz.explanation].join(" \n "); }
      case "wissen": return it.t + " \n " + it.x;
      case "fact": return it.f;
      case "quiz": return [it.q, it.o.join(" "), it.x].join(" \n ");
      case "tf": return it.s + " \n " + it.x;
      case "hl": return [it.ref, it.p, it.x].join(" \n ");
      default: return "";
    }
  }
  function titleOf(it) {
    switch (it.type) {
      case "card": return it.card.title;
      case "wissen": return it.t;
      case "fact": { const m = it.f.match(/^.{20,110}?[.!?](\s|$)/); return m ? m[0].trim() : (it.f.length > 110 ? it.f.slice(0, 110).replace(/\s+\S*$/, "") + " …" : it.f); }
      case "quiz": return it.q;
      case "tf": return it.s;
      case "hl": return it.p;
      default: return "";
    }
  }
  function baseSnippet(it) {
    switch (it.type) {
      case "card": return it.card.story;
      case "wissen": return it.x;
      case "fact": { const t = titleOf(it).replace(/ …$/, ""); return it.f.length > t.length + 2 ? it.f.slice(t.length).trim() : ""; }
      case "quiz": return "Antwort: " + it.o[it.a] + " – " + it.x;
      case "tf": return (it.a ? "✓ Richtig" : "✗ Falsch") + " – " + it.x;
      case "hl": return "Antwort: " + it.l[it.a] + " – " + it.x;
      default: return "";
    }
  }
  function highlight(text, terms) {
    if (!terms.length) return esc(text);
    const f = fold(text);
    const ranges = [];
    terms.forEach(t => { let i = f.indexOf(t); while (i !== -1 && t.length) { ranges.push([i, i + t.length]); i = f.indexOf(t, i + t.length); } });
    if (!ranges.length) return esc(text);
    ranges.sort((a, b) => a[0] - b[0]);
    const merged = [];
    ranges.forEach(r => { const last = merged[merged.length - 1]; if (last && r[0] <= last[1]) last[1] = Math.max(last[1], r[1]); else merged.push(r.slice()); });
    let out = "", pos = 0;
    merged.forEach(r => { out += esc(text.slice(pos, r[0])) + "<mark>" + esc(text.slice(r[0], r[1])) + "</mark>"; pos = r[1]; });
    return out + esc(text.slice(pos));
  }
  function snippet(it, terms) {
    const base = baseSnippet(it);
    const src = terms.length ? fullText(it) : base;
    if (terms.length) {
      const f = fold(src);
      let idx = -1;
      terms.forEach(t => { const i = f.indexOf(t); if (i !== -1 && (idx === -1 || i < idx)) idx = i; });
      if (idx !== -1) {
        let start = Math.max(0, idx - 48);
        if (start > 0) { const sp = src.indexOf(" ", start); if (sp !== -1 && sp < idx) start = sp + 1; }
        const piece = src.slice(start, start + 170).replace(/\s*\n\s*/g, " · ");
        return (start > 0 ? "… " : "") + highlight(piece, terms) + (start + 170 < src.length ? " …" : "");
      }
    }
    return esc(base.length > 160 ? base.slice(0, 160).replace(/\s+\S*$/, "") + " …" : base);
  }

    $("#obEmojis").innerHTML = AVATARS.map(a => '<button class="ob-emoji' + (a === e.avatar ? " on" : "") + '" data-action="ob-avatar" data-v="' + a + '" aria-label="Avatar ' + a + '">' + a + "</button>").join("");

    $("#obVoice").innerHTML = '<button class="' + (e.voice === "female" ? "on" : "") + '" data-action="ob-voice" data-v="female">👩 Weiblich</button><button class="' + (e.voice === "male" ? "on" : "") + '" data-action="ob-voice" data-v="male">👨 Männlich</button>';
  }
  function saveEditor() {
    const e = ui.edit;
    const name = $("#obName").value.trim();
    if (!name) {
      const inp = $("#obName");
      inp.classList.remove("shake"); void inp.offsetWidth; inp.classList.add("shake");
      haptic("error"); toast("Bitte gib einen Namen ein", "✏️"); inp.focus(); return;
    }
    $("#obName").blur();
    if (e.mode === "edit") {
      const p = currentProfile();
      p.name = name; p.avatar = e.avatar; p.color = e.color;
      state.settings.voice = e.voice;
      TTS.pick();
      save();
      closeEditor();
      renderAll();
      toast("Profil gespeichert", e.avatar);
    } else {
      closeEditor();
      createProfile({ name: name, avatar: e.avatar, color: e.color, voice: e.voice });
      haptic("success");
      toast("Willkommen, " + name + "!", e.avatar);
    }
  }
  function closeEditor() { $("#onboard").classList.remove("show"); ui.edit = null; TTS.stop(); }

  /* =====================================================================
     NAVIGATION, SHEET, TOAST, ALERT, KONFETTI
     ===================================================================== */
  const TABS = ["today", "categories", "archive", "profile"];
  const TITLES = { today: "Start", categories: "Kategorien", archive: "Archiv", profile: "Profil" };
  function renderTab(name) {
    if (!state) return;
    if (name === "today") renderHome();
    else if (name === "categories") { renderCategories(); if (ui.themeKey) renderTheme(); }
    else if (name === "archive") renderArchive();
    else if (name === "profile") renderProfile();
  }
  function renderAll() { renderTab(ui.tab); updateBadge(); }
  function activeView() { return ui.tab === "categories" && ui.themeKey ? $("#view-theme") : $("#view-" + ui.tab); }
  function switchTab(name, keepTheme) {
    if (TABS.indexOf(name) === -1) return;
    if (name === ui.tab) {
      if (name === "categories" && ui.themeKey && !keepTheme) { themeBack(); return; }
      activeView().scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" });
      return;
    }
    TTS.stop();
    const prev = ui.tab;
    ui.tab = name;
    if (prev === "categories" && ui.themeKey) { hideThemePage(true); $("#view-categories").classList.remove("active"); }
    if (!keepTheme && name === "categories") ui.themeKey = null;
    renderTab(name);
    TABS.forEach(t => { const v = $("#view-" + t); v.classList.toggle("active", t === name && !(t === "categories" && ui.themeKey)); v.classList.remove("behind"); });
    if (name === "categories" && ui.themeKey) { $("#view-categories").classList.add("behind"); $("#view-theme").classList.add("active"); }
    $$(".tab").forEach(t => { const on = t.dataset.tab === name; t.classList.toggle("active", on); t.setAttribute("aria-selected", on ? "true" : "false"); });
    $("#tabInd").style.setProperty("--i", TABS.indexOf(name));
    $("#navTitle").textContent = TITLES[name];
    if (name === "categories") setAccent("#34C759");
    else if (name === "archive") setAccent("#0A84FF");
    else if (name === "profile") setAccent("#FF9500");
    else setAccent("#5E5CE6");
    updateNavbar();
    haptic("light");
  }
  function setAccent(hex) { $("#accentBlob").style.color = hex; }
  function updateNavbar() {
    const v = activeView();
    const y = v ? v.scrollTop : 0;
    const nb = $("#navbar");
    nb.classList.toggle("scrolled", y > 4);
    nb.classList.toggle("titled", y > 52);
  }

  function openSheet() {
    document.body.classList.remove("sheet-closing");
    document.body.classList.add("sheet-open");
    $("#sheet").style.transform = "";
    $("#sheetBody").scrollTop = 0;
    haptic("light");
  }
  let closeTimer = null;
  function closeSheet() {
    if (!document.body.classList.contains("sheet-open")) return;
    $("#sheet").style.transform = "";
    document.body.classList.add("sheet-closing");
    document.body.classList.remove("sheet-open");
    TTS.stop();
    ui.sheet = null;
    clearTimeout(closeTimer);
    closeTimer = setTimeout(() => document.body.classList.remove("sheet-closing"), 520);
    if (ui.tab === "archive") renderArchive();
  }
  (function setupSheetDrag() {
    const sheet = $("#sheet"), body = $("#sheetBody");
    let startY = 0, dy = 0, dragging = false, t0 = 0, fromHead = false;
    sheet.addEventListener("touchstart", e => {
      if (!document.body.classList.contains("sheet-open")) return;
      fromHead = !!e.target.closest(".sheet-head");
      if (!fromHead && body.scrollTop > 0) return;
      startY = e.touches[0].clientY; dy = 0; dragging = true; t0 = Date.now();
    }, { passive: true });
    sheet.addEventListener("touchmove", e => {
      if (!dragging) return;
      dy = e.touches[0].clientY - startY;
      if (dy <= 0) { sheet.style.transform = ""; if (!fromHead) { dragging = false; sheet.style.transition = ""; } return; }
      if (e.cancelable) e.preventDefault();
      sheet.style.transition = "none";
      sheet.style.transform = "translateY(" + dy + "px)";
    }, { passive: false });
    const end = () => {
      if (!dragging) return;
      dragging = false; sheet.style.transition = "";
      const v = dy / Math.max(1, Date.now() - t0);
      if (dy > 140 || (dy > 40 && v > 0.55)) closeSheet(); else sheet.style.transform = "";
    };
    sheet.addEventListener("touchend", end);
    sheet.addEventListener("touchcancel", end);
  })();

  let toastTimer = null;
  function toast(text, icon) {
    const el = $("#toast");
    $("#toastIco").textContent = icon || "✨";
    $("#toastText").textContent = text;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 2400);
  }
  function showAlert(title, msg, actions) {
    $("#alertTitle").textContent = title;
    $("#alertMsg").textContent = msg;
    const box = $("#alertActions");
    box.innerHTML = "";
    actions.forEach(a => {
      const b = document.createElement("button");
      b.textContent = a.label;
      if (a.style) b.className = a.style;
      b.addEventListener("click", () => { $("#alert").classList.remove("show"); if (a.onTap) a.onTap(); });
      box.appendChild(b);
    });
    $("#alert").classList.add("show");
  }
  function confetti() {
    if (reduceMotion) return;
    const cv = document.createElement("canvas");
    cv.className = "confetti";
    document.body.appendChild(cv);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const W = window.innerWidth, H = window.innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    const g = cv.getContext("2d");
    g.scale(dpr, dpr);
    const colors = CATEGORIES.map(c => c.color).concat(["#FFD60A", "#FF9F0A", "#30D158", "#FF375F"]);
    const parts = [];
    for (let i = 0; i < 150; i++) {
      const ang = -Math.PI / 2 + (Math.random() - 0.5) * 1.9;
      const sp = 7 + Math.random() * 11;
      parts.push({ x: W / 2 + (Math.random() - 0.5) * 40, y: H * 0.34, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, w: 6 + Math.random() * 6, h: 9 + Math.random() * 8, r: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.35, c: colors[Math.floor(Math.random() * colors.length)], round: Math.random() < 0.3 });
    }
    const t0 = performance.now();
    function frame(t) {
      const el = (t - t0) / 1000;
      g.clearRect(0, 0, W, H);
      const alpha = Math.max(0, 1 - Math.max(0, el - 1.9) / 1.1);
      parts.forEach(p => {
        p.vy += 0.32; p.vx *= 0.985; p.vy *= 0.985; p.x += p.vx; p.y += p.vy; p.r += p.vr;
        g.save(); g.globalAlpha = alpha; g.translate(p.x, p.y); g.rotate(p.r); g.fillStyle = p.c;
        if (p.round) { g.beginPath(); g.arc(0, 0, p.w / 2, 0, Math.PI * 2); g.fill(); }
        else g.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.r * 1.7)) + 1.5);
        g.restore();
      });
      if (el < 3) requestAnimationFrame(frame); else cv.remove();
    }
    requestAnimationFrame(frame);
  }

  /* =====================================================================
     EVENTS
     ===================================================================== */
  document.addEventListener("click", e => {
    const el = e.target.closest("[data-action]");
    if (!el) return;
    const a = el.dataset.action;
    switch (a) {
      case "tab": switchTab(el.dataset.tab); break;
      case "goto": closeSheet(); switchTab(el.dataset.tab); break;
      case "deck": closeSheet(); startDeck(el.dataset.id); break;
      case "bonus": drawBonus(); break;
      case "start": closeSheet(); startSession(el.dataset.mode, el.dataset.key); break;
      case "learn-card": startSession("karten", CARD_BY_ID[el.dataset.id] ? catOfCard(CARD_BY_ID[el.dataset.id]).key : "mix", [el.dataset.id]); break;
      case "open-theme": closeSheet(); openThemePage(el.dataset.key); break;
      case "theme-back": themeBack(); break;
      case "add-mix": addToMix(el.dataset.key, el); break;
      case "blitz-answer": onBlitzAnswer(el); break;
      case "blitz-next": ui.blitz = null; { const tmp = document.createElement("div"); tmp.innerHTML = blitzHTML(); $("#blitzCard").replaceWith(tmp.firstChild); $("#blitzCard").animate && !reduceMotion && $("#blitzCard").animate([{ opacity: 0, transform: "translateY(8px)" }, { opacity: 1, transform: "none" }], { duration: 350, easing: "ease-out" }); } break;
      case "speak": { const it = ITEM_BY_ID[el.dataset.id]; if (it) TTS.toggle(it.id, speakTextOf(it)); } break;
      case "pl-close": closePlayer(); break;
      case "pl-next": if (!el.disabled) plNext(); break;
      case "pl-answer": onPlayerAnswer(el); break;
      case "card-answer": onCardAnswer(el); break;
      case "pl-swipe": plSwipeButton(Number(el.dataset.v)); break;
      case "pl-again": playAgain(); break;
      case "pl-save": { const it = curItem(); if (it) toggleSave(it.id); } break;
      case "toggle-save": toggleSave(el.dataset.id); break;
      case "read": openReader(el.dataset.id); break;
      case "close-sheet": closeSheet(); break;
      case "chip": ui.arcFilter = el.dataset.key; ui.arcLimit = 60; haptic("light"); renderArchive(); break;
      case "arc-type": ui.arcType = el.dataset.key; ui.arcLimit = 60; haptic("light"); renderArchive(); break;
      case "arc-more": ui.arcLimit += 60; renderArchiveList(); break;
      case "clear-search": ui.arcQuery = ""; $("#searchInput").value = ""; renderArchiveList(); $("#searchInput").focus(); break;
      case "rate":
        state.settings.rate = Number(el.dataset.rate); save();
        $$('[data-action="rate"]').forEach(b => b.classList.toggle("on", b === el));
        haptic("light"); break;
      case "voice":
        state.settings.voice = el.dataset.v; save(); TTS.pick();
        $$('[data-action="voice"]').forEach(b => b.classList.toggle("on", b === el));
        renderVoiceName(); haptic("light"); voiceSample(); break;
      case "voice-test": voiceSample(); break;
      case "dismiss-install": state.settings.hideInstall = true; save(); renderProfile(); break;
      case "switch-profile": if (el.dataset.id !== root.current) switchProfile(el.dataset.id); break;
      case "new-profile": openProfileEditor("new"); break;
      case "edit-profile": openProfileEditor("edit"); break;
      case "ob-avatar": ui.edit.avatar = el.dataset.v; ui.edit.name = $("#obName").value; renderEditor(); haptic("light"); break;
      case "ob-color": ui.edit.color = Number(el.dataset.v); renderEditor(); haptic("light"); break;
      case "ob-voice": ui.edit.voice = el.dataset.v; renderEditor(); haptic("light"); break;
      case "ob-voice-test": {
        const g = ui.edit ? ui.edit.voice : "female";
        const r = pickVoice(g); const old = { v: TTS.voice, e: TTS.exact, s: state ? state.settings.voice : null };
        TTS.voice = r.voice; TTS.exact = r.exact;
        if (state) state.settings.voice = g;
        TTS.speak("voice-test", "Hallo" + ($("#obName").value.trim() ? " " + $("#obName").value.trim() : "") + "! So klinge ich, wenn ich dir in Lumen etwas vorlese.");
        if (state) state.settings.voice = old.s;
        TTS.voice = old.v; TTS.exact = old.e;
      } break;
      case "ob-save": saveEditor(); break;
      case "ob-cancel": closeEditor(); break;
      case "reset":
        showAlert("Fortschritt zurücksetzen?", "Serie, Archiv, Statistiken und Merkliste dieses Profils werden gelöscht. Das kann nicht rückgängig gemacht werden.", [
          { label: "Abbrechen", style: "cancel" },
          { label: "Zurücksetzen", style: "destructive", onTap: () => {
            const settings = state.settings;
            state = defaultState(settings.voice); state.settings = settings;
            root.data[root.current] = state;
            ui.focusId = null; ui.blitz = null; ui.arcFilter = "all"; ui.arcType = "all"; ui.arcQuery = ""; $("#searchInput").value = "";
            ensureDeck(); save(); renderProfile(); updateBadge(); haptic("error");
            toast("Alles zurückgesetzt – auf ein Neues!", "🌱");
          } }
        ]);
        break;
      case "delete-profile": {
        const p = currentProfile();
        showAlert("„" + p.name + "“ löschen?", "Das Profil und sein gesamter Fortschritt werden von diesem Gerät entfernt.", [
          { label: "Abbrechen", style: "cancel" },
          { label: "Löschen", style: "destructive", onTap: () => {
            root.profiles = root.profiles.filter(x => x.id !== p.id);
            delete root.data[p.id];
            haptic("error");
            if (root.profiles.length) { switchProfile(root.profiles[0].id); }
            else { root.current = null; state = null; save(); openProfileEditor("new"); }
            save();
          } }
        ]);
      } break;
    }
  });
  document.addEventListener("change", e => {
    const t = e.target;
    if (t.matches('[data-toggle="cat"]')) toggleCategory(t.dataset.key, t.checked, t);
    else if (t.matches('[data-toggle="haptics"]')) { state.settings.haptics = t.checked; save(); if (t.checked) haptic("success"); }
  });
  $("#searchInput").addEventListener("input", e => { ui.arcQuery = e.target.value; ui.arcLimit = 60; renderArchiveList(); });
  $("#searchInput").addEventListener("keydown", e => { if (e.key === "Enter") e.target.blur(); });
  $("#obName").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); saveEditor(); } });
  $$(".view").forEach(v => v.addEventListener("scroll", () => { if (v === activeView()) updateNavbar(); }, { passive: true }));
  document.addEventListener("keydown", e => {
    if (e.target && e.target.tagName === "INPUT") return;
    if ($("#alert").classList.contains("show")) { if (e.key === "Escape") $("#alert").classList.remove("show"); return; }
    if (document.body.classList.contains("player-open")) {
      const it = curItem();
      if (e.key === "Escape") closePlayer();
      else if ((e.key === "ArrowRight" || e.key === "ArrowLeft") && it && ["tf", "hl", "fact"].indexOf(it.type) !== -1 && ui.session.st.decided === null && !ui.session.summary) plSwipeButton(e.key === "ArrowRight" ? 1 : 0);
      else if (e.key === "Enter") { const n = $('#plActions [data-action="pl-next"]'); if (n && !n.disabled) plNext(); }
      return;
    }
    if (e.key === "Escape") { if (document.body.classList.contains("sheet-open")) closeSheet(); else if (ui.themeKey) themeBack(); }
  });

  function checkDay() {
    if (state && state.daily && state.daily.date !== todayKey()) {
      normalizeStreak(); ensureDeck(); ui.blitz = null; save();
      if (!ui.session) renderTab(ui.tab);
      updateBadge();
      toast("Neuer Tag, neuer Stapel!", "☀️");
    } else {
      const cd = $("#countdown span");
      if (cd) cd.textContent = countdownText();
    }
  }
  setInterval(checkDay, 30000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) checkDay(); else TTS.stop(); });
  window.addEventListener("pagehide", () => TTS.stop());

  /* =====================================================================
     APP-ICON (zur Laufzeit erzeugt)
     ===================================================================== */
  function makeIcon() {
    try {
      const S = 180;
      const c = document.createElement("canvas");
      c.width = c.height = S;
      const g = c.getContext("2d");
      const bg = g.createLinearGradient(0, 0, S, S);
      bg.addColorStop(0, "#1D3F8F"); bg.addColorStop(0.5, "#0C1A45"); bg.addColorStop(1, "#020308");
      g.fillStyle = bg; g.fillRect(0, 0, S, S);
      const glow = g.createRadialGradient(S * 0.3, S * 0.2, 4, S * 0.3, S * 0.2, S * 0.8);
      glow.addColorStop(0, "rgba(140,185,255,0.32)"); glow.addColorStop(1, "rgba(140,185,255,0)");
      g.fillStyle = glow; g.fillRect(0, 0, S, S);
      g.fillStyle = "rgba(150,190,255,0.14)";
      g.beginPath(); g.arc(S / 2, S / 2, 58, 0, Math.PI * 2); g.fill();
      const star = (cx, cy, r, k) => {
        g.beginPath(); g.moveTo(cx, cy - r);
        g.quadraticCurveTo(cx + r * k, cy - r * k, cx + r, cy);
        g.quadraticCurveTo(cx + r * k, cy + r * k, cx, cy + r);
        g.quadraticCurveTo(cx - r * k, cy + r * k, cx - r, cy);
        g.quadraticCurveTo(cx - r * k, cy - r * k, cx, cy - r);
        g.closePath(); g.fill();
      };
      g.fillStyle = "#FFFFFF"; g.shadowColor = "rgba(130,180,255,0.95)"; g.shadowBlur = 18;
      star(S / 2, S / 2, 46, 0.16);
      g.shadowBlur = 8; g.fillStyle = "rgba(255,255,255,0.9)";
      star(S * 0.73, S * 0.28, 14, 0.18);
      const url = c.toDataURL("image/png");
      [["apple-touch-icon", null], ["icon", "image/png"]].forEach(p => {
        const l = document.createElement("link"); l.rel = p[0]; if (p[1]) l.type = p[1]; l.href = url; document.head.appendChild(l);
      });
    } catch (e) { /* Icon optional */ }
  }

  /* =====================================================================
     START
     ===================================================================== */
  setupHapticProxy();
  makeIcon();
  TTS.init();
  if (root.current && root.data[root.current] && currentProfile()) switchProfile(root.current, true);
  else if (root.profiles.length) switchProfile(root.profiles[0].id, true);
  else openProfileEditor("new");
  updateNavbar();
  window.__lumen = { ITEMS: ITEMS, BY_CAT: BY_CAT, CATEGORIES: CATEGORIES };
})();
</script>
