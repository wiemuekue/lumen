<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lumen">
<meta name="application-name" content="Lumen">
<meta name="format-detection" content="telephone=no">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#EEF0F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#07080F" media="(prefers-color-scheme: dark)">
<title>Lumen</title>
<style>
  :root {
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --font-rounded: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;

    --bg: #EEF0F8;
    --bg-grad: linear-gradient(160deg, #F5F2FC 0%, #EAF0FA 48%, #F7EFE8 100%);
    --blob1: rgba(124, 108, 255, 0.36);
    --blob2: rgba(255, 168, 88, 0.30);
    --blob3: rgba(52, 199, 170, 0.24);
    --accent-op: 0.30;

    --glass: rgba(255, 255, 255, 0.55);
    --glass-strong: rgba(255, 255, 255, 0.78);
    --glass-soft: rgba(255, 255, 255, 0.42);
    --glass-border: rgba(255, 255, 255, 0.25);
    --hl: inset 0 1px 0 rgba(255, 255, 255, 0.7), inset 0 0 0 0.5px rgba(255, 255, 255, 0.35);
    --shadow: 0 14px 40px rgba(40, 44, 90, 0.10), 0 2px 8px rgba(40, 44, 90, 0.05);
    --shadow-lg: 0 24px 60px rgba(40, 44, 90, 0.16), 0 4px 14px rgba(40, 44, 90, 0.06);

    --bar: rgba(244, 245, 251, 0.72);
    --tab-bg: rgba(255, 255, 255, 0.58);
    --tab-ind: rgba(118, 118, 128, 0.14);
    --sheet-bg: rgba(246, 247, 252, 0.88);
    --alert-bg: rgba(242, 242, 247, 0.86);

    --label: #0B0B12;
    --label2: rgba(60, 60, 67, 0.68);
    --label3: rgba(60, 60, 67, 0.36);
    --sep: rgba(60, 60, 67, 0.14);
    --fill: rgba(118, 118, 128, 0.12);
    --fill2: rgba(118, 118, 128, 0.20);
    --switch-off: rgba(120, 120, 128, 0.20);

    --tint: #5E5CE6;
    --tint-rgb: 94, 92, 230;
    --green: #34C759;
    --green-rgb: 52, 199, 89;
    --red: #FF3B30;
    --red-rgb: 255, 59, 48;
    --orange: #FF9500;
    --blue: #007AFF;

    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    --ease-sheet: cubic-bezier(0.32, 0.72, 0, 1);
    --ease-spring: cubic-bezier(0.34, 1.4, 0.64, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #07080F;
      --bg-grad: linear-gradient(160deg, #0B0C18 0%, #07080F 52%, #100B14 100%);
      --blob1: rgba(94, 92, 230, 0.34);
      --blob2: rgba(255, 120, 60, 0.18);
      --blob3: rgba(20, 170, 160, 0.20);
      --accent-op: 0.32;

      --glass: rgba(30, 32, 46, 0.52);
      --glass-strong: rgba(40, 42, 58, 0.84);
      --glass-soft: rgba(255, 255, 255, 0.06);
      --glass-border: rgba(255, 255, 255, 0.25);
      --hl: inset 0 1px 0 rgba(255, 255, 255, 0.16), inset 0 0 0 0.5px rgba(255, 255, 255, 0.06);
      --shadow: 0 18px 48px rgba(0, 0, 0, 0.45), 0 2px 8px rgba(0, 0, 0, 0.3);
      --shadow-lg: 0 28px 70px rgba(0, 0, 0, 0.55), 0 4px 14px rgba(0, 0, 0, 0.35);

      --bar: rgba(12, 13, 22, 0.64);
      --tab-bg: rgba(30, 32, 46, 0.64);
      --tab-ind: rgba(255, 255, 255, 0.12);
      --sheet-bg: rgba(22, 23, 34, 0.9);
      --alert-bg: rgba(40, 40, 52, 0.88);

      --label: #FFFFFF;
      --label2: rgba(235, 235, 245, 0.64);
      --label3: rgba(235, 235, 245, 0.32);
      --sep: rgba(255, 255, 255, 0.10);
      --fill: rgba(118, 118, 128, 0.24);
      --fill2: rgba(118, 118, 128, 0.36);
      --switch-off: rgba(120, 120, 128, 0.34);

      --tint: #7D7AFF;
      --tint-rgb: 125, 122, 255;
      --green: #30D158;
      --green-rgb: 48, 209, 88;
      --red: #FF453A;
      --red-rgb: 255, 69, 58;
      --orange: #FF9F0A;
      --blue: #0A84FF;
    }
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; background: var(--bg); }
  body {
    font-family: var(--font); color: var(--label);
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    touch-action: manipulation;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; -webkit-appearance: none; appearance: none; touch-action: manipulation; text-align: inherit; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--tint); outline-offset: 2px; }
  button:disabled { cursor: default; }
  svg { display: block; }

  .glass { background: var(--glass); -webkit-backdrop-filter: blur(28px) saturate(180%); backdrop-filter: blur(28px) saturate(180%); border: 1px solid var(--glass-border); box-shadow: var(--shadow), var(--hl); }
  .tinted { --ink: var(--c-lo); }
  @media (prefers-color-scheme: dark) { .tinted { --ink: var(--c-hi); } }

  /* ---------- Hintergrund ---------- */
  #bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; background: var(--bg-grad); pointer-events: none; }
  .blob { position: absolute; border-radius: 50%; will-change: transform; }
  .b1 { width: 80vmax; height: 80vmax; left: -30vmax; top: -34vmax; background: radial-gradient(closest-side, var(--blob1), transparent); animation: drift1 28s ease-in-out infinite alternate; }
  .b2 { width: 70vmax; height: 70vmax; right: -30vmax; bottom: -26vmax; background: radial-gradient(closest-side, var(--blob2), transparent); animation: drift2 32s ease-in-out infinite alternate; }
  .b3 { width: 55vmax; height: 55vmax; left: -18vmax; bottom: 4vh; background: radial-gradient(closest-side, var(--blob3), transparent); animation: drift3 36s ease-in-out infinite alternate; }
  .b4 { width: 70vmax; height: 70vmax; right: -28vmax; top: 6vh; color: var(--tint); background: radial-gradient(closest-side, currentColor, transparent); opacity: var(--accent-op); transition: color 1.2s ease; animation: drift2 40s ease-in-out infinite alternate-reverse; }
  @keyframes drift1 { to { transform: translate(12vmax, 10vmax) scale(1.08); } }
  @keyframes drift2 { to { transform: translate(-10vmax, -8vmax) scale(1.12); } }
  @keyframes drift3 { to { transform: translate(14vmax, -12vmax) scale(0.92); } }

  /* ---------- App-Rahmen ---------- */
  #app { position: fixed; inset: 0; z-index: 1; transform-origin: 50% 100%; transition: transform 0.5s var(--ease-sheet), border-radius 0.5s var(--ease-sheet), filter 0.5s; }
  body.sheet-open #app { transform: scale(0.94) translateY(6px); border-radius: 22px; overflow: hidden; filter: brightness(0.86); }

  .view {
    position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden;
    -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain;
    padding-top: env(safe-area-inset-top);
    padding-bottom: calc(env(safe-area-inset-bottom) + 60px);
    opacity: 0; visibility: hidden; transform: translateY(12px) scale(0.985);
    transition: opacity 0.3s ease, transform 0.45s var(--ease-out), visibility 0s linear 0.45s;
  }
  .view.active { opacity: 1; visibility: visible; transform: none; transition: opacity 0.3s ease, transform 0.45s var(--ease-out), visibility 0s; }
  .view.behind { opacity: 0; transform: translateX(-24%); }
  #view-theme { transform: translateX(100%); opacity: 1; transition: transform 0.45s var(--ease-sheet), visibility 0s linear 0.45s; }
  #view-theme.active { transform: none; transition: transform 0.45s var(--ease-sheet), visibility 0s; }
  .view.instant, .view.instant * { transition: none !important; }
  .view-inner { max-width: 680px; margin: 0 auto; padding: 8px 16px 64px; }

  #navbar { position: fixed; top: 0; left: 0; right: 0; z-index: 20; height: calc(env(safe-area-inset-top) + 44px); padding-top: env(safe-area-inset-top); display: flex; align-items: center; justify-content: center; pointer-events: none; }
  #navbar::before { content: ""; position: absolute; inset: 0; background: var(--bar); -webkit-backdrop-filter: blur(28px) saturate(180%); backdrop-filter: blur(28px) saturate(180%); border-bottom: 0.5px solid var(--sep); opacity: 0; transition: opacity 0.25s ease; }
  #navbar.scrolled::before { opacity: 1; }
  #navbar .nt { position: relative; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; opacity: 0; transform: translateY(8px); transition: opacity 0.25s ease, transform 0.35s var(--ease-out); max-width: 60%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #navbar.titled .nt { opacity: 1; transform: none; }

  .lh { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 14px 4px 16px; }
  .lh > div:first-child { min-width: 0; }
  .eyebrow { font-size: 13px; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; color: var(--label2); margin-bottom: 2px; }
  .lh h1 { font-family: var(--font-display); font-size: 34px; line-height: 41px; font-weight: 800; letter-spacing: -0.025em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lh h1 .greet { display: block; font-size: 22px; line-height: 28px; font-weight: 700; letter-spacing: -0.01em; color: var(--label2); overflow: hidden; text-overflow: ellipsis; }
  .section-title { font-size: 13px; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; color: var(--label2); padding: 26px 6px 8px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .section-title small { text-transform: none; letter-spacing: 0; font-weight: 500; font-size: 13px; }
  .section-note { font-size: 14px; line-height: 1.4; color: var(--label2); padding: 0 6px 12px; margin-top: -2px; }
  .footnote { font-size: 12.5px; color: var(--label3); text-align: center; padding: 22px 12px 0; line-height: 1.5; }

  /* ---------- Tab-Leiste ---------- */
  #tabbar {
    position: fixed; z-index: 30; left: 50%;
    bottom: max(10px, calc(env(safe-area-inset-bottom) - 10px));
    transform: translateX(-50%); width: min(calc(100% - 28px), 440px); height: 64px;
    border-radius: 32px; padding: 5px; display: grid; grid-template-columns: repeat(4, 1fr);
    background: var(--tab-bg); -webkit-backdrop-filter: blur(28px) saturate(180%); backdrop-filter: blur(28px) saturate(180%);
    border: 1px solid var(--glass-border); box-shadow: 0 16px 40px rgba(0, 0, 0, 0.16), 0 2px 8px rgba(0, 0, 0, 0.06), var(--hl);
    transition: opacity 0.4s ease, transform 0.5s var(--ease-sheet);
  }
  body.sheet-open #tabbar, body.player-open #tabbar { opacity: 0; transform: translate(-50%, 30px); pointer-events: none; }
  .tab-ind { position: absolute; top: 5px; bottom: 5px; left: 5px; width: calc((100% - 10px) / 4); border-radius: 27px; background: var(--tab-ind); box-shadow: var(--hl); transform: translateX(calc(var(--i, 0) * 100%)); transition: transform 0.55s var(--ease-spring); }
  .tab { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--label2); font-size: 10.5px; font-weight: 600; letter-spacing: 0.01em; border-radius: 27px; text-align: center; transition: color 0.25s ease, transform 0.2s ease; }
  .tab:active { transform: scale(0.92); }
  .tab svg { width: 25px; height: 25px; }
  .tab svg .fillable { fill: currentColor; fill-opacity: 0; transition: fill-opacity 0.25s ease; }
  .tab.active { color: var(--tint); }
  .tab.active svg .fillable { fill-opacity: 0.22; }
  .tab-badge { position: absolute; top: 3px; left: calc(50% + 5px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--red); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; font-variant-numeric: tabular-nums; }

  /* ---------- Bedienelemente ---------- */
  .btn-primary, .btn-secondary { width: 100%; height: 54px; border-radius: 18px; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; display: flex; align-items: center; justify-content: center; gap: 8px; text-align: center; transition: transform 0.15s ease, background 0.3s ease, box-shadow 0.3s ease, color 0.3s ease, opacity 0.3s ease; }
  .btn-primary { color: #fff; background: linear-gradient(180deg, rgba(var(--c-rgb, var(--tint-rgb)), 1), rgba(var(--c-rgb, var(--tint-rgb)), 0.82)); box-shadow: 0 12px 26px rgba(var(--c-rgb, var(--tint-rgb)), 0.34), inset 0 1px 0 rgba(255, 255, 255, 0.35); }
  .btn-primary:active:not(:disabled), .btn-secondary:active { transform: scale(0.97); }
  .btn-primary:disabled { background: var(--fill); color: var(--label3); box-shadow: none; }
  .btn-secondary { background: var(--glass-soft); border: 1px solid var(--glass-border); color: var(--ink, var(--tint)); }
  .btn-primary svg, .btn-secondary svg { width: 18px; height: 18px; }
  .btn-row { display: flex; gap: 10px; margin-top: 12px; }
  .btn-row > * { flex: 1; }
  .btn-small { height: 44px; font-size: 15.5px; border-radius: 15px; }

  .switch { position: relative; display: inline-block; width: 51px; height: 31px; flex: none; }
  .switch input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; z-index: 2; cursor: pointer; }
  .switch .track { position: absolute; inset: 0; border-radius: 16px; background: var(--switch-off); transition: background 0.25s ease; }
  .switch .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15), 0 1px 1px rgba(0, 0, 0, 0.16); transition: transform 0.35s var(--ease-spring); }
  .switch input:checked + .track { background: var(--sw-on, var(--green)); }
  .switch input:checked + .track::after { transform: translateX(20px); }

  .list { border-radius: 22px; overflow: hidden; }
  .row { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 11px 14px; text-align: left; }
  .row + .row::before { content: ""; position: absolute; top: 0; right: 0; left: var(--inset, 14px); height: 0.5px; background: var(--sep); }
  button.row:active { background: var(--fill); }
  .row-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .row-title { font-size: 16.5px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.3; }
  .row-sub { font-size: 13.5px; color: var(--label2); line-height: 1.35; }
  .chev { color: var(--label3); flex: none; }
  .row.destructive { justify-content: center; color: var(--red); font-weight: 600; font-size: 17px; }

  .seg-ctl { display: grid; grid-template-columns: repeat(3, 1fr); padding: 2px; border-radius: 10px; background: var(--fill); position: relative; }
  .seg-ctl.two { grid-template-columns: repeat(2, 1fr); }
  .seg-ctl button { position: relative; z-index: 1; height: 32px; font-size: 14px; font-weight: 600; border-radius: 8px; color: var(--label); text-align: center; transition: background 0.25s ease, box-shadow 0.25s ease; }
  .seg-ctl button.on { background: var(--glass-strong); box-shadow: 0 3px 8px rgba(0, 0, 0, 0.12), 0 0 0 0.5px rgba(0, 0, 0, 0.04); }

  .pill-btn { flex: none; height: 30px; padding: 0 14px; border-radius: 15px; font-size: 14px; font-weight: 600; background: rgba(var(--c-rgb, var(--tint-rgb)), 0.14); color: var(--ink, var(--tint)); transition: transform 0.15s ease; white-space: nowrap; }
  .pill-btn.solid { background: rgba(var(--c-rgb, var(--tint-rgb)), 0.95); color: #fff; }
  .pill-btn:active { transform: scale(0.94); }

  .avatar { --s: 40px; width: var(--s); height: var(--s); flex: none; border-radius: 50%; display: grid; place-items: center; font-size: calc(var(--s) * 0.54); line-height: 1; background: linear-gradient(145deg, var(--a1), var(--a2)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45), 0 6px 16px rgba(0, 0, 0, 0.14); }
  .head-actions { display: flex; align-items: center; gap: 8px; flex: none; }
  .avatar-btn { border-radius: 50%; transition: transform 0.15s ease; }
  .avatar-btn:active { transform: scale(0.92); }
  .streak-pill { flex: none; display: flex; align-items: center; gap: 5px; height: 40px; padding: 0 13px 0 8px; border-radius: 20px; font-family: var(--font-rounded); font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; transition: transform 0.15s ease; }
  .streak-pill:active { transform: scale(0.94); }

  .badge { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px 0 8px; border-radius: 14px; background: rgba(var(--c-rgb), 0.15); border: 1px solid rgba(var(--c-rgb), 0.24); color: var(--ink); font-size: 12.5px; font-weight: 700; letter-spacing: 0.01em; min-width: 0; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge .emo { font-size: 14px; }
  .meta-tag { display: inline-flex; align-items: center; gap: 4px; flex: none; height: 24px; padding: 0 9px; border-radius: 12px; font-size: 12px; font-weight: 700; color: var(--label2); background: var(--fill); font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* ---------- Karten ---------- */
  .card { position: relative; border-radius: 30px; padding: 18px 18px 20px; overflow: hidden; }
  .card::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 260px; background: radial-gradient(120% 100% at 0% 0%, rgba(var(--c-rgb), 0.22), transparent 62%); pointer-events: none; }
  .card > * { position: relative; }
  .card-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
  .card-top .badge { max-width: 68%; }
  .card-title { font-family: var(--font-display); font-size: clamp(24px, 6.6vw, 30px); line-height: 1.12; font-weight: 800; letter-spacing: -0.024em; margin-bottom: 14px; text-wrap: balance; }
  .card-actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
  .play { flex: none; white-space: nowrap; display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px 0 6px; border-radius: 18px; background: rgba(var(--c-rgb, var(--tint-rgb)), 0.13); border: 1px solid rgba(var(--c-rgb, var(--tint-rgb)), 0.18); color: var(--ink, var(--tint)); font-size: 14px; font-weight: 600; transition: transform 0.15s ease; }
  .play:active { transform: scale(0.95); }
  .play-ico { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--c, var(--tint)); color: #fff; display: grid; place-items: center; box-shadow: 0 4px 10px rgba(var(--c-rgb, var(--tint-rgb)), 0.35); }
  .play-ico svg { width: 12px; height: 12px; margin-left: 1px; }
  .play .eq { display: none; align-items: flex-end; gap: 2px; height: 12px; }
  .play .eq i { width: 3px; border-radius: 1.5px; background: #fff; transform-origin: bottom; animation: eq 0.9s ease-in-out infinite; }
  .play .eq i:nth-child(1) { height: 60%; animation-delay: -0.3s; }
  .play .eq i:nth-child(2) { height: 100%; animation-delay: -0.6s; }
  .play .eq i:nth-child(3) { height: 45%; animation-delay: -0.1s; }
  .play.playing .play-ico svg { display: none; }
  .play.playing .eq { display: flex; }
  .play-dur { color: var(--label2); font-weight: 500; font-variant-numeric: tabular-nums; }
  .play.compact { padding: 0 6px; }
  .play.compact .play-label, .play.compact .play-dur { display: none; }
  @keyframes eq { 0%, 100% { transform: scaleY(0.35); } 50% { transform: scaleY(1); } }
  .icon-btn { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--fill); color: var(--label2); flex: none; transition: transform 0.15s ease, color 0.2s ease; }
  .icon-btn:active { transform: scale(0.9); }
  .icon-btn svg { width: 18px; height: 18px; }
  .icon-btn.on { color: #FFB800; }
  .mastered-note { font-size: 12.5px; font-weight: 600; color: var(--label2); display: inline-flex; align-items: center; gap: 5px; }
  .mastered-note svg { color: var(--green); width: 14px; height: 14px; }

  .story { font-size: 17px; line-height: 1.58; letter-spacing: -0.005em; -webkit-user-select: text; user-select: text; hyphens: auto; -webkit-hyphens: auto; }
  .funfact { margin-top: 18px; padding: 14px 16px 15px; border-radius: 20px; background: rgba(var(--c-rgb), 0.10); border: 1px solid rgba(var(--c-rgb), 0.24); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18); }
  .ff-head { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink); margin-bottom: 6px; }
  .ff-head svg { width: 16px; height: 16px; }
  .funfact p { font-size: 15.5px; line-height: 1.52; -webkit-user-select: text; user-select: text; hyphens: auto; -webkit-hyphens: auto; }

  .quiz { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--sep); }
  .quiz.bare { margin-top: 0; padding-top: 0; border-top: 0; }
  .quiz-head { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: var(--label2); }
  .quiz-head svg { width: 15px; height: 15px; }

  .activity { border-radius: 26px; padding: 18px; display: flex; align-items: center; gap: 18px; }

  /* ---------- Lern-Player ---------- */

  .pl-top { flex: none; display: flex; align-items: center; gap: 10px; padding: calc(env(safe-area-inset-top) + 8px) 14px 6px; max-width: 700px; width: 100%; margin: 0 auto; }

  .btn-choice { height: 58px; border-radius: 20px; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; text-align: center; padding: 0 8px; line-height: 1.15; transition: transform 0.15s ease; -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }

  .btn-choice.wow { background: linear-gradient(135deg, rgba(191, 90, 242, 0.9), rgba(255, 159, 10, 0.9)); color: #fff; border: 0; box-shadow: 0 10px 24px rgba(191, 90, 242, 0.3); }

  .swipe-area { position: relative; width: 100%; max-width: 540px; margin: 0 auto; display: grid; }

  .stamp { position: absolute !important; top: 64px; z-index: 3; padding: 5px 12px; border: 3px solid currentColor; border-radius: 12px; font-size: 17px; font-weight: 900; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0; pointer-events: none; background: var(--glass-strong); }

  .res-explain { margin-top: 14px; font-size: 16px; line-height: 1.55; text-align: left; -webkit-user-select: text; user-select: text; }
  .wissen-card .card-title { margin-bottom: 12px; }
  .summary { border-radius: 30px; padding: 26px 20px 22px; text-align: center; position: relative; overflow: hidden; }

  .sum-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .sum-stat { border-radius: 18px; padding: 12px 6px; background: var(--glass-soft); border: 1px solid var(--glass-border); }
  .sum-stat b { display: block; font-family: var(--font-rounded); font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .sum-stat span { font-size: 12px; color: var(--label2); font-weight: 600; }
  .cp-next { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 600; color: var(--label2); background: var(--fill); padding: 7px 12px; border-radius: 14px; margin-top: 16px; font-variant-numeric: tabular-nums; }
  .cp-next svg { width: 15px; height: 15px; }
  .sum-list { margin-top: 16px; text-align: left; }

  /* ---------- Sheet ---------- */
  #sheetBackdrop { position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, 0.3); opacity: 0; pointer-events: none; transition: opacity 0.45s ease; }
  body.sheet-open #sheetBackdrop { opacity: 1; pointer-events: auto; }
  #sheet { position: fixed; z-index: 51; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 680px; height: calc(100% - env(safe-area-inset-top) - 12px); border-radius: 30px 30px 0 0; background: var(--sheet-bg); -webkit-backdrop-filter: blur(28px) saturate(180%); backdrop-filter: blur(28px) saturate(180%); border: 1px solid var(--glass-border); border-bottom: 0; box-shadow: 0 -12px 40px rgba(0, 0, 0, 0.22), var(--hl); transform: translateY(105%); transition: transform 0.5s var(--ease-sheet); display: flex; flex-direction: column; visibility: hidden; }

  .grabber { margin-top: 7px; width: 38px; height: 5px; border-radius: 3px; background: var(--label3); }

  .sheet-close svg { width: 13px; height: 13px; }
  .sheet-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 0 16px calc(env(safe-area-inset-bottom) + 32px); }
  .sheet-body .card, .sheet-body .result { background: var(--glass-soft); -webkit-backdrop-filter: none; backdrop-filter: none; }

  /* ---------- Profil-Editor / Willkommen ---------- */
  #onboard { position: fixed; inset: 0; z-index: 65; overflow-y: auto; -webkit-overflow-scrolling: touch; background: var(--bg-grad); background-color: var(--bg); opacity: 0; visibility: hidden; transition: opacity 0.35s ease, visibility 0s linear 0.35s; }

  .ob-inner { max-width: 520px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 12px) 20px calc(env(safe-area-inset-bottom) + 30px); }

  .ob-inner h1 { text-align: center; font-family: var(--font-display); font-size: 30px; font-weight: 800; letter-spacing: -0.025em; }
  .ob-sub { text-align: center; color: var(--label2); font-size: 15.5px; line-height: 1.45; margin: 6px auto 8px; max-width: 34ch; }
  .ob-note { margin-top: 12px; border-radius: 16px; padding: 12px 14px; font-size: 14px; line-height: 1.4; color: var(--label2); background: rgba(var(--green-rgb), 0.12); border: 1px solid rgba(var(--green-rgb), 0.28); }
  .ob-label { display: block; font-size: 13px; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; color: var(--label2); margin: 20px 6px 8px; }

  .ob-emoji { aspect-ratio: 1; border-radius: 14px; font-size: 26px; display: grid; place-items: center; background: var(--fill); transition: transform 0.15s ease, background 0.2s ease, box-shadow 0.2s ease; }

  .ob-color { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(145deg, var(--a1), var(--a2)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.4); transition: transform 0.15s ease, box-shadow 0.2s ease; }
  .ob-color.on { box-shadow: 0 0 0 3px var(--bg), 0 0 0 5.5px var(--tint); }
  .ob-voice-row { display: flex; gap: 10px; align-items: center; }

  .ob-save { margin-top: 26px; }

  /* ---------- Toast & Alert ---------- */
  #toast { position: fixed; z-index: 80; top: calc(env(safe-area-inset-top) + 8px); left: 50%; max-width: calc(100% - 32px); display: flex; align-items: center; gap: 10px; padding: 10px 18px 10px 12px; border-radius: 24px; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; transform: translate(-50%, -160%) scale(0.9); opacity: 0; transition: transform 0.55s var(--ease-spring), opacity 0.3s ease; pointer-events: none; background: var(--glass-strong); }
  #toast.show { transform: translate(-50%, 0) scale(1); opacity: 1; }
  #toast .t-ico { font-size: 20px; line-height: 1; }
  #alert { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; padding: 24px; background: rgba(0, 0, 0, 0.32); opacity: 0; pointer-events: none; transition: opacity 0.22s ease; }

  .alert-box { width: 280px; border-radius: 18px; overflow: hidden; background: var(--alert-bg); -webkit-backdrop-filter: blur(28px) saturate(180%); backdrop-filter: blur(28px) saturate(180%); border: 1px solid var(--glass-border); text-align: center; transform: scale(1.12); transition: transform 0.35s var(--ease-spring); box-shadow: var(--shadow-lg); }

  .confetti { position: fixed; inset: 0; z-index: 85; pointer-events: none; width: 100%; height: 100%; }

  @media (min-width: 560px) {

<body>
<noscript><p style="padding:40px 20px;font-family:-apple-system,sans-serif">Lumen benötigt JavaScript.</p></noscript>

      <div class="search">

        <button class="search-clear" id="searchClear" data-action="clear-search" aria-label="Suche löschen" hidden><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></span></button>
      </div>

    wissen: [
      ["Was ist eigentlich ein Dinosaurier?", "Dinosaurier sind eine bestimmte Gruppe von Reptilien, die vor rund 230 Millionen Jahren auftauchte. Ein typisches Merkmal ist die aufrechte Beinstellung: Ihre Beine standen senkrecht unter dem Körper, nicht seitlich abgespreizt wie bei Eidechsen. Der Name stammt vom britischen Anatomen Richard Owen, der 1842 den Begriff „Dinosauria“ prägte – „schreckliche Echsen“.\n\nViele bekannte Urzeittiere sind streng genommen keine Dinosaurier: Die Flugsaurier waren nahe Verwandte, aber eine eigene Gruppe, und Meeresreptilien wie Ichthyosaurier oder Plesiosaurier gehörten ebenfalls nicht dazu. Umgekehrt zählen die Vögel heute zu den Dinosauriern. Wenn Forschende vom Aussterben sprechen, meinen sie deshalb die „Nicht-Vogel-Dinosaurier“."],
      ["Trias, Jura, Kreide", "Das Zeitalter der Dinosaurier heißt Erdmittelalter oder Mesozoikum und dauerte von vor rund 252 bis vor 66 Millionen Jahren. Es wird in drei Abschnitte geteilt: die Trias, den Jura und die Kreidezeit. Zu Beginn bildeten fast alle Landmassen den Superkontinent Pangäa, der im Lauf der Zeit auseinanderbrach.\n\nIn der Trias waren Dinosaurier noch vergleichsweise klein und selten. Im Jura, benannt nach dem Juragebirge, entstanden die riesigen Sauropoden und die ersten Vögel. In der Kreidezeit – nach den Kreidefelsen, die damals aus Kalkschalen winziger Meeresalgen entstanden – blühten Blütenpflanzen auf, und es lebten Tyrannosaurus, Triceratops und Velociraptor. Das Klima war im Mittel deutlich wärmer als heute; an den Polen gab es lange kaum Eis."],
      ["Die ersten Dinosaurier", "Die ältesten sicher bekannten Dinosaurier stammen aus Gesteinen in Argentinien und Brasilien, die rund 230 Millionen Jahre alt sind. Tiere wie Eoraptor oder Herrerasaurus waren eher klein bis mittelgroß, liefen auf zwei Beinen und wirkten noch recht unscheinbar. Damals beherrschten andere Reptilien die Landschaften, vor allem große Verwandte der Krokodile.\n\nDen Durchbruch brachte ein weiteres Massenaussterben am Ende der Trias vor etwa 201 Millionen Jahren. Viele Konkurrenten verschwanden, während die Dinosaurier überlebten und frei gewordene Lebensräume besetzten. Warum gerade sie so erfolgreich waren, ist nicht restlos geklärt – diskutiert werden ihre effiziente Atmung, ihr schnelles Wachstum und die aufrechte, kraftsparende Fortbewegung."],
      ["Echsenbecken und Vogelbecken", "Traditionell teilt man die Dinosaurier nach der Form ihres Beckens in zwei große Gruppen. Bei den Echsenbeckensauriern (Saurischia) zeigt das Schambein nach vorne – zu ihnen gehören die Raubsaurier und die langhalsigen Sauropoden. Bei den Vogelbeckensauriern (Ornithischia) zeigt es nach hinten, ähnlich wie bei heutigen Vögeln. Dazu zählen Stegosaurier, Ankylosaurier, Entenschnabelsaurier und Horndinosaurier.\n\nDas Kuriose: Die Vögel stammen nicht von den Vogelbeckensauriern ab, sondern von Raubsauriern mit Echsenbecken. Die Rückwärtsdrehung des Schambeins entstand also zweimal unabhängig. Neuere Analysen stellen die klassische Einteilung sogar teilweise infrage – die Stammbäume der Dinosaurier werden bis heute lebhaft diskutiert."],
      ["Theropoden – die Raubsaurier", "Fast alle fleischfressenden Dinosaurier gehören zu den Theropoden. Sie liefen auf zwei Beinen, hatten meist scharfe, gezackte Zähne und Krallen an den Händen. Die Gruppe reicht von hühnergroßen Tieren wie Compsognathus bis zu Riesen wie Tyrannosaurus, Giganotosaurus oder Spinosaurus.\n\nDer Velociraptor sah übrigens ganz anders aus als im Film „Jurassic Park“: Er war etwa so groß wie ein Truthahn, rund zwei Meter lang mit Schwanz, und trug Federn – an seinen Unterarmknochen fand man Ansatzstellen für Schwungfedern. Die großen „Raptoren“ im Film ähneln eher dem verwandten Deinonychus. Typisch für diese Gruppe war eine vergrößerte, sichelförmige Kralle an der zweiten Zehe, die beim Laufen angehoben wurde."],
      ["Spinosaurus – der Fischjäger", "Spinosaurus aus Nordafrika war vermutlich noch länger als Tyrannosaurus, aber ganz anders gebaut. Er hatte eine lange, krokodilähnliche Schnauze mit kegelförmigen Zähnen, ideal zum Festhalten glitschiger Fische. Auf seinem Rücken trug er ein Segel aus bis zu über 1,5 Meter hohen Dornfortsätzen – wozu, ist bis heute umstritten.\n\nDie ersten Fossilien beschrieb der deutsche Paläontologe Ernst Stromer 1915. Sie lagerten in München und wurden 1944 bei einem Bombenangriff zerstört – erhalten blieben nur Zeichnungen und Fotos. Neue Funde aus Marokko zeigen einen paddelartigen Schwanz und dichte Knochen. Ob Spinosaurus ein aktiver Schwimmer war oder eher im flachen Wasser wie ein Reiher jagte, streiten Fachleute bis heute."],
      ["Hörner, Platten und Panzer", "Pflanzenfressende Dinosaurier verteidigten sich auf erstaunliche Weise. Triceratops trug drei Hörner und einen großen Knochenschild am Hinterkopf – Bissspuren auf Fossilien zeigen, dass er tatsächlich mit Tyrannosaurus aneinandergeriet. Die Schilde dienten wohl auch dazu, Artgenossen zu beeindrucken.\n\nStegosaurus hatte zwei Reihen großer Knochenplatten auf dem Rücken und Stacheln am Schwanzende. Die Platten waren durchblutet und halfen vielleicht bei der Temperaturregelung, dienten aber vermutlich vor allem der Zurschaustellung. Ankylosaurus schließlich war gebaut wie ein Panzer: Knochenplatten bedeckten Rücken und sogar die Augenlider, und am Schwanz saß eine massive Knochenkeule, mit der er Angreifern wohl die Beine brechen konnte."],
      ["Entenschnabelsaurier", "Die Hadrosaurier, wegen ihrer breiten Schnauze Entenschnabelsaurier genannt, gehörten in der späten Kreidezeit zu den häufigsten Pflanzenfressern. Ihr Gebiss war ein Meisterwerk: Hunderte Zähne standen in dicht gepackten „Zahnbatterien“ und wuchsen ständig nach. Damit zermahlten sie selbst harte Pflanzen.\n\nViele Arten trugen auffällige Kopfkämme. Bei Parasaurolophus war der Kamm hohl und mit den Nasengängen verbunden – er diente wohl als Resonanzkörper für tiefe, weit hörbare Rufe. In Montana entdeckte man Nistkolonien mit Eiern, Jungtieren und Hinweisen auf elterliche Fürsorge. Der dort gefundene Dinosaurier erhielt deshalb den Namen Maiasaura – „gute Mutterechse“."],
      ["Flugsaurier", "Flugsaurier (Pterosaurier) waren die ersten Wirbeltiere, die aktiv fliegen konnten – lange vor den Vögeln. Ihre Flügel bestanden aus einer Flughaut, die vor allem von einem extrem verlängerten vierten Finger aufgespannt wurde. Ihr Körper war oft mit haarähnlichen Fasern bedeckt, und ihre Knochen waren hohl und dünnwandig.\n\nDie Größenunterschiede waren enorm: Manche Arten hatten die Spannweite einer Amsel, andere wie Quetzalcoatlus erreichten rund zehn Meter – so viel wie ein kleines Flugzeug. Wie ein solcher Riese abhob, beschäftigt Forschende: Vermutlich katapultierte er sich mit den kräftigen Armen vom Boden ab. Flugsaurier waren enge Verwandte, aber keine Dinosaurier – und sie starben vor 66 Millionen Jahren vollständig aus."],
      ["Reptilien der Urmeere", "Während an Land die Dinosaurier herrschten, eroberten andere Reptilien die Meere. Ichthyosaurier sahen aus wie Delfine, hatten große Augen und brachten ihre Jungen lebend zur Welt – Fossilien zeigen Mütter mit Embryonen im Körper, manche sogar mitten in der Geburt. Plesiosaurier hatten vier flossenartige Paddel und oft einen extrem langen Hals.\n\nIn der späten Kreidezeit kamen die Mosasaurier hinzu, riesige Meeresechsen, die mit den Waranen verwandt waren. Einige der schönsten Meeresreptilien der Welt stammen aus Holzmaden in Baden-Württemberg: Im Posidonienschiefer des Jura sind Ichthyosaurier so gut erhalten, dass sogar ihre Körperumrisse als dunkle Schicht sichtbar sind."],
      ["Klein und groß – die ganze Bandbreite", "Wer an Dinosaurier denkt, stellt sich meist Giganten vor. Doch viele waren klein: Compsognathus war etwa so groß wie ein Huhn, und der gefiederte Microraptor hatte vier Flügel und wog vermutlich um ein Kilogramm. Die kleinsten Dinosaurier überhaupt leben heute noch – die Bienenelfe, ein Kolibri, wiegt rund zwei Gramm.\n\nAm anderen Ende stehen Sauropoden wie Argentinosaurus oder Patagotitan mit geschätzt über 30 Metern Länge und 60 Tonnen und mehr. Solche Zahlen beruhen oft auf wenigen Knochen und sind deshalb Schätzungen. Riesenwuchs hatte Vorteile: Große Tiere sind vor Räubern sicherer und verwerten nährstoffarme Pflanzen besser, weil die Nahrung lange im Darm bleibt."],
      ["Warm oder kalt – der Stoffwechsel der Dinosaurier", "Lange galten Dinosaurier als träge, wechselwarme Echsen. Heute weiß man: Ihre Knochen zeigen oft Strukturen, die auf schnelles Wachstum hindeuten, ähnlich wie bei Vögeln und Säugetieren. Ein junger Tyrannosaurus legte in seiner stärksten Wachstumsphase geschätzt über zwei Kilogramm am Tag zu.\n\nFedern bei vielen kleinen Arten sprechen ebenfalls für eine eigene Wärmeproduktion – als Isolierung ergeben sie nur Sinn, wenn es Wärme zu halten gibt. Wahrscheinlich gab es aber keine einheitliche Lösung: Manche Gruppen waren wohl voll gleichwarm, andere lagen irgendwo dazwischen. Bei den Riesen spielte zusätzlich die Masse eine Rolle – ein so großer Körper kühlt nur sehr langsam aus."],
      ["Federn und Farben", "1996 beschrieben Forschende aus China Sinosauropteryx, den ersten Nicht-Vogel-Dinosaurier mit eindeutigen federartigen Strukturen. Seitdem kamen Dutzende gefiederte Arten hinzu – vom winzigen Microraptor bis zu Yutyrannus, einem neun Meter langen Verwandten des Tyrannosaurus mit Flaum.\n\nErstaunlicherweise lassen sich sogar Farben rekonstruieren. In gut erhaltenen Federn sind winzige Pigmentkörperchen, Melanosomen, fossil erhalten. Ihre Form verrät, ob sie schwarz, grau oder rotbraun färbten. So weiß man, dass Sinosauropteryx einen rotbraun-hell geringelten Schwanz hatte und Anchiornis ein schwarz-weißes Gefieder mit rötlicher Haube. Manche Federn schillerten wohl sogar wie bei heutigen Staren."],
      ["Eier, Nester und Brutpflege", "Alle Dinosaurier legten Eier mit harter Schale. Man hat ganze Nistkolonien gefunden, etwa von Sauropoden in Argentinien mit Tausenden Eiern. Überraschend: Selbst die größten Tiere legten recht kleine Eier, bei Sauropoden etwa so groß wie eine Grapefruit. Größere Eier hätten eine dickere Schale gebraucht, durch die kaum Luft gekommen wäre.\n\nDer Oviraptor erhielt seinen Namen – „Eierdieb“ – weil man ihn 1923 neben einem Gelege fand und glaubte, er habe es plündern wollen. Spätere Funde zeigten Oviraptor-Verwandte, die in Brutstellung mit ausgebreiteten Armen auf ihren eigenen Eiern sitzen. Der vermeintliche Dieb war also ein fürsorglicher Elternteil – ein Justizirrtum der Paläontologie."],
      ["Die fünf großen Massenaussterben", "In der Erdgeschichte gab es mehrere Katastrophen, bei denen in kurzer Zeit ein großer Teil aller Arten verschwand. Fachleute zählen fünf besonders große: am Ende des Ordoviziums, im späten Devon, am Ende des Perm, am Ende der Trias und am Ende der Kreidezeit.\n\nDas schlimmste ereignete sich vor rund 252 Millionen Jahren an der Grenze vom Perm zur Trias. Gewaltige Vulkanausbrüche im heutigen Sibirien setzten riesige Mengen Treibhausgase frei; die Meere erwärmten sich und verloren Sauerstoff. Schätzungsweise über 80 Prozent der Meeresarten starben aus. Das bekannteste Aussterben ist aber das letzte – vor 66 Millionen Jahren, als die Dinosaurier verschwanden."],
      ["Wie man den Täter fand", "1980 veröffentlichten der Physiker Luis Alvarez und sein Sohn, der Geologe Walter Alvarez, eine kühne Idee. In einer dünnen Tonschicht an der Grenze zwischen Kreide und Paläogen hatten sie ungewöhnlich viel Iridium gefunden – ein Metall, das in Asteroiden häufig vorkommt. Ihre Schlussfolgerung: Ein riesiger Einschlag habe das Aussterben ausgelöst.\n\nViele Fachleute waren skeptisch, denn es fehlte der Krater. Anfang der 1990er-Jahre wurde er identifiziert: Chicxulub auf der Halbinsel Yucatán, rund 180 Kilometer breit und vom richtigen Alter. Dazu passen geschockte Quarzkörner, Glaskügelchen und Tsunami-Ablagerungen rund um den Golf von Mexiko. Gewaltige Vulkanausbrüche in Indien haben die Lage vermutlich zusätzlich verschärft."],
      ["Wer überlebte den Einschlag?", "Nach dem Einschlag starben alle großen Landtiere aus – kein Tier über etwa 25 Kilogramm überlebte an Land, so die gängige Einschätzung. Durchgekommen sind vor allem kleine Tiere, die wenig Nahrung brauchten, sich verstecken konnten oder im Wasser lebten: kleine Säugetiere, einige Vogelgruppen, Krokodile, Schildkröten, Eidechsen, Schlangen und Amphibien.\n\nEntscheidend war die Nahrung. Wer von Samen, Insekten oder abgestorbenem Pflanzenmaterial leben konnte, hatte bessere Chancen als ein Tier, das auf frische Blätter angewiesen war. Süßwasser-Lebensräume waren ebenfalls günstiger, weil ihre Nahrungsketten auf totem Material beruhen. Von den Vögeln überlebten wohl vor allem bodenlebende Arten – die Vorfahren aller heutigen Vögel."],
      ["Die Stunde der Säugetiere", "Säugetiere gab es schon fast so lange wie Dinosaurier. Doch 150 Millionen Jahre lang blieben die meisten klein, oft nicht größer als eine Maus, und waren wohl überwiegend nachts aktiv. Nach dem Ende der großen Dinosaurier änderte sich das rasant: Innerhalb weniger Hunderttausend Jahre wuchsen die ersten Arten deutlich, und in wenigen Millionen Jahren entstanden viele neue Formen.\n\nEinige gingen erstaunliche Wege. Wale stammen von kleinen, hirschähnlichen Landtieren ab, die vor rund 50 Millionen Jahren am Ufer lebten und allmählich ins Wasser gingen – ihre nächsten heutigen Verwandten sind die Flusspferde. Auch Fledermäuse, Primaten, Pferde und Elefantenverwandte tauchten in dieser Zeit auf."],
      ["Die Grube Messel", "Nahe Darmstadt liegt eine ehemalige Ölschiefergrube, die zu den bedeutendsten Fossilfundstellen der Welt gehört und seit 1995 UNESCO-Welterbe ist. Vor rund 47 Millionen Jahren befand sich hier ein tiefer Kratersee inmitten eines subtropischen Waldes. Am Grund fehlte Sauerstoff, sodass abgesunkene Tiere kaum zersetzt wurden.\n\nDie Erhaltung ist spektakulär: Man findet Fledermäuse mit Flughaut und Mageninhalt, schillernde Käfer, Vögel mit Federn und Urpferdchen, nicht größer als ein Fuchs – eines sogar mit einem Fohlen im Mutterleib. Berühmt wurde auch „Ida“, ein fast vollständiges Skelett eines frühen Primaten. Knapp vor der Umwandlung in eine Mülldeponie wurde die Grube in den 1990er-Jahren gerettet."],
      ["Die Riesen der Eiszeit", "In den Kaltzeiten der letzten rund zweieinhalb Millionen Jahre lebte eine eindrucksvolle Tierwelt, die Megafauna. In Europa streiften Wollhaarmammuts, Wollnashörner, Höhlenbären und Riesenhirsche mit bis zu dreieinhalb Metern Geweihspannweite umher. In Amerika gab es Säbelzahnkatzen, Riesengürteltiere so groß wie ein Kleinwagen und Riesenfaultiere, die aufgerichtet mehrere Meter hoch waren.\n\nDie meisten dieser Arten verschwanden gegen Ende der letzten Kaltzeit. Über die Ursachen wird seit Langem diskutiert: der Klimawandel mit schrumpfenden Lebensräumen, die Jagd durch den sich ausbreitenden Menschen – oder beides zusammen. Auffällig ist, dass große Tiere oft kurz nach der Ankunft des Menschen in einer Region verschwanden."],
      ["Wie Paläontologen arbeiten", "Die meisten Funde beginnen mit Zufall oder systematischer Suche in Gesteinsschichten des richtigen Alters, oft in Wüsten oder Badlands, wo Erosion Fossilien freilegt. Ist ein Knochen entdeckt, wird er vorsichtig freigelegt, mit Klebstoff gefestigt und samt umgebendem Gestein in eine Hülle aus Gips und Jute gepackt – wie ein gebrochenes Bein.\n\nIm Labor beginnt die Präparation: Mit feinen Druckluftmeißeln, Nadeln und manchmal Säure wird das Gestein entfernt – bei großen Skeletten kann das Jahre dauern. Heute helfen Computertomografen, ins Innere von Schädeln zu blicken, Gehirnhöhlen zu rekonstruieren oder Embryonen in Eiern sichtbar zu machen. Das Alter bestimmt man meist über Vulkanascheschichten, deren radioaktive Elemente sich datieren lassen."],
      ["Mary Anning – die Fossiliensammlerin", "Mary Anning wurde 1799 im englischen Küstenort Lyme Regis geboren. Ihre Familie verkaufte Fossilien, die aus den Klippen herauswitterten, an Touristen. Mit etwa zwölf Jahren fand Mary zusammen mit ihrem Bruder das erste vollständig erkannte Skelett eines Ichthyosauriers. Später entdeckte sie den ersten nahezu vollständigen Plesiosaurier und einen der ersten Flugsaurier Großbritanniens.\n\nObwohl führende Geologen ihre Funde beschrieben und ihr Fachwissen schätzten, durfte sie als Frau nicht Mitglied der Geologischen Gesellschaft in London werden, und ihr Name wurde in Veröffentlichungen oft verschwiegen. Heute gilt sie als eine der Pionierinnen der Paläontologie – der Zungenbrecher „She sells seashells by the seashore“ soll auf sie anspielen."],
      ["Der Knochenkrieg", "Im späten 19. Jahrhundert lieferten sich die amerikanischen Paläontologen Edward Drinker Cope und Othniel Charles Marsh einen erbitterten Wettstreit, der als „Knochenkrieg“ in die Geschichte einging. Beide schickten Grabungsteams in den Westen der USA, bestachen Arbeiter, spionierten einander aus und sollen sogar Fundstellen zerstört haben, damit der Rivale nichts mehr fand.\n\nWissenschaftlich war die Bilanz dennoch gewaltig: Zusammen beschrieben sie weit über hundert neue Arten fossiler Wirbeltiere. Marsh benannte unter anderem Stegosaurus, Triceratops und Allosaurus. In der Eile unterliefen ihnen aber auch Fehler – so setzte Marsh einem Skelett den falschen Schädel auf, was jahrzehntelang für Verwirrung um den Brontosaurus sorgte."],
      ["Dinosaurier in Deutschland", "Deutschland ist für einige der wichtigsten Fossilfunde der Welt bekannt. Aus den Plattenkalken von Solnhofen und Eichstätt in Bayern stammen alle bekannten Exemplare von Archaeopteryx. Bei Trossingen in Baden-Württemberg fand man Dutzende Skelette von Plateosaurus, einem acht bis zehn Meter langen Pflanzenfresser aus der Trias.\n\nIn einem Steinbruch in Niedersachsen entdeckte man Europasaurus, einen Zwergsauropoden: Er wurde nur rund sechs Meter lang, weil er auf einer Insel lebte, auf der die Nahrung knapp war – ein Fall von Inselverzwergung. Und in Münchehagen bei Hannover sowie an weiteren Orten sind echte Dinosaurierfährten erhalten, die man heute besichtigen kann."],
      ["Irrtümer über Dinosaurier", "Die Forschung korrigiert ihr Bild ständig. Beim Iguanodon, einem der ersten beschriebenen Dinosaurier, setzte man den kegelförmigen Stachel zunächst auf die Nase – erst vollständige Skelette zeigten, dass er am Daumen saß. Lange stellte man Dinosaurier mit schleifendem Schwanz dar; Fährten beweisen aber, dass sie ihn meist waagerecht in der Luft hielten.\n\nDer Name Brontosaurus galt jahrzehntelang als ungültig, weil man ihn für ein Synonym von Apatosaurus hielt – 2015 kamen Forschende nach neuer Analyse zu dem Schluss, dass er doch eine eigene Gattung sei. Und dass T. rex nur Bewegungen sehen konnte, stammt aus dem Kino: Seine nach vorn gerichteten Augen sprechen eher für gutes räumliches Sehen."]
    ],

      ["Hotspots", "Unter Hawaii und Island steigen heiße Mantelströme auf. Weil die Pazifische Platte über den Hawaii-Hotspot hinwegwandert, entstand dort eine ganze Kette von Vulkaninseln."],
      ["Wie die Alpen entstanden", "Die Alpen wurden aufgefaltet, als die Afrikanische Platte gegen Europa drückte. Dieser Prozess dauert bis heute an – Erdbeben in Norditalien und der Schweiz zeugen davon."],
      ["Der Gesteinskreislauf", "Magmatische Gesteine entstehen aus Schmelze, Sedimentgesteine aus abgelagerten Teilchen, metamorphe Gesteine durch Druck und Hitze. Über Jahrmillionen verwandeln sich alle drei immer wieder ineinander."],
      ["Fossilien", "Fossilien entstehen meist, wenn Tier- oder Pflanzenreste schnell von Sediment bedeckt werden. Mineralien ersetzen nach und nach das organische Material und bewahren so die Form."],
      ["Die Eiszeiten", "In den letzten rund 2,6 Millionen Jahren wechselten sich Kalt- und Warmzeiten ab. Während der letzten Kaltzeit reichten skandinavische Gletscher bis nach Norddeutschland und hinterließen dort Findlinge und Seen."],
      ["Permafrost", "Dauerhaft gefrorene Böden bedecken große Teile Sibiriens, Kanadas und Alaskas. Tauen sie auf, werden große Mengen gespeicherter Treibhausgase freigesetzt, und Gebäude und Straßen sacken ab."],
      ["Der natürliche Treibhauseffekt", "Wasserdampf, CO₂ und andere Gase halten einen Teil der Wärmestrahlung in der Atmosphäre zurück. Ohne diesen Effekt läge die mittlere Temperatur bei etwa –18 °C statt bei rund 15 °C."],
      ["Der menschengemachte Klimawandel", "Durch das Verbrennen fossiler Brennstoffe ist der CO₂-Gehalt der Luft stark gestiegen. Die globale Mitteltemperatur liegt inzwischen deutlich über dem vorindustriellen Niveau, mit Folgen wie Hitzewellen, Dürren und steigendem Meeresspiegel."],
      ["Das Ozonloch", "Fluorchlorkohlenwasserstoffe aus Spraydosen und Kühlschränken zerstörten die Ozonschicht über der Antarktis. Das Montreal-Protokoll von 1987 verbot diese Stoffe – seitdem erholt sich die Ozonschicht langsam."],
      ["Warum es Jahreszeiten gibt", "Die Erdachse ist um rund 23,4 Grad geneigt. Deshalb neigt sich im Laufe des Jahres mal die Nord-, mal die Südhalbkugel stärker zur Sonne – nicht die Entfernung zur Sonne verursacht die Jahreszeiten."],
      ["Die größte Wüste der Welt", "Wüsten werden über ihren geringen Niederschlag definiert, nicht über Hitze. Deshalb ist die Antarktis die größte Wüste der Erde, noch vor der Sahara."],
      ["Wetter und Klima", "Wetter beschreibt den Zustand der Atmosphäre an einem Ort über Stunden oder Tage. Klima ist dagegen das durchschnittliche Wetter über mindestens 30 Jahre."],
      ["Der Coriolis-Effekt", "Weil sich die Erde dreht, werden Winde auf der Nordhalbkugel nach rechts und auf der Südhalbkugel nach links abgelenkt. Deshalb drehen sich Tiefdruckgebiete auf beiden Halbkugeln in entgegengesetzte Richtungen."],
      ["Der Jetstream", "In rund zehn Kilometern Höhe wehen starke Westwinde mit oft über 200 km/h. Flugzeuge nutzen sie auf dem Weg von Amerika nach Europa und sind deshalb in dieser Richtung schneller."],
      ["Der Monsun", "Beim Monsun drehen die Winde jahreszeitlich: Im Sommer bringen sie feuchte Meeresluft und heftige Regenfälle nach Süd- und Ostasien. Für die Landwirtschaft von Milliarden Menschen ist er lebenswichtig."],
      ["Die Gezeiten", "Ebbe und Flut entstehen vor allem durch die Anziehungskraft des Mondes, verstärkt oder abgeschwächt von der Sonne. Stehen Sonne, Mond und Erde in einer Linie, gibt es besonders starke Springfluten."],
      ["Boden braucht Zeit", "Die Bildung von nur einem Zentimeter fruchtbarem Boden kann Hunderte Jahre dauern. Erosion durch Wind und Wasser kann diesen Schatz dagegen in wenigen Jahren abtragen."],
      ["Die häufigsten Minerale", "Feldspäte und Quarz sind die häufigsten Minerale der Erdkruste. Quarzsand ist der Rohstoff für Glas und Halbleiter."],
      ["Die Mohs-Härteskala", "Der Mineraloge Friedrich Mohs ordnete Minerale danach, welches welches ritzt: von Talk (1) bis Diamant (10). Ein Fingernagel hat etwa Härte 2,5."],
      ["Gletscher als Wasserspeicher", "Gebirgsgletscher speisen im Sommer mit ihrem Schmelzwasser Flüsse wie Rhein und Rhône. Durch die Erwärmung schrumpfen die Alpengletscher seit Jahrzehnten stark."],
      ["Erdzeitalter", "Die Erdgeschichte wird in Äonen, Ären und Perioden eingeteilt, etwa Kambrium, Jura und Kreide. Die Grenzen markieren oft einschneidende Ereignisse wie Massenaussterben."]

    wissen: [
      ["Eine Art, Hunderte Rassen", "Ob Chihuahua mit gut zwei Kilogramm oder Deutsche Dogge mit über 70 Kilogramm – alle Hunde gehören zu einer einzigen Art. Der internationale Dachverband der Hundezucht erkennt rund 350 Rassen an, dazu kommen zahlreiche weitere. Kein anderes Säugetier zeigt eine so große Vielfalt an Größen und Formen.\n\nDie meisten heutigen Rassen sind erstaunlich jung. Zwar gab es schon im Altertum verschiedene Hundetypen für Jagd, Hütearbeit oder Bewachung, doch die strenge Zucht nach festen Rassestandards mit Stammbäumen begann erst im 19. Jahrhundert mit Hundeausstellungen in England. Dabei wurde oft stark auf Aussehen selektiert – mit Folgen: Viele Rassen tragen heute typische Erbkrankheiten."],
      ["Wie Hunde riechen", "Riechen ist für Hunde das, was für uns das Sehen ist. Ein Hund kann Gerüche in Konzentrationen wahrnehmen, die weit unter unserer Wahrnehmungsgrenze liegen. Er erkennt nicht nur, dass etwas riecht, sondern analysiert Gerüche wie ein Chemiker in ihre Bestandteile – und kann so einen Menschen unter vielen anderen herausriechen.\n\nBeim Verfolgen einer Spur nutzt er sogar die Zeit: Aus winzigen Unterschieden in der Duftstärke zwischen aufeinanderfolgenden Fußabdrücken erkennt ein geübter Hund, in welche Richtung jemand gegangen ist. Zusätzlich besitzt er wie viele Säugetiere das Jacobson-Organ im Gaumen, mit dem er Duftbotschaften von Artgenossen, etwa Sexuallockstoffe, besonders gut wahrnimmt."],
      ["Wie Hunde hören und sehen", "Hunde hören deutlich höhere Töne als wir – bis zu etwa 45.000 Hertz, wir nur bis rund 20.000. Deshalb funktionieren Hundepfeifen, die für uns lautlos sind. Mit ihren beweglichen Ohren können viele Hunde Geräusche genau orten. Unter Welpen ist das Gehör anfangs noch verschlossen und öffnet sich erst nach etwa zwei Wochen.\n\nBeim Sehen unterscheiden Hunde Farben weniger fein als wir. Sie haben zwei Sorten von Farbzapfen und sehen vor allem Blau- und Gelbtöne gut; Rot und Grün verschwimmen eher zu Braun- und Gelbtönen. Ein roter Ball im grünen Gras ist für sie deshalb schwer zu entdecken. Dafür sehen Hunde in der Dämmerung besser und erkennen Bewegungen sehr schnell."],
      ["Wie Hunde lernen", "Hunde lernen am besten über Konsequenzen: Verhalten, das sich lohnt, wird häufiger gezeigt. Moderne Hundeerziehung setzt deshalb auf positive Verstärkung – Futter, Spiel oder Lob unmittelbar nach dem erwünschten Verhalten. Das Timing ist entscheidend: Schon nach wenigen Sekunden verknüpft der Hund die Belohnung nicht mehr sicher mit seiner Handlung.\n\nViele Trainer nutzen deshalb ein Markersignal, etwa ein kurzes Wort oder einen Klicker, das genau im richtigen Moment „Ja, das war’s!“ sagt. Wie viel Hunde lernen können, zeigte die Border-Collie-Hündin Chaser aus den USA: Sie kannte die Namen von über tausend Spielzeugen und konnte sie auf Zuruf holen. Auch neue Wörter ordnete sie durch Ausschluss richtig zu."],
      ["Das Märchen vom Alphatier", "Lange hieß es, Hunde wollten ständig die Rangordnung über ihren Menschen erobern, weshalb man sie „dominieren“ müsse. Die Idee stammt aus frühen Beobachtungen von Wölfen, die als zusammengewürfelte Gruppe in Gehegen lebten und dort heftig um Rang stritten.\n\nFreilebende Wolfsrudel sind dagegen meist Familien: Eltern mit ihren Jungen aus den letzten Jahren. Der Wolfsforscher David Mech, der den Begriff „Alphawolf“ selbst bekannt gemacht hatte, korrigierte sich später ausdrücklich. Auch für Hunde gilt heute: Probleme entstehen meist durch Angst, Unsicherheit, Langeweile oder fehlendes Training – nicht durch Machtansprüche. Strafen und Gewalt schaden der Beziehung und können Aggression sogar verstärken."],
      ["Hunde verstehen uns erstaunlich gut", "In Tausenden Jahren gemeinsamen Lebens haben Hunde gelernt, uns zu lesen. Sie folgen Zeigegesten und Blicken, unterscheiden fröhliche von wütenden Gesichtern und reagieren auf den Tonfall unserer Stimme. Hirnscans zeigen, dass sie Lob sowohl an der Wortbedeutung als auch an der Stimmlage erkennen.\n\nBesonders berührend: Schauen sich Hund und Halter gegenseitig in die Augen, steigt bei beiden der Spiegel des Bindungshormons Oxytocin – ein Mechanismus, der auch zwischen Eltern und Babys wirkt. Hunde suchen bei unlösbaren Aufgaben oft Blickkontakt zu ihrem Menschen, als wollten sie um Hilfe bitten. Wölfe, selbst wenn sie mit Menschen aufgewachsen sind, versuchen es dagegen meist allein weiter."],
      ["Die Welpenzeit prägt ein Leben", "Etwa zwischen der dritten und der zwölften bis vierzehnten Lebenswoche durchlaufen Welpen eine besonders wichtige Phase, die Sozialisierungsphase. In dieser Zeit lernen sie, was normal und ungefährlich ist: andere Hunde, Menschen jeden Alters, Geräusche, Autos, Treppen, Staubsauger. Was sie jetzt in positiver Weise kennenlernen, macht ihnen später seltener Angst.\n\nDeshalb ist die Herkunft eines Welpen so wichtig. Gute Züchter lassen die Kleinen im Haus mit vielen Reizen aufwachsen und geben sie frühestens mit acht Wochen ab. Welpen aus dem illegalen Handel werden dagegen oft viel zu früh von der Mutter getrennt, sind häufig krank und schlecht sozialisiert – mit Folgen für ihr ganzes Leben."],
      ["Wie alt ist mein Hund in Menschenjahren?", "Die Faustregel „ein Hundejahr gleich sieben Menschenjahre“ ist zu einfach. Hunde entwickeln sich anfangs sehr schnell: Mit einem Jahr sind sie geschlechtsreif und fast ausgewachsen – das entspricht eher einem Menschen im Teenageralter. Danach verlangsamt sich die Alterung deutlich.\n\nDazu kommt die Größe: Anders als sonst im Tierreich leben kleine Hunde meist länger als große. Ein Chihuahua kann 15 Jahre und älter werden, eine Dogge ist mit acht bis zehn Jahren oft schon alt. Forschende entwickelten 2020 anhand chemischer Veränderungen am Erbgut eine genauere Formel, nach der ein einjähriger Hund etwa einem 30-jährigen Menschen entspricht – zumindest in dieser Hinsicht."],
      ["Gefährliche Leckereien", "Manches, was wir gern essen, ist für Hunde und Katzen giftig. Schokolade enthält Theobromin, das Tiere nur sehr langsam abbauen; besonders dunkle Schokolade und Kakaopulver können Herzrasen, Krämpfe und im schlimmsten Fall den Tod verursachen. Weintrauben und Rosinen können bei Hunden schon in kleinen Mengen die Nieren schädigen.\n\nZwiebeln und Knoblauch zerstören rote Blutkörperchen. Der Zuckeraustauschstoff Xylit, etwa in Kaugummi, löst bei Hunden einen gefährlichen Unterzucker aus. Für Katzen sind Lilien extrem giftig – schon Blütenstaub, den sie sich aus dem Fell lecken, kann zu Nierenversagen führen. Im Verdachtsfall sollte man sofort eine Tierarztpraxis anrufen, statt abzuwarten."],
      ["Die Familie der Katzen", "Zur Familie der Katzen gehören rund 40 Arten, vom Tiger bis zur Schwarzfußkatze, die kaum größer ist als ein Kätzchen. Man unterscheidet grob Großkatzen wie Löwe, Tiger, Leopard und Jaguar, die brüllen können, und Kleinkatzen wie Luchs, Puma, Gepard und Hauskatze. Ob eine Katze brüllen kann, hängt mit dem Bau ihres Kehlkopfes und Zungenbeins zusammen.\n\nIn Deutschland lebt mit der Europäischen Wildkatze eine scheue Verwandte unserer Hauskatzen. Sie ist etwas kräftiger, hat einen buschigen Schwanz mit stumpfem, schwarzem Ende und lebt versteckt in naturnahen Wäldern wie dem Harz oder der Eifel. Nach starkem Rückgang breitet sie sich dank Schutzmaßnahmen wieder aus."],
      ["Die Sinne der Katze", "Katzen sind Dämmerungsjäger. Sie kommen mit etwa einem Sechstel des Lichts aus, das wir zum Sehen brauchen. Ihre Pupillen können sich zu schmalen Schlitzen verengen oder fast das ganze Auge ausfüllen, und die spiegelnde Schicht hinter der Netzhaut nutzt jedes bisschen Licht doppelt. Direkt vor der Nase sehen sie allerdings unscharf.\n\nDort helfen die Schnurrhaare. Diese Tasthaare sind tief in der Haut verankert und mit vielen Nerven verbunden; sie erspüren kleinste Luftbewegungen, Hindernisse im Dunkeln und ob ein Durchgang breit genug ist. Auch das Gehör ist beeindruckend: Katzen hören sehr hohe Töne, weit über die Grenze von Hunden hinaus, und damit das feine Fiepen und Rascheln von Mäusen."],
      ["Warum Katzen nichts Süßes schmecken", "Katzen sind strenge Fleischfresser. Im Laufe der Evolution ist bei ihnen das Gen für einen Teil des Süß-Rezeptors auf der Zunge funktionslos geworden – sie können Süßes schlicht nicht schmecken. Für ein Tier, das fast nur Fleisch frisst, war der Verlust bedeutungslos.\n\nIhr Körper ist ganz auf tierische Nahrung eingestellt. Katzen benötigen zum Beispiel Taurin, einen Stoff, den sie anders als Hunde kaum selbst herstellen können; fehlt er, drohen Herzprobleme und Erblindung. Sie brauchen außerdem mehr Eiweiß als Hunde und fertiges Vitamin A. Deshalb ist Hundefutter für Katzen auf Dauer ungeeignet, und eine rein pflanzliche Ernährung ist für sie ohne sorgfältige Ergänzung gefährlich."],
      ["Katzen und Wasser", "Die Vorfahren der Hauskatze lebten in trockenen Regionen und bezogen einen Großteil ihrer Flüssigkeit aus der Beute. Bis heute haben viele Katzen nur ein schwaches Durstgefühl und trinken wenig. Nassfutter und mehrere Wasserstellen – gern etwas entfernt vom Futter, weil Katzen dort instinktiv kein Wasser erwarten – helfen gegen Nierenprobleme.\n\nWie Katzen trinken, untersuchten Physiker mit Hochgeschwindigkeitskameras: Sie tauchen nicht die ganze Zunge ein, sondern berühren die Wasseroberfläche nur mit der Zungenspitze und ziehen sie blitzschnell zurück. Dabei entsteht eine kleine Wassersäule, die sie im richtigen Moment mit dem Maul abschnappen. Und obwohl viele Katzen Wasser meiden, gibt es Rassen wie die Türkisch Van, die gern schwimmen."],
      ["Die raue Katzenzunge", "Die Zunge einer Katze fühlt sich an wie Schmirgelpapier. Sie ist mit Hunderten kleiner, nach hinten gerichteter Häkchen aus Keratin besetzt, den Papillen. Forschende entdeckten 2018, dass diese Häkchen hohl sind wie winzige Röhrchen: Sie saugen Speichel auf und geben ihn tief im Fell bis an die Haut ab. So reinigen und kühlen Katzen sich gleichzeitig.\n\nKatzen verbringen einen erheblichen Teil ihrer wachen Zeit mit Fellpflege. Das hält das Fell sauber, verteilt Hautfette, entfernt Parasiten und beruhigt. Dabei schlucken sie lose Haare, die sich als Haarballen im Magen sammeln können und wieder herausgewürgt werden. Gegenseitiges Putzen stärkt übrigens auch die Bindung zwischen Katzen, die sich gut verstehen."],
      ["Kratzen, Reiben, Markieren", "Katzen kratzen nicht, um Möbel zu ärgern. Beim Kratzen lösen sie alte Krallenhüllen, dehnen ihre Muskeln und hinterlassen sichtbare und riechbare Markierungen – an den Pfoten sitzen Duftdrüsen. Ein stabiler, ausreichend hoher Kratzbaum an einem zentralen Ort lenkt dieses Bedürfnis in erlaubte Bahnen.\n\nWenn eine Katze ihren Kopf an unseren Beinen reibt, verteilt sie Duftstoffe aus Drüsen an Wangen und Kinn. Sie markiert uns damit als Teil ihrer vertrauten Gruppe. Diese Gesichtsduftstoffe wirken beruhigend; künstliche Nachbildungen werden deshalb gegen Stress eingesetzt. Urinmarkieren in der Wohnung ist dagegen oft ein Zeichen von Stress, Konflikten oder einer Erkrankung."],
      ["Katzen, die Schlafkünstler", "Eine erwachsene Katze schläft oder döst im Schnitt zwölf bis sechzehn Stunden am Tag, junge und alte Tiere noch mehr. Viel davon ist leichter Schlaf, aus dem sie blitzschnell aufwachen können. Wie wir haben Katzen Tiefschlaf- und REM-Phasen, in denen Pfoten und Schnurrhaare zucken – vermutlich träumen sie.\n\nDer viele Schlaf ist ein Erbe ihrer Lebensweise als Jäger. Die Jagd auf Mäuse ist kurz und intensiv, dazwischen wird Energie gespart. Von Natur aus sind Katzen vor allem in der Dämmerung aktiv. Wohnungskatzen passen sich oft dem Rhythmus ihrer Menschen an – und wecken sie trotzdem gern am frühen Morgen, weil das ihre natürliche Aktivitätszeit ist."],
      ["Die Jagd der Hauskatze", "Auch satte Katzen jagen. Der Jagdtrieb ist vom Hunger weitgehend unabhängig, denn in der Natur braucht eine Katze viele kleine Beutetiere am Tag, und nicht jeder Versuch gelingt. Ob Maus, Vogel oder Spielzeug – Anschleichen, Lauern und Zupacken sind angeborene Verhaltensmuster, die befriedigt werden wollen.\n\nDie „Geschenke“ vor der Tür sind vermutlich keine Dankbarkeit, sondern Beute, die an einen sicheren Ort gebracht wird. Freigänger-Katzen erbeuten in Summe sehr viele Kleintiere, darunter Vögel, Eidechsen und Amphibien. Tägliche Jagdspiele, etwa mit einer Federangel, befriedigen den Trieb. In Gebieten mit seltenen Arten gibt es Diskussionen über Ausgangsbeschränkungen während der Brutzeit."],
      ["Warum Katzen miauen", "Erwachsene Katzen miauen untereinander kaum. Kätzchen miauen, um die Mutter zu rufen, doch im Erwachsenenalter verständigen sich Katzen vor allem über Körpersprache, Gerüche und Laute wie Fauchen, Knurren oder Gurren. Das Miauen haben sie weitgehend für uns Menschen beibehalten – vermutlich, weil wir so gut darauf reagieren.\n\nViele Katzen entwickeln mit ihren Menschen eine eigene „Sprache“ aus unterschiedlichen Miaus für Futter, Tür auf oder Aufmerksamkeit. Fremde Menschen können diese Laute oft nicht deuten, die eigenen Halter meist schon. Studien zeigen außerdem, dass Katzen die Stimme ihrer Bezugsperson von fremden Stimmen unterscheiden – auch wenn sie nicht immer darauf reagieren."],
      ["Heilige Katzen im Alten Ägypten", "Im Alten Ägypten genossen Katzen hohes Ansehen. Sie schützten die Getreidespeicher vor Mäusen und Häuser vor Schlangen. Die Göttin Bastet wurde mit Katzenkopf dargestellt; ihr Hauptheiligtum in Bubastis im Nildelta war ein großes Pilgerziel. Zu Festen reisten Tausende Menschen dorthin.\n\nDer griechische Geschichtsschreiber Herodot berichtete, dass sich Ägypter beim Tod ihrer Katze als Zeichen der Trauer die Augenbrauen abrasierten. Das Töten einer Katze soll schwer bestraft worden sein. Gleichzeitig wurden in späterer Zeit Katzen massenhaft gezüchtet und als Opfergaben mumifiziert – im 19. Jahrhundert fand man Friedhöfe mit Hunderttausenden Katzenmumien."],
      ["Katzen und Aberglaube", "In Europa hatten Katzen lange einen zwiespältigen Ruf. Im späten Mittelalter und in der frühen Neuzeit wurden sie, besonders schwarze, mit Hexerei in Verbindung gebracht und teils verfolgt. Daher stammt auch der Aberglaube, eine schwarze Katze, die von links über den Weg läuft, bringe Unglück.\n\nIn anderen Kulturen ist es genau umgekehrt: In Großbritannien und Japan gelten schwarze Katzen vielerorts als Glücksbringer. Die japanische Winkekatze Maneki-neko soll Kunden und Wohlstand anlocken. Eine oft erzählte These lautet, die Verfolgung der Katzen habe die Ausbreitung der Pest begünstigt, weil mehr Ratten überlebten – sie ist unter Historikern allerdings umstritten."],
      ["Berühmte Hunde", "Hachikō aus Japan ist der Inbegriff der Treue: Der Akita begleitete seinen Besitzer, einen Professor, täglich zum Bahnhof Shibuya in Tokio. Nach dessen plötzlichem Tod 1925 kam Hachikō fast zehn Jahre lang jeden Tag zur Ankunftszeit des Zuges. Heute steht dort eine Bronzestatue.\n\nIm Winter 1925 brachten Hundeschlitten-Staffeln dringend benötigtes Diphtherie-Serum durch Schneestürme in die Stadt Nome in Alaska. Der Leithund der letzten Etappe, Balto, wurde berühmt; die längste und schwierigste Strecke lief allerdings Togo. Und Laika wurde 1957 an Bord von Sputnik 2 das erste Lebewesen im Erdorbit – sie überlebte den Flug leider nicht, eine Rückkehr war nie vorgesehen."],
      ["Hunde im Dienst des Menschen", "Hunde arbeiten in vielen Berufen. Blindenführhunde leiten sehbehinderte Menschen sicher durch den Alltag – die erste Schule für Blindenführhunde entstand 1916 in Oldenburg, um Soldaten zu helfen, die im Ersten Weltkrieg erblindet waren. Assistenzhunde öffnen Türen, heben Gegenstände auf oder warnen Menschen mit Diabetes vor Unterzuckerung.\n\nRettungshunde finden Verschüttete nach Erdbeben und Vermisste im Gelände. Spürhunde erschnüffeln Sprengstoff, Drogen, Bettwanzen, Schimmel oder Trüffel. Im Naturschutz suchen speziell ausgebildete Hunde nach Kot seltener Tiere oder aufgespürten Schmuggelwaren aus Elfenbein. Therapiehunde besuchen Kliniken und Pflegeheime und helfen Menschen, Stress abzubauen."],
      ["Hund oder Katze – wer ist schlauer?", "Diese Frage wird gern gestellt, lässt sich aber kaum fair beantworten, weil beide Tiere sehr unterschiedliche Aufgaben meistern müssen. Eine Studie von 2017 zählte die Nervenzellen in der Großhirnrinde: Hunde kamen auf rund 500 Millionen, Katzen auf etwa 250 Millionen. Mehr Nervenzellen bedeuten aber nicht automatisch mehr „Intelligenz“ in jedem Bereich.\n\nHunde sind Spezialisten für Zusammenarbeit mit Menschen – sie lesen Gesten und lassen sich gut trainieren. Katzen sind Spezialisten für eigenständiges Problemlösen und Jagen. Sie verstehen zum Beispiel, dass versteckte Dinge weiter existieren, merken sich Wege und Verstecke und erkennen ihren Namen. Sie zeigen es nur seltener, weil ihnen unsere Anerkennung weniger bedeutet."],
      ["Haustiere und Gesundheit", "Viele Studien deuten darauf hin, dass Haustiere guttun. Hundebesitzer bewegen sich im Schnitt mehr, weil sie täglich spazieren gehen. Das Streicheln eines vertrauten Tieres kann Puls und Stresshormone senken. Für alleinlebende Menschen sind Tiere oft wichtige Gefährten gegen Einsamkeit.\n\nKinder, die mit Hund oder Katze aufwachsen, entwickeln laut einigen Untersuchungen etwas seltener Allergien – vermutlich, weil ihr Immunsystem früh mit vielen Mikroben in Kontakt kommt. Allerdings können Tiere auch Krankheiten übertragen, etwa Würmer oder Hautpilze. Regelmäßige Tierarztbesuche, Entwurmung und Händewaschen gehören deshalb dazu. Und nicht jeder Zusammenhang ist ursächlich: Gesündere Menschen schaffen sich vielleicht einfach eher ein Tier an."],
      ["Verantwortung für ein Tierleben", "Ein Haustier ist eine Entscheidung für viele Jahre: Katzen werden oft 15 Jahre und älter, Hunde je nach Größe zehn bis fünfzehn. Dazu kommen Kosten für Futter, Tierarzt, Versicherung, Steuer bei Hunden und Betreuung im Urlaub. In deutschen Tierheimen warten jedes Jahr viele Tiere, die aus unüberlegten Anschaffungen stammen.\n\nBeim Kauf lohnt ein kritischer Blick auf die Zucht. Rassen mit sehr kurzer Schnauze wie Mops oder Französische Bulldogge leiden oft unter Atemnot; Faltohrkatzen unter schmerzhaften Knorpelschäden. Das deutsche Tierschutzgesetz verbietet sogenannte Qualzucht ausdrücklich. Freigängerkatzen sollten kastriert werden – sonst entstehen schnell Streunerpopulationen mit viel Tierleid."]
    ],
